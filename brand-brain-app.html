    function bbxHas(v) {
      if (v == null) return false;
      if (typeof v === "string") return v.trim().length > 0;
      if (Array.isArray(v)) return v.some(bbxHas);
      if (typeof v === "object") return Object.values(v).some(bbxHas);
      return true;
    }

    function bbxFilled(sec, b) {
      if (!b) return false;
      return sec.keys.some(k => bbxHas(b[k]));
    }

      if (!b) return { score: 0, filledCount: 0, totalCount: bbxSecs.length };

      const score = Math.round((filledCount / bbxSecs.length) * 100);
      return { score, filledCount, totalCount: bbxSecs.length };
    }

    // --- UNIVERSAL IMPORTER ---
    function parseUniversalImport(rawText, fileName = "") {
      const text = rawText.trim();
      const isJson = fileName.toLowerCase().endsWith(".json") || text.startsWith("{");

      if (isJson) {
        let parsed;
        try {
          parsed = JSON.parse(text);
        } catch (err) {
          throw new Error("Format JSON tidak valid: " + err.message);
        }

        // 1. Funnel Connector
        if (parsed.schema === "brand-brain-connector" || parsed.funnel) {
          return { type: "connector", brand: bbiFromConnector(parsed), raw: parsed };
        }
        // 2. Backup JSON
        if (parsed.type === "brand-brain-export" && parsed.brand) {
          return { type: "backup", brand: parsed.brand, raw: parsed };
        }
        // 3. Generic Brand Object
        const obj = parsed.brand || parsed.data || parsed.dna || parsed;
        return { type: "generic", brand: obj, raw: parsed };
      } else {
        // Markdown parsing
        return { type: "markdown", brand: parseMarkdownToBrand(text), raw: text };
      }
    }

    function parseMarkdownToBrand(text) {
      const b = { ...DEFAULT_TRAJECTO, id: "brand-" + Date.now(), name: "Brand Baru" };
      const lines = text.split("\n");
      lines.forEach(line => {
        const clean = line.replace(/[*_#]/g, "").trim();
        const m = clean.match(/^([^:=]+)[:=](.+)$/);
        if (m) {
          const k = m[1].toLowerCase().trim();
          const val = m[2].trim();
          if (k.includes("nama brand") || k === "brand") b.name = val;
          else if (k.includes("kategori") || k === "category") b.category = val;
          else if (k.includes("produk") || k === "product") b.product = val;
          else if (k.includes("promise") || k.includes("janji")) b.brandPromise = val;
          else if (k.includes("usp") || k.includes("keunggulan")) b.usp = val;
          else if (k.includes("tone") || k.includes("nada")) b.tone = val;
          else if (k.includes("cta") || k.includes("ajakan")) b.cta = val;
          else if (k.includes("warna") || k.includes("color")) b.color = val;
          else if (k.includes("instagram") || k.includes("ig")) b.instagramHandle = val;
        }
      });
      return b;
    }

    function parseBriefImport(text, fileName) {
      const out = { name: "", industry: "", scale: "", productTitle: "", productDesc: "", target: "", details: "" };
      let j = null;
      try { j = JSON.parse(text); } catch (err) {}
      if (j && typeof j === "object") {
        if (j.schema === "brand-brief" && j.form) {
          const f = j.form;
          out.name = f.brand_name || "";
          out.industry = (f.industry && f.industry.label) || "";
          out.scale = (f.scale && f.scale.label) || "";
          out.productTitle = (f.product && f.product.title) || "";
          out.productDesc = (f.product && f.product.description) || "";
          out.target = (f.product && f.product.target) || "";
          out.details = f.details || "";
          return out;
        }
        const res = parseUniversalImport(text, fileName);
        const b = res.brand || {};
        out.name = b.name || "";
        out.industry = b.category || "";
        out.productTitle = b.product || "";
        out.target = b.audience || "";
        const lines = [];
        if (b.brandPromise) lines.push("Janji brand: " + b.brandPromise);
        if (b.usp) lines.push("USP: " + b.usp);
        if (b.tone) lines.push("Tone: " + b.tone);
        out.details = lines.join("\n");
        return out;
      }
      const map = [
        ["name", /^(nama brand|nama|brand)\s*[:：]\s*(.+)$/i],
        ["industry", /^(industri|kategori)\s*[:：]\s*(.+)$/i],
        ["scale", /^(skala bisnis|skala)\s*[:：]\s*(.+)$/i],
        ["productTitle", /^(produk\/layanan utama|produk utama|produk|layanan)\s*[:：]\s*(.+)$/i],
        ["target", /^(target pasar awal|target|audiens|audience)\s*[:：]\s*(.+)$/i]
      ];
      const rest = [];
      String(text).split(/\r?\n/).forEach(line => {
        const t = line.replace(/^[\s>*\-#]+/, "").replace(/\*\*/g, "").trim();
        let hit = false;
        for (const pair of map) {
          const m = t.match(pair[1]);
          if (m && !out[pair[0]]) { out[pair[0]] = m[2].trim(); hit = true; break; }
        }
        if (!hit) rest.push(line);
      });
      out.details = rest.join("\n").trim();
      return out;
    }

      foundation: { label: "Fondasi", keys: ["category", "product", "brandPromise", "mission", "vision", "values", "audience", "usp", "tone", "cta", "positioning"] },
      market: { label: "Kompetitor & Pasar", keys: ["competitorContext"] },
      audience: { label: "Audience DNA", keys: ["audienceDNA"] },
      offer: { label: "Penawaran & Bukti", keys: ["offerConversionDNA", "proofCredibility"] },
      personality: { label: "Karakter & Gaya", keys: ["personalityVoice", "visualDNA"] },
      content: { label: "Content DNA", keys: ["contentDNA"] },
      memory: { label: "Brand Memory", keys: ["brandMemory"] }
    };

    function secIsEmpty(v) {
      if (v === null || v === undefined) return true;
      if (typeof v === "string") return !v.trim();
      if (Array.isArray(v)) return v.length === 0 || v.every(secIsEmpty);
      if (typeof v === "object") return Object.values(v).every(secIsEmpty);
      return false;
    }

    function secBlank(v) {
      if (Array.isArray(v)) return v.length ? [secBlank(v[0])] : [];
      if (v && typeof v === "object") { const o = {}; Object.keys(v).forEach(k => { o[k] = secBlank(v[k]); }); return o; }
      return "";
    }

    function secMergeFill(cur, ai) {
      if (secIsEmpty(cur)) return ai === undefined ? cur : ai;
      if (cur && typeof cur === "object" && !Array.isArray(cur) && ai && typeof ai === "object" && !Array.isArray(ai)) {
        const out = { ...cur };
        Object.keys(ai).forEach(k => { out[k] = secMergeFill(cur[k], ai[k]); });
        return out;
      }
      return cur;
    }

    async function callGeminiSection(brand, keys, mode) {
      const template = {};
      keys.forEach(k => {
        template[k] = secBlank(brand[k] !== undefined && !secIsEmpty(brand[k]) ? brand[k] : (DEFAULT_TRAJECTO[k] !== undefined ? DEFAULT_TRAJECTO[k] : ""));
      });
      const modeText = mode === "fill"
        ? "Lengkapi HANYA field yang masih kosong. Field yang sudah terisi biarkan sama persis."
        : "Perbaiki dan tulis ulang seluruh field agar lebih tajam, spesifik, konsisten, dan tidak generik.";
      const systemPrompt = "Anda adalah Chief Brand Strategist senior. Berikut Brand Brain saat ini:\n\n" + compileBrandBrainPrompt(brand) +
        "\n\nTugas: isi/perbaiki hanya bagian berikut: " + keys.join(", ") + ". " + modeText +
        " Gunakan bahasa yang sama dengan Brand Brain, selaras dengan bagian lain, dan jangan mengarang fakta (angka, testimoni, klaim) yang tidak ada di data; jika tidak ada dasar, tulis saran yang jelas ditandai sebagai asumsi. Kembalikan HANYA JSON murni tanpa markdown dengan struktur field persis seperti template ini (isi nilainya, jangan salin contoh dari brand lain): " + JSON.stringify(template);
      const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=";
      const resp = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ role: 'user', parts: [{ text: systemPrompt }] }],
          generationConfig: { temperature: 0.5, responseMimeType: "application/json" }
        })
      });
      if (!resp.ok) {
        const errText = await resp.text();
        throw new Error("Gemini API Error (" + resp.status + "): " + errText);
      }
      const data = await resp.json();
      const content = data.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!content) throw new Error("Tidak ada balasan dari Gemini AI.");
      const clean = content.replace(/^\s*```json/i, "").replace(/^\s*```/i, "").replace(/```\s*$/i, "").trim();
      return JSON.parse(clean);
    }

    // --- BRAND BRAIN AUDITOR ---
    async function callGeminiAudit(brand) {
      const systemPrompt = "Anda adalah auditor brand strategy yang kritis dan jujur. Berikut Brand Brain yang akan diaudit:\n\n" + compileBrandBrainPrompt(brand) +
        "\n\nAudit profil ini. Cari: (1) kontradiksi antar bagian (misal tone vs voiceDont, USP vs positioning, klaim vs guardrail), (2) isi yang terlalu generik atau bisa dipakai brand mana pun, (3) bagian penting yang kosong atau tipis, (4) klaim berisiko tanpa bukti. Jangan memuji berlebihan; hanya laporkan temuan nyata dan spesifik, sebut isi yang bermasalah. Kembalikan HANYA JSON murni: { qualityScore: angka 0-100 untuk kualitas isi (bukan kelengkapan), verdict: ringkasan 2 kalimat, issues: [{ severity: 'tinggi'|'sedang'|'rendah', type: 'kontradiksi'|'generik'|'kosong'|'klaim', tab: salah satu dari 'foundation','market','audience','offer','personality','content','memory','custom', problem: penjelasan masalah spesifik, suggestion: saran perbaikan konkret }] } Maksimal 10 issues, urutkan dari severity tertinggi.";
      const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=";
      const resp = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ role: 'user', parts: [{ text: systemPrompt }] }],
          generationConfig: { temperature: 0.2, responseMimeType: "application/json" }
        })
      });
      if (!resp.ok) {
        const errText = await resp.text();
        throw new Error("Gemini API Error (" + resp.status + "): " + errText);
      }
      const data = await resp.json();
      const content = data.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!content) throw new Error("Tidak ada balasan dari Gemini AI.");
      const clean = content.replace(/^\s*```json/i, "").replace(/^\s*```/i, "").replace(/```\s*$/i, "").trim();
      return JSON.parse(clean);
    }

    // --- MAIN REACT APP ---
    function BrandBrainApp() {
      // LocalStorage Key
      const PROFILES_KEY = "brand_brain_studio_profiles";
      const ACTIVE_ID_KEY = "brand_brain_studio_active_id";

      // State
      const [profiles, setProfiles] = useState(() => {
        try {
          const saved = localStorage.getItem(PROFILES_KEY);
          if (saved) return JSON.parse(saved);
        } catch(err) {}
        return [DEFAULT_TRAJECTO];
      });

      const [activeId, setActiveId] = useState(() => {
        return localStorage.getItem(ACTIVE_ID_KEY) || DEFAULT_TRAJECTO.id;
      });

      const activeBrand = useMemo(() => {
        return profiles.find(p => p.id === activeId) || profiles[0] || DEFAULT_TRAJECTO;
      }, [profiles, activeId]);

      const [activeTab, setActiveTab] = useState("foundation");
      const [showAiBox, setShowAiBox] = useState(true);
      const [rawExtractText, setRawExtractText] = useState("");
      const [isExtracting, setIsExtracting] = useState(false);
      const [analysisNote, setAnalysisNote] = useState(null);
      const [uploadedFileName, setUploadedFileName] = useState(null);
      const [copiedItem, setCopiedItem] = useState(null);
      const [showProfilesModal, setShowProfilesModal] = useState(false);
      const [showNewBrandModal, setShowNewBrandModal] = useState(false);
      const [notification, setNotification] = useState(null);

      // Riwayat versi
      const HISTORY_KEY = "brand_brain_studio_history";
      const [history, setHistory] = useState(() => {
        try {
          const saved = localStorage.getItem(HISTORY_KEY);
          if (saved) return JSON.parse(saved);
        } catch(err) {}
        return [];
      });

      useEffect(() => {
        try {
          localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        } catch(err) {}
      }, [history]);

      const pushSnapshot = (label) => {
        setHistory(h => {
          const latest = h.find(x => x.brandId === activeBrand.id);
          if (latest && JSON.stringify(latest.data) === JSON.stringify(activeBrand)) return h;
          const entry = {
            id: Date.now() + "-" + Math.random().toString(36).slice(2, 6),
            brandId: activeBrand.id,
            ts: new Date().toISOString(),
            label,
            data: activeBrand
          };
          const counts = {};
          return [entry, ...h].filter(x => {
            counts[x.brandId] = (counts[x.brandId] || 0) + 1;
            return counts[x.brandId] <= 10;
          }).slice(0, 40);
        });
      };

      const restoreSnapshot = (entry) => {
        pushSnapshot("Sebelum restore");
        updateBrand(() => ({ ...entry.data }));
        notify("Versi \"" + entry.label + "\" berhasil dikembalikan.", "success");
      };

      // Auditor states
      const [auditResult, setAuditResult] = useState(null);
      const [auditLoading, setAuditLoading] = useState(false);

      const handleAudit = async () => {
        setAuditLoading(true);
        try {
          const res = await callGeminiAudit(activeBrand);
          setAuditResult({ brandId: activeBrand.id, ...res });
        } catch (err) {
          notify(err.message || "Gagal menjalankan audit.", "error");
        } finally {
          setAuditLoading(false);
        }
      };

      // AI per bagian states
      const [secLoading, setSecLoading] = useState(false);
      const [secUndo, setSecUndo] = useState(null);

      const handleSectionAI = async (mode) => {
        const cfg = SECTION_AI[activeTab];
        if (!cfg) return;
        setSecLoading(true);
        try {
          const ai = await callGeminiSection(activeBrand, cfg.keys, mode);
          pushSnapshot("Sebelum AI: " + cfg.label + (mode === "fill" ? " (lengkapi)" : " (perbaiki)"));
          const prev = {};
          cfg.keys.forEach(k => { prev[k] = activeBrand[k]; });
          updateBrand(p => {
            const next = { ...p };
            cfg.keys.forEach(k => {
              if (ai[k] === undefined) return;
              next[k] = mode === "fill" ? secMergeFill(p[k], ai[k]) : ai[k];
            });
            return next;
          });
          setSecUndo({ brandId: activeBrand.id, tab: activeTab, prev });
          notify("Bagian " + cfg.label + (mode === "fill" ? " dilengkapi AI." : " diperbaiki AI."), "success");
        } catch (err) {
          notify(err.message || "Gagal memproses bagian ini.", "error");
        } finally {
          setSecLoading(false);
        }
      };

      const handleSectionUndo = () => {
        if (!secUndo) return;
        updateBrand(p => ({ ...p, ...secUndo.prev }));
        setSecUndo(null);
        notify("Perubahan AI dibatalkan.", "success");
      };

      // Playground states
      const [pgType, setPgType] = useState("caption");
      const [pgTopic, setPgTopic] = useState("");
      const [pgResult, setPgResult] = useState("");
      const [pgLoading, setPgLoading] = useState(false);

      const handlePlayground = async () => {
        const t = PLAYGROUND_TYPES.find(x => x.id === pgType) || PLAYGROUND_TYPES[0];

          const out = await callGeminiText(compileBrandBrainPrompt(activeBrand), task);
          setPgResult(out);

          notify(err.message || "Gagal menjalankan tes.", "error");
        } finally {
          setPgLoading(false);
        }
      };

      // Export & Import states
      const [exportOpen, setExportOpen] = useState(false);
      const [showHistory, setShowHistory] = useState(false);

      // Save profiles to localStorage
      useEffect(() => {
        try {
          localStorage.setItem(PROFILES_KEY, JSON.stringify(profiles));
        } catch(err) {}
      }, [profiles]);

      // Save activeId
      useEffect(() => {
        try {
          localStorage.setItem(ACTIVE_ID_KEY, activeId);
        } catch(err) {}
      }, [activeId]);

      const notify = (msg, type = "success") => {
        setNotification({ msg, type });
        setTimeout(() => setNotification(null), 3500);
      };

      const updateBrand = (updater) => {
        setProfiles(prev => prev.map(p => {
          if (p.id === activeBrand.id) {
            const next = typeof updater === "function" ? updater(p) : { ...p, ...updater };
            return next;
          }
          return p;
        }));
      };

      const copyToClipboard = (text, label) => {
        navigator.clipboard.writeText(text).then(() => {
          setCopiedItem(label);
          setTimeout(() => setCopiedItem(null), 2000);
          notify(label + " berhasil disalin ke clipboard!", "success");
        }).catch(() => {
          notify("Gagal menyalin teks.", "error");
        });
      };

      const downloadFile = (content, filename, mimeType) => {
        const blob = new Blob([content], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        notify("File " + filename + " berhasil diunduh!", "success");
      };

      // Handle Quick Extract
      const handleExtract = async () => {
        const gName = wizName.trim();
        if (!gName) {
          notify("Nama brand wajib diisi pada panduan di atas.", "info");
          return;
        }
        const gInd = WIZ_INDUSTRIES.find(x => x.id === wizIndustry);
        const gScl = WIZ_SCALES.find(x => x.id === wizScale);
        const gPresets = WIZ_PRODUCTS[wizIndustry] || [];
        const gCustomProd = wizIndustry === "kustom" || wizProduct === -1;
        const gIndLabel = wizIndustry === "kustom" ? wizIndustryCustom.trim() : gInd.label;
        const gSclLabel = wizScale === "kustom" ? wizScaleCustom.trim() : gScl.label + " (" + gScl.desc + ")";
        const gProd = gCustomProd ? null : gPresets[wizProduct];
        const gProdLabel = gCustomProd ? wizProductCustom.trim() : gProd[0] + " - " + gProd[1];
        if (!gIndLabel) { notify("Ketik industri Anda pada panduan di atas.", "info"); return; }
        if (!gSclLabel) { notify("Tentukan skala bisnis Anda pada panduan di atas.", "info"); return; }
        if (!gProdLabel) { notify("Tuliskan produk atau jasa utama Anda pada panduan di atas.", "info"); return; }
        const rawGuide = "Nama brand: " + gName + "\nIndustri: " + gIndLabel + "\nSkala bisnis: " + gSclLabel +
          "\nProduk/layanan utama: " + gProdLabel + (gProd ? "\nTarget pasar awal: " + gProd[2] : "") +
          (rawExtractText.trim() ? "\n\nDetail tambahan dari pemilik brand:\n" + rawExtractText.trim() : "") +
          "\n\nSusun Brand Brain lengkap dalam bahasa Indonesia. Gunakan asumsi yang masuk akal untuk pasar Indonesia, dan jangan mengarang testimoni, angka omset, atau penghargaan.";
        setIsExtracting(true);
        try {
          const res = await callGeminiExtract(rawGuide);
          pushSnapshot("Sebelum ekstrak AI");
          updateBrand(prev => ({
            ...prev,
            ...res.brand,
            name: gName,
            category: res.brand.category || gIndLabel,
            color: res.brand.color || prev.color || "#205c49"
          }));
          setAnalysisNote(res.analysisSummary);
          notify('Brand Brain "' + (res.brand.name || "Brand") + '" berhasil diekstrak!', "success");
        } catch (err) {
          notify(err.message || "Gagal mengekstrak profil brand.", "error");
        } finally {
          setIsExtracting(false);
        }
      };

      // File upload in Quick Start
      const handleQuickFileUpload = (ev) => {
        const file = ev.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        const isJson = file.name.toLowerCase().endsWith(".json");
        reader.onload = e => {
          const text = e.target.result;
          if (isJson) {
            try {
              const res = parseUniversalImport(text, file.name);
              pushSnapshot("Sebelum impor file");
              updateBrand(prev => applyImportMerge(prev, res.brand, "replace"));
              setUploadedFileName(file.name);
              notify("File " + file.name + " berhasil diimpor langsung!", "success");
            } catch(err) {
              notify(err.message, "error");
            }
          } else {
            setRawExtractText(text);
            setUploadedFileName(file.name);
            setShowAiBox(true);
            notify('File "' + file.name + '" dimuat. Klik \'Ekstrak Brand Brain via AI\' untuk memproses.', "info");
          }
        };
        reader.readAsText(file);
        ev.target.value = "";
      };

      // Manage Profiles
      // Panduan pengisian ekstraksi (industri, skala, produk)
      const [wizName, setWizName] = useState("");
      const [wizIndustry, setWizIndustry] = useState("kuliner");
      const [wizIndustryCustom, setWizIndustryCustom] = useState("");
      const [wizScale, setWizScale] = useState("umkm");
      const [wizScaleCustom, setWizScaleCustom] = useState("");
      const [wizProduct, setWizProduct] = useState(0);
      const [wizProductCustom, setWizProductCustom] = useState("");
      const [impOpen, setImpOpen] = useState(false);
      const [impText, setImpText] = useState("");

      const getFormSnapshot = () => {
        const used = wizName.trim() !== "";
        if (!used) {
          return { name: activeBrand.name || "", industry: activeBrand.category || "", scale: "", productTitle: activeBrand.product || "", productDesc: "", target: activeBrand.audience || "", details: rawExtractText.trim() };
        }
        const ind = WIZ_INDUSTRIES.find(x => x.id === wizIndustry);
        const scl = WIZ_SCALES.find(x => x.id === wizScale);
        const presets = WIZ_PRODUCTS[wizIndustry] || [];
        const customProd = wizIndustry === "kustom" || wizProduct === -1;
        const pr = customProd ? null : presets[wizProduct];
        return {
          name: wizName.trim(),
          industry: wizIndustry === "kustom" ? wizIndustryCustom.trim() : (ind ? ind.label : ""),
          scale: wizScale === "kustom" ? wizScaleCustom.trim() : (scl ? scl.label : ""),
          productTitle: customProd ? wizProductCustom.trim() : (pr ? pr[0] : ""),
          productDesc: pr ? pr[1] : "",
          target: pr ? pr[2] : "",
          details: rawExtractText.trim()
        };
      };

      const doExport = (fmt) => {
        const base = "brand-brain-" + (activeBrand.name || "brand").toLowerCase().replace(/[^a-z0-9]+/g, "-");
        setExportOpen(false);
        if (fmt === "brief-html") {
          downloadFile(buildBriefHtml(activeBrand, getFormSnapshot()), base + "-brief.html", "text/html");
        } else if (fmt === "brief-json") {
          downloadFile(JSON.stringify(buildBriefJson(activeBrand, getFormSnapshot()), null, 2), base + "-brief.json", "application/json");
        } else if (fmt === "connector") {
          downloadFile(JSON.stringify(exportConnectorJson(activeBrand), null, 2), base + "-connector.json", "application/json");
        } else if (fmt === "backup") {
          downloadFile(JSON.stringify({ type: "brand-brain-export", version: "1.0", exportedAt: new Date().toISOString(), brand: activeBrand }, null, 2), base + "-backup.json", "application/json");
        } else {
          const blankConn = exportConnectorJson({});
          blankConn.readme = "Template kosong skema konektor. Struktur key selalu sama pada file yang berisi data.";
          downloadFile(JSON.stringify(blankConn, null, 2), "brand-brain-connector-template.json", "application/json");
        }
      };

      const applyBriefImport = (d) => {
        const norm = x => (x || "").toLowerCase().trim();
        const match = (label, val) => norm(label) === norm(val) || norm(label).includes(norm(val)) || norm(val).includes(norm(label));
        if (d.name) setWizName(d.name);

        let indId = wizIndustry;
        if (d.industry) {
          const hit = WIZ_INDUSTRIES.find(x => x.id !== "kustom" && match(x.label, d.industry));
          if (hit) { indId = hit.id; setWizIndustry(hit.id); }
          else { indId = "kustom"; setWizIndustry("kustom"); setWizIndustryCustom(d.industry); }
        }

        if (d.scale) {
          const hit = WIZ_SCALES.find(x => x.id !== "kustom" && match(x.label, d.scale));
          if (hit) setWizScale(hit.id);
          else { setWizScale("kustom"); setWizScaleCustom(d.scale); }

        const presets = WIZ_PRODUCTS[indId] || [];
        if (d.productTitle) {
          const idx = indId === "kustom" ? -1 : presets.findIndex(pr => match(pr[0], d.productTitle));
          if (idx >= 0) setWizProduct(idx);
          else {
            setWizProduct(-1);
            setWizProductCustom([d.productTitle, d.productDesc, d.target ? "Target: " + d.target : ""].filter(Boolean).join(". "));
          }

          setWizProduct(indId === "kustom" ? -1 : 0);
        }

        if (d.details) setRawExtractText(d.details);
        setShowAiBox(true);

      const importBriefText = (text, fileName) => {
        try {
          applyBriefImport(parseBriefImport(text, fileName));
          setImpText("");

          notify(err.message || "Gagal mengimpor data.", "error");

      };

      const handleBriefImportFile = (ev) => {

        const reader = new FileReader();
        reader.onload = x => importBriefText(x.target.result, file.name);

      const createNewBrand = () => {
        const newB = {
          ...DEFAULT_TRAJECTO,
          id: "brand-" + Date.now(),
          name: "Brand Baru (" + (profiles.length + 1) + ")",
          category: "",
          product: "",
          brandPromise: "",
          audience: "",
          usp: "",
          positioning: { weAre: "", forAudience: "", whoNeed: "", becauseWhy: "", unlike: "", statement: "" }
        };
        setProfiles(prev => [...prev, newB]);
        setActiveId(newB.id);
        setShowProfilesModal(false);
        notify('Profil "' + newB.name + '" berhasil dibuat!', "success");

      const duplicateBrand = (b) => {

          ...JSON.parse(JSON.stringify(b)),

        };

        setActiveId(dup.id);

        const b = profiles.find(p => p.id === id);
        if (confirm('Hapus profil "' + (b ? b.name : id) + '"?')) {

          setProfiles(next);
          if (activeId === id) setActiveId(next[0].id);
          notify("Profil berhasil dihapus.", "info");
        }
      };

      const resetTrajecto = () => {
        if (confirm("Reset profil aktif ke Trajecto (standar demo)? Perubahan belum diekspor akan ditimpa.")) {
          updateBrand(() => ({ ...DEFAULT_TRAJECTO, id: activeBrand.id }));
          notify("Profil berhasil di-reset ke Trajecto!", "success");
        }
      };

      const completeness = calculateBrainCompleteness(activeBrand);

      // --- TABS DEFINITION ---
      const tabs = [
        { id: "foundation", num: "1", title: "Fondasi", sub: "Positioning" },
        { id: "market", num: "2", title: "Kompetitor", sub: "Rival & Pasar" },
        { id: "audience", num: "3", title: "Audience DNA", sub: "Pain & Persona" },
        { id: "offer", num: "4", title: "Penawaran", sub: "Bukti & Garansi" },
        { id: "personality", num: "5", title: "Karakter & Gaya", sub: "Voice & Visual" },
        { id: "content", num: "6", title: "Content DNA", sub: "Pilar & CTA" },
        { id: "memory", num: "7", title: "Brand Memory", sub: "Guardrails" },

                  onChange: ev => setWizProductCustom(ev.target.value),
                  placeholder: "Tuliskan produk/jasa utama, siapa targetnya, dan apa yang membuatnya berbeda",
                  className: "w-full px-3 py-2 rounded-xl border border-[#EAE6F3] text-xs bg-white outline-none"
                })
              )
            ),

            showAiBox && e('div', { className: "mt-3 space-y-2.5" },
              e('textarea', {
                rows: 3,
                value: rawExtractText,
                onChange: ev => setRawExtractText(ev.target.value),
                placeholder: "Detail tambahan (opsional). Contoh: Saya punya brand skincare lokal 'Dew Botanicals' untuk wanita pekerja 25-35 tahun yang sibuk. Pembeda kami adalah formula minimalis 3 langkah bebas alkohol dengan hasil calming dalam 7 hari...",
                className: "w-full p-3 rounded-xl border border-[#EAE6F3] text-xs focus:ring-2 focus:ring-[#6C43E3]/20 focus:border-[#6C43E3] focus:border-[#205c49] outline-none bg-[#F8F7FC]/50"
              }),
              e('div', { className: "flex items-center justify-between gap-3 flex-wrap" },
                e('label', { className: "cursor-pointer inline-flex items-center gap-1.5 text-xs text-gray-600 hover:text-gray-900" },
                  e(Icon, { name: 'upload', className: "w-3.5 h-3.5" }),
                  e('span', null, uploadedFileName ? ("File: " + uploadedFileName) : "Unggah proposal/dokumen (.md / .json / .txt)"),
                  e('input', {
                    type: "file",
                    accept: ".json,.md,.markdown,.txt",
                    onChange: handleQuickFileUpload,
                    className: "hidden"
                  })
                ),
                e('button', {
                  type: "button",
                  disabled: isExtracting,
                  onClick: handleExtract,
                  className: "px-5 py-2.5 rounded-xl bg-gradient-to-r from-[#A051E6] to-[#6C43E3] hover:from-[#ED8A33] hover:to-[#ED8A33] text-white text-xs font-semibold flex items-center gap-1.5 transition-all duration-300 shadow-sm cursor-pointer disabled:opacity-50"
                },
                  e(Icon, { name: isExtracting ? 'refresh' : 'sparkles', className: "w-3.5 h-3.5 " + (isExtracting ? 'animate-spin' : 'text-amber-300') }),
                  e('span', null, isExtracting ? "Menganalisis & Mengisi Brain..." : "Ekstrak Brand Brain via AI")
                )
              ),
              analysisNote && e('div', { className: "p-3.5 rounded-2xl bg-[#F4F1FA] border border-[#EAE6F3] text-xs text-[#5B21B6] flex items-start gap-2.5" },
                e(Icon, { name: 'check', className: "w-4 h-4 text-[#6C43E3] shrink-0 mt-0.5" }),
                e('div', null,
                  e('strong', { className: "font-bold" }, "Analisis Strategis: "),
                  e('span', null, analysisNote)
                )
              )
            )
          )
            ),
            e('div', { className: "p-4 sm:px-6 bg-[#F8F7FC] border-t border-[#EAE6F3] flex items-center justify-end gap-2 shrink-0" },
              e('button', {
                type: "button",
                onClick: () => setShowNewBrandModal(false),
                className: "px-4 py-2 rounded-xl border border-[#EAE6F3] text-gray-600 text-xs font-semibold hover:bg-white cursor-pointer"
              }, "Tutup / Batal")
            )
          )
        ),
        // --- RIWAYAT VERSI MODAL ---
        showHistory && e('div', { className: "fixed inset-0 z-50 bg-black/40 backdrop-blur-xs flex items-center justify-center p-4" },
          e('div', { className: "bg-white rounded-[28px] max-w-md w-full p-6 space-y-4 shadow-xl border border-[#EAE6F3]" },
            e('div', { className: "flex items-center justify-between" },
              e('div', null,
                e('h3', { className: "text-sm font-bold text-gray-900" }, "🕘 Riwayat Versi"),
                e('p', { className: "text-[11px] text-gray-500" }, "Snapshot otomatis sebelum AI atau impor mengubah data. Maksimal 10 per profil.")
              ),
              e('button', {
                type: "button",
                onClick: () => setShowHistory(false),
                className: "text-gray-400 hover:text-gray-600 text-sm font-bold cursor-pointer"
              }, "✕")
            ),
            e('button', {
              type: "button",
              onClick: () => { pushSnapshot("Snapshot manual"); notify("Snapshot manual disimpan.", "success"); },
              className: "px-3 py-1.5 rounded-xl border border-[#EAE6F3] bg-white text-xs font-medium text-gray-700 cursor-pointer"
            }, "+ Simpan Snapshot"),
            history.filter(x => x.brandId === activeBrand.id).length === 0
              ? e('p', { className: "text-xs text-gray-400" }, "Belum ada riwayat.")
              : e('div', { className: "space-y-1.5 max-h-72 overflow-y-auto" },
                  history.filter(x => x.brandId === activeBrand.id).map(h => e('div', {
                    key: h.id,
                    className: "p-2.5 rounded-lg bg-[#F8F7FC] border border-[#EAE6F3] flex items-center justify-between gap-2"
                  },
                    e('div', { className: "min-w-0" },
                      e('div', { className: "text-xs font-semibold text-gray-800 truncate" }, h.label),
                      e('div', { className: "text-[10px] text-gray-400" }, new Date(h.ts).toLocaleString("id-ID"))
                    ),
                    e('div', { className: "flex items-center gap-1 shrink-0" },
                      e('button', {
                        type: "button",
                        onClick: () => { restoreSnapshot(h); setShowHistory(false); },
                        className: "px-2.5 py-1 rounded-lg bg-[#205c49] text-white text-[11px] font-semibold cursor-pointer"
                      }, "Kembalikan"),
                      e('button', {
                        type: "button",
                        onClick: () => setHistory(prev => prev.filter(x => x.id !== h.id)),
                        title: "Hapus snapshot",
                        className: "p-1 text-red-500 hover:text-red-700 cursor-pointer"
                      }, e(Icon, { name: 'trash', className: "w-3.5 h-3.5" }))
                    )
                  ))
                )
          )
        ),

        // --- PROFILES MANAGEMENT MODAL ---
        showProfilesModal && e('div', { className: "fixed inset-0 z-50 bg-black/40 backdrop-blur-xs flex items-center justify-center p-4" },
          e('div', { className: "bg-white rounded-[28px] max-w-md w-full p-6 space-y-4 shadow-xl border border-[#EAE6F3]" },
            e('div', { className: "flex items-center justify-between" },
              e('h3', { className: "text-sm font-bold text-gray-900" }, "Daftar Profil Brand"),
              e('button', {
                type: "button",
                onClick: () => setShowProfilesModal(false),
                className: "text-gray-400 hover:text-gray-600 text-sm font-bold cursor-pointer"
              }, "✕")
            ),
            e('div', { className: "space-y-2 max-h-60 overflow-y-auto" },
              profiles.map(p => {
                const isCur = p.id === activeBrand.id;
                return e('div', {
                  key: p.id,
                  className: "p-3 rounded-xl border flex items-center justify-between gap-2 " + (
                    isCur ? 'border-[#205c49] bg-emerald-50/50' : 'border-[#EAE6F3] bg-white'
                  )
                },
                  e('div', {
                    onClick: () => {
                      setActiveId(p.id);
                      setShowProfilesModal(false);
                    },
                    className: "flex items-center gap-2 cursor-pointer flex-1"
                  },
                    e('span', { className: "w-3 h-3 rounded-full shrink-0", style: { backgroundColor: p.color || "#205c49" } }),
                    e('div', { className: "text-xs font-bold text-gray-800 truncate" }, p.name || "Brand"),
                    isCur && e('span', { className: "text-[10px] px-1.5 py-0.2 rounded bg-emerald-100 text-emerald-800 font-bold" }, "Aktif")
                  ),
                  e('div', { className: "flex items-center gap-1" },
                    e('button', {
                      type: "button",
                      onClick: () => duplicateBrand(p),
                      title: "Duplikat Profil",
                      className: "p-1.5 text-gray-500 hover:text-gray-700 cursor-pointer"
                    }, e(Icon, { name: 'copy', className: "w-3.5 h-3.5" })),
                    e('button', {
                      type: "button",
                      disabled: profiles.length <= 1,
                      onClick: () => deleteBrand(p.id),
                      title: "Hapus Profil",
                      className: "p-1.5 text-red-500 hover:text-red-700 disabled:opacity-30 cursor-pointer"
                    }, e(Icon, { name: 'trash', className: "w-3.5 h-3.5" }))
                  )
                );
              })
            ),
            e('div', { className: "flex gap-2 pt-2 border-t" },
              e('button', {
                type: "button",
                onClick: createNewBrand,
                className: "flex-1 py-2 rounded-xl bg-[#205c49] text-white text-xs font-bold flex items-center justify-center gap-1.5 cursor-pointer shadow-xs"
              },
                e(Icon, { name: 'plus', className: "w-3.5 h-3.5" }),
                e('span', null, "Tambah Brand Baru")
              )
            )
          )
        )
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(BrandBrainApp));
  </script>
</body>
</html>
