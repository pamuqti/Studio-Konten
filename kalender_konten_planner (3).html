  <style id="bbx-style">.bbx{display:flex;flex-direction:column;gap:1.25rem}
.bbx-note{display:flex;gap:.6rem;align-items:flex-start;padding:.75rem .9rem;border-radius:.9rem;background:#f2f7f3;border:1px solid #d2e4d4;font-size:12px;color:#204031;line-height:1.5}
.bbx-card{background:#fff;border:1px solid #dce4db;border-radius:1rem;padding:1.25rem;box-shadow:0 1px 2px rgba(20,38,32,.04)}
.bbx-h{font-size:.75rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#142620;display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap;border-bottom:1px solid #edf1eb;padding-bottom:.5rem;margin-bottom:.9rem}
.bbx-hint{font-size:11px;color:#697c70;font-weight:500;text-transform:none;letter-spacing:0}
.bbx-fmts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.6rem}
.bbx-fmt{text-align:left;padding:.75rem .85rem;border-radius:.85rem;border:1px solid #dce4db;background:#fafcf9;cursor:pointer;transition:all .15s}
.bbx-fmt:hover{background:#fff;border-color:#b9cdbd}
.bbx-fmt.on{background:#fff;border-color:#205c49;box-shadow:0 0 0 2px rgba(32,92,73,.15)}
.bbx-fmt b{display:block;font-size:12px;color:#142620}
.bbx-fmt>span{display:block;font-size:11px;color:#697c70;margin-top:3px;line-height:1.4}
.bbx-fmt b .bbx-ext{display:inline;margin:0 0 0 6px}
.bbx-ext{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;font-weight:700;color:#205c49;background:#e8f1e9;border-radius:6px;padding:1px 6px}
.bbx-secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.5rem}
.bbx-sec{display:flex;align-items:center;gap:.55rem;padding:.55rem .7rem;border:1px solid #e3e8e2;border-radius:.75rem;background:#fafcf9;cursor:pointer;font-size:12px;color:#24382d;user-select:none;transition:all .15s}
.bbx-sec.on{background:#fff;border-color:#205c49}
.bbx-sec.lock{cursor:default}
.bbx-sec input,.bbx-chk input{accent-color:#205c49;width:14px;height:14px}
.bbx-sec small{margin-left:auto;font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;white-space:nowrap}
.bbx-ok{background:#d1fae5;color:#065f46}
.bbx-no{background:#ffe4e6;color:#9f1239}
.bbx-row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.bbx-opts{display:flex;flex-wrap:wrap;gap:.5rem 1.25rem}
.bbx-chk{display:flex;align-items:center;gap:.45rem;font-size:12px;color:#24382d;cursor:pointer}
.bbx-chk.off{opacity:.45;cursor:not-allowed}
.bbx-input{padding:.5rem .75rem;border-radius:.75rem;border:1px solid #d6dfd5;font-size:12px;outline:none;min-width:0;background:#fff}
.bbx-input:focus{border-color:#205c49;box-shadow:0 0 0 2px rgba(32,92,73,.2)}
.bbx-btn{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem .9rem;border-radius:.75rem;font-size:12px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:all .15s}
.bbx-primary{background:#205c49;color:#fff}
.bbx-primary:hover{background:#184738}
.bbx-ghost{background:#fff;color:#205c49;border-color:#cfded1}
.bbx-ghost:hover{background:#edf5ef}
.bbx-pre{background:#101713;color:#d1fae5;border-radius:1rem;max-height:380px;overflow:auto;padding:1rem;font:11px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word;margin:0}
.bbx-frame{width:100%;height:440px;border:1px solid #dce4db;border-radius:1rem;background:#fff}
@media(min-width:1024px){.bbx-grid10{grid-template-columns:repeat(10,minmax(0,1fr))!important}}

.bbx-dim .bbx-secs,.bbx-dim .bbx-row{opacity:.4;pointer-events:none}.bbs-item{display:flex;align-items:center;border-radius:.75rem;transition:background .15s}
.bbs-item:hover{background:#f1f6ef}
.bbs-main{flex:1;min-width:0;display:flex;align-items:center;gap:.6rem;padding:.45rem .5rem .45rem .6rem;text-align:left;cursor:pointer;background:none;border:0;color:#3f5247}
.bbs-th{width:30px;height:30px;border-radius:8px;object-fit:cover;flex:none;background:#e8f1e9}

.bbs-ext{margin-left:auto;font-size:12px;color:#8b9c91}

.bbs-edit:hover{background:#e5ede3;color:#183127}
@media(hover:none){.bbs-edit{opacity:.7}}

.bbs-add:hover{background:#f1f6ef}

.bbs-ct{font-size:11px;font-weight:700;color:#183127}
.bbs-cb{display:flex;gap:.4rem;margin:.4rem 0 .3rem}

.bbs-ov{position:fixed;inset:0;z-index:100;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px;user-select:text;-webkit-user-select:text}

.bbs-in{width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:12px;padding:10px 12px;font-size:13px;color:#0f172a;background:#fff;outline:none;font-family:inherit}
.bbs-in:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.15)}
textarea.bbs-in{resize:vertical}
.bbs-cm{margin-top:8px;padding:10px;border-radius:12px;background:#f8fafc;border:1px solid #e2e8f0}

.bbs-del{border:0;background:none;color:#e11d48;font-size:12px;font-weight:700;cursor:pointer;margin-right:4px}

.bbm{position:relative}
.bbm-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:80;width:310px;background:#fff;border:1px solid #dce4db;border-radius:14px;box-shadow:0 12px 32px rgba(20,38,32,.18);padding:6px;text-align:left}
.bbm-g{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#819287;padding:8px 10px 4px}
.bbm-it{display:flex;gap:10px;align-items:flex-start;width:100%;padding:8px 10px;border:0;background:none;border-radius:10px;cursor:pointer;text-align:left}
.bbm-it:hover{background:#f1f6ef}
.bbm-ic{font-size:16px;line-height:1.2}
.bbm-tx b{display:block;font-size:12px;color:#142620;font-weight:600}
.bbm-tx small{display:block;font-size:10.5px;color:#697c70;line-height:1.35}
.bbm-sep{height:1px;background:#edf1eb;margin:4px 6px}

.bbi-modal{width:min(560px,100%)}
.bbi-sum{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;padding:10px 12px;border-radius:12px;background:#f2f7f3;border:1px solid #d2e4d4}
.bbi-sum b{font-size:14px}
.bbi-sum small{flex-basis:100%;font-size:11px;color:#697c70}
.bbi-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:#205c49;color:#fff}
.bbi-secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.bbi-sec{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid #e2e8f0;border-radius:10px;font-size:12px;cursor:pointer;background:#fff}
.bbi-sec.off{opacity:.45;cursor:default}
.bbi-sec small{margin-left:auto;font-size:10px;color:#64748b;white-space:nowrap}
.bbi-rad{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:6px;cursor:pointer}
.bbi-rad b{display:block;font-size:12px}
.bbi-rad small{display:block;font-size:11px;color:#64748b;line-height:1.4}

.bbp-tabs{display:flex;gap:4px;padding:8px 20px 0;background:#fafcf9;border-bottom:1px solid #e1e9df}
.bbp-tabs button{border:0;background:none;font-size:12px;font-weight:600;color:#697c70;padding:8px 14px;border-radius:10px 10px 0 0;cursor:pointer;border-bottom:2px solid transparent}
.bbp-tabs button.on{color:#205c49;border-bottom-color:#205c49;background:#fff}
.bbp-wrap{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.bbp-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:10px 20px;border-bottom:1px solid #edf1eb;background:#fff}
.bbp-hint{font-size:11px;color:#697c70}
.bbp-frame{width:100%;height:58vh;min-height:340px;border:0;background:#eef2ee}</style></head>
  <body class="bg-[#f7f8f5] text-[#192a24] antialiased selection:bg-[#205c49]/20 selection:text-[#205c49]">
    <div id="root"></div>
  </body>
</html>
