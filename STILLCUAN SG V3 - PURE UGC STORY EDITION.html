    return `Candid realistic photograph depicting ONE specific real-life pain-point moment, used as a BEFORE reference shown prior to the solution product. Depict literally and exactly (do not add elements beyond this): ${text || "situasi masalah sehari-hari"}. Context: problem relates to ${category || "produk umum"}. If it involves a person or body part, show only what is needed to communicate the problem (e.g. close-up of the affected area) with natural unposed candid lighting — avoid a glamorous portrait. Absolutely do NOT show or hint at ${n} or its packaging anywhere. Do NOT add unrelated objects, text overlays, or people not mentioned. Photorealistic, sharp focus, single clear subject, no clutter. ${REALISM} ${NEGATIVE} Seed: ${Date.now()}`;
  const role = kind === "comparison"
    ? `This item will later be placed side-by-side with a DIFFERENT product (${n}) in a separate image, so photograph ONLY this one comparison item by itself.`
    : `This is decorative set-dressing context for a UGC video about ${n}. Show ONLY this prop by itself.`;
  return `Professional e-commerce style reference photograph of ONE single standalone object, completely EMPTY of any person: ${text || "properti pendukung"}. ABSOLUTELY NO human, NO hands, NO body parts, NO silhouette anywhere in frame, even if the object is normally used or worn by a person — show it unoccupied and untouched. ${role} Do NOT show ${n} or its packaging. Do NOT invent extra items not mentioned. If the description names a specific brand, render a generic realistic equivalent (do not copy real brand logos). Match the description literally, nothing more. Centered, fully visible, clean neutral surface, soft even studio lighting, sharp focus, true-to-life colors, 8K. NEGATIVE: person, people, human, hand, body part, silhouette, text, watermark, logo. Seed: ${Date.now()}`;
};


/* ===== 07_app.jsx ===== */
/* ============================================================
   APP — state, orkestrasi, navigasi 6 langkah
   ============================================================ */

const STEPS = [
  { title: "1. Info Produk",       short: "Produk",    icon: "FileText", desc: "Deskripsi, foto, harga, dan strategi dasar produk.",        bg: "bg-blue-50",    bd: "border-blue-100",    fg: "text-blue-500" },
  { title: "2. Tahapan Funnel",    short: "Funnel",    icon: "Layers",   desc: "TOFU/MOFU/BOFU/Retensi, kematangan audiens, angle & CTA.",  bg: "bg-amber-50",   bd: "border-amber-100",   fg: "text-amber-500", badge: "Strategis" },
  { title: "3. Konsep Video",      short: "Konsep",    icon: "Settings", desc: "Goal, gaya video, mode produksi, dan tone narasi.",         bg: "bg-indigo-50",  bd: "border-indigo-100",  fg: "text-indigo-500" },
  { title: "4. Naskah Cerita",     short: "Naskah",    icon: "Camera",   desc: "AI menulis naskah & storyboard teks lengkap.",              bg: "bg-purple-50",  bd: "border-purple-100",  fg: "text-purple-500" },
  { title: "5. Referensi Visual",  short: "Referensi", icon: "ImageIcon",desc: "Talent, lokasi, props, dan panel gabungan produk.",         bg: "bg-emerald-50", bd: "border-emerald-100", fg: "text-emerald-500" },
  { title: "6. Render & Prompt",   short: "Render",    icon: "Wand2",    desc: "Render tiap shot dan salin prompt Image-to-Video.",         bg: "bg-rose-50",    bd: "border-rose-100",    fg: "text-rose-500" }
];

function App() {
  /* ---------------- state ---------------- */
  const [step, setStep] = useState(1);
  const go = n => { setStep(n); window.scrollTo({ top: 0, behavior: "smooth" }); };

  const [seed, setSeed]   = usePersist("sc3_seed", "");
  const [brief, setBrief] = usePersist("sc3_brief", BLANK_BRIEF);
  const [meta, setMeta]   = usePersist("sc3_meta", BLANK_META);
  const [talents, setTalents] = usePersist("sc3_talents", [BLANK_TALENT, { ...BLANK_TALENT }]);

  /* scenes: gambar TIDAK ikut disimpan agar localStorage tidak jebol */
  const [scenes, setScenes] = useState(() => load("sc3_scenes", []));
  useEffect(() => {
    save("sc3_scenes", scenes.map(s => ({ ...s, shots: s.shots.map(x => ({ ...x, imageUrl: "" })) })));
  }, [scenes]);

  const [prodImgs, setProdImgs] = usePersist("sc3_prod", ["", "", "", ""]);
  const [mergedPanel, setMergedPanel] = usePersist("sc3_merged", "");
  const [talent1, setTalent1] = usePersist("sc3_t1", "");
  const [talent2, setTalent2] = usePersist("sc3_t2", "");
  const [locRefs, setLocRefs] = usePersist("sc3_loc", [{ img: "", text: "" }, { img: "", text: "" }, { img: "", text: "" }]);
  const [propRefs, setPropRefs] = usePersist("sc3_props", { comparison: [], narrative: [], decoration: [] });

  const [busyRaw, setBusyRaw] = useState("");
  const [busySince, setBusySince] = useState(0);
  /* setBusy dibungkus: tiap proses baru mencatat waktu mulai, dipakai penghitung detik di banner */
  const setBusy = txt => { setBusyRaw(txt); setBusySince(txt ? Date.now() : 0); };
  const busy = busyRaw;
  const [toast, setToast] = useState(null);
  const [flags, setFlags] = useState({});
  const [ideas, setIdeas] = useState(null);
  const [pickIdea, setPickIdea] = useState("custom");
  const [feedback, setFeedback] = useState(null);
  const [talentTab, setTalentTab] = useState(0);
  const [exportScene, setExportScene] = useState(null);
  const [askReset, setAskReset] = useState(false);
  const [askMap, setAskMap] = useState(null);
  const [mapped, setMapped] = useState(false);
  const [askMapGo, setAskMapGo] = useState(false);
  const [newComp, setNewComp] = useState("");
  const [funnelAi, setFunnelAi] = useState(null);
  const [storyAudit, setStoryAudit] = useState(null);
  const abortRef = useRef(false);

  /* --- manajer proyek (V3): autosave draf + pustaka proyek --- */
  const [projectModal, setProjectModal] = useState({ open: false, mode: "save" });
  const [draftLoaded, setDraftLoaded] = useState(false);
  const [saveStatus, setSaveStatus] = useState("idle");
  const [lastSaved, setLastSaved] = useState(null);

  const say = (text, type = "success") => setToast({ text, type, at: Date.now() });
  useEffect(() => {
    if (!toast) return;
    /* HANYA pesan sukses yang menutup sendiri. Error & peringatan sengaja menempel
       sampai ditutup manual — justru pesan itulah yang wajib terbaca. */
    if (toast.type !== "success") return;
    const ms = Math.min(12000, 4500 + toast.text.length * 45);
    const t = setTimeout(() => setToast(null), ms);
    return () => clearTimeout(t);
  }, [toast]);
  /* proses baru mulai -> bersihkan pesan hasil lama agar banner tidak tumpang tindih */
  useEffect(() => { if (busy) setToast(null); }, [busy]);
  const flag = (k, v) => setFlags(f => ({ ...f, [k]: v }));
  const patchBrief = p => setBrief(b => ({ ...b, ...p }));

  /* auto-resize textarea */
  useEffect(() => {
    const fit = e => { const t = e.target; if (t?.tagName === "TEXTAREA") { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; } };
    document.addEventListener("input", fit);
    const id = setTimeout(() => document.querySelectorAll("textarea").forEach(t => { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }), 60);
    return () => { document.removeEventListener("input", fit); clearTimeout(id); };
  }, [step, scenes, brief]);

  const faceless = isFaceless(brief);

  /* jaga jumlah scene & shot selaras meta */
  useEffect(() => {
    setScenes(prev => {
      let out = [...prev];
      while (out.length < meta.durationScenes) out.push(blankScene(out.length, meta.shotsPerScene, faceless));
      out = out.slice(0, meta.durationScenes).map(sc => {
        let sh = [...sc.shots];
        while (sh.length < meta.shotsPerScene) sh.push(blankShot(sh.length, faceless));
        return { ...sc, shots: sh.slice(0, meta.shotsPerScene) };
      });
      return out;
    });
  }, [meta.durationScenes, meta.shotsPerScene, faceless]);

  const A = { brief, meta, talents, prodImgs, mergedPanel, talent1, talent2, locRefs, propRefs };

  /* ---------------- proyek: snapshot, muat, autosave ---------------- */
  const snapshot = () => ({
    id: "current_draft", name: brief.productName || "Proyek UGC", version: PROJECT_VERSION,
    updatedAt: Date.now(), seed, brief, meta, talents, talent1, talent2,
    prodImgs, mergedPanel, locRefs, propRefs, scenes
  });

  const applyProject = p => {
    if (!p) return;
    /* proyek lama belum punya brief.story -> beri kerangka kosong agar panel cerita tetap jalan */
    if (p.brief) setBrief({ ...BLANK_BRIEF, ...p.brief, story: { ...BLANK_STORY, ...(p.brief.story || {}) } });
    if (p.meta) setMeta({ ...BLANK_META, ...p.meta });
    if (typeof p.seed === "string") setSeed(p.seed);
    if (p.talents?.length) setTalents(p.talents);
    if (typeof p.talent1 === "string") setTalent1(p.talent1);
    if (typeof p.talent2 === "string") setTalent2(p.talent2);
    if (p.prodImgs) setProdImgs(p.prodImgs);
    if (typeof p.mergedPanel === "string") setMergedPanel(p.mergedPanel);
    if (p.locRefs) setLocRefs(p.locRefs);
    if (p.propRefs) setPropRefs(p.propRefs);
    if (p.scenes) setScenes(p.scenes);
    setIdeas(null); setFeedback(null); setFunnelAi(null); setMapped(false); setStoryAudit(null);
    setLastSaved(p.updatedAt ? new Date(p.updatedAt) : new Date());
    setSaveStatus("saved");
    go(1);
  };

  /* muat draf terakhir sekali saat aplikasi dibuka — IndexedDB menyimpan gambar,
     localStorage (usePersist) hanya cadangan teks bila IndexedDB diblokir */
  useEffect(() => {
    let alive = true;
    loadActiveDraft()
      .then(p => {
        if (!alive || !p) return;
        const berisi = (p.brief?.productName || "").trim() || (p.seed || "").trim() || (p.scenes || []).length;
        if (!berisi) return;
        const adaGambar = (p.prodImgs || []).some(Boolean) || Boolean(p.mergedPanel) ||
          (p.scenes || []).some(s => (s.shots || []).some(x => x.imageUrl));
        applyProject(p);
        if (adaGambar) say("Draf terakhir dimuat kembali lengkap dengan gambar. ⚡");
      })
      .catch(e => console.warn("Gagal memuat draf:", e.message))
      .finally(() => { if (alive) setDraftLoaded(true); });
    return () => { alive = false; };
  }, []);

  /* autosave berjeda: satu tulisan per 1,5 detik setelah perubahan terakhir */
  useEffect(() => {
    if (!draftLoaded) return;
    setSaveStatus("saving");
    const id = setTimeout(() => {
      saveActiveDraft(snapshot())
        .then(ok => { setSaveStatus(ok ? "saved" : "error"); if (ok) setLastSaved(new Date()); })
        .catch(() => setSaveStatus("error"));
    }, 1500);
    return () => clearTimeout(id);
  }, [draftLoaded, seed, brief, meta, talents, talent1, talent2, prodImgs, mergedPanel, locRefs, propRefs, scenes]);

  /* ---------------- gerbang kelengkapan ---------------- */
  const okStep1 = seed.trim() && ["productName", "priceOwn", "usageSteps", "productCategory", "targetAudience", "platform", "language", "creatorPersona", "cta", "keyFeatures", "painPoints", "productClaim", "emotionalJourney"].every(k => (brief[k] || "").toString().trim())
    && (!brief.hasVariants || (brief.productVariants || []).every(v => (v.name || "").trim()));
  /* Step 2 (funnel) — stage wajib dipilih, angle & CTA wajib terisi karena
     keduanya dipakai langsung sebagai benang merah naskah. */
  const okFunnel = Boolean(brief.funnelStage && (brief.funnelAngle || "").trim() && (brief.cta || "").trim());
  /* Step 3 baru lolos bila ide sudah DITERAPKAN ke pengaturan (bukan sekadar diketik),
     karena naskah membaca hasil penerapan itu — goal, tone, talent, props, lokasi. */
  const hasIdea = Boolean((brief.customIdea || "").trim());
  /* Ide WAJIB ada DAN sudah diterapkan — naskah membaca hasil penerapannya
     (goal, tone, talent, lokasi, props), bukan teks idenya. */
  const ideaApplied = hasIdea && Boolean(feedback);
  /* Kesaksian adalah nyawa naskah: tanpa itu AI hanya bisa mengarang iklan.
     Karena itu lima beat WAJIB terisi sebelum boleh lanjut menulis naskah. */
  const ceritaSiap = storyReady(brief.story);
  const ceritaTerisi = storyFilled(brief.story);
  const okStep2 = Boolean(brief.goal && meta.videoType && meta.tone && (brief.cameraStyle || "").trim()
    && brief.selectedGoalComponents?.length && ideaApplied && ceritaSiap);
  const okStep3 = scenes.length > 0 && scenes.every(s => (s.voiceover || "").trim() && s.shots.every(x => (x.title || "").trim() && (x.visualDescription || "").trim()));
  /* Step 5 lolos bila SEMUA aset yang benar-benar dibutuhkan naskah sudah ada.
     Dicek per kebutuhan, bukan asal terisi: kalau naskah tak menyebut props, props tak diwajibkan. */
  const needProduct = scenes.some(s => s.shots.some(x => Number.isInteger(x.variantIndex)))
    || scenes.some(s => s.shots.some(x => (x.props || "").toLowerCase().includes((brief.productName || "␀").toLowerCase())));
  const scriptProps = scenes.some(s => s.shots.some(x => (x.props || "").trim()));
  const propsReady = !scriptProps || SCENARIO_PROPS.some(pr => (propRefs[pr.key] || []).some(x => x?.img));
  /* Slot 5 (panel gabungan) WAJIB bila naskah menampilkan produk —
     itulah acuan produk utama saat render, bukan foto galeri mentah. */
  const productReady = !needProduct || Boolean(mergedPanel);
  const locReady = locRefs.some(l => l?.img) || Boolean((brief.location || "").trim());

  const talentProfileReady = faceless || (brief.talentCount === "2 Talent (Interaksi)" ? [0, 1] : [0])
    .every(i => ["name", "gender", "age", "ethnic", "hairStyle", "skinTone", "expression", "outfit"].every(k => tv(talents[i], k)));
  const talentPhotoReady = faceless || Boolean(talent1) || (brief.talentCount === "2 Talent (Interaksi)" && Boolean(talent2));

  const step4Missing = [];
  if (faceless) {
    if (!(brief.motionGraphicDesc || "").trim()) step4Missing.push("Detail Motion Graphic (5.1)");
  } else {
    if (!talentProfileReady) step4Missing.push("Profil Talent lengkap (5.1)");
    if (!talentPhotoReady) step4Missing.push("Foto referensi Talent (5.1)");
  }
  if (!locReady) step4Missing.push("Lokasi / foto lokasi (5.2)");
  if (!productReady) step4Missing.push("Slot 5 Panel Referensi Gabungan (Langkah 1) — acuan produk saat render");
  if (!propsReady) step4Missing.push("Foto Props Skenario (5.3) — naskah menyebut props");

  const okStep4 = step4Missing.length === 0;

  /* ---------------- aksi AI ---------------- */
  const runResearch = async () => {
    if (!seed.trim()) return say("Isi deskripsi produk atau link marketplace dulu!", "error");
    setBusy("⏳ AI mengisi otomatis seluruh Form Step 1...");
    try {
      const r = await aiResearch({ seed, brief, prodImgs });
      /* varian sengaja TIDAK diisi AI — deteksi dari web sering meleset, biar user isi manual */
      const { talentUpdates, productVariants, ...rest } = r;
      const clean = Object.fromEntries(Object.entries(rest).filter(([, v]) => v));
      /* nilai funnel dari AI hanya dipakai bila memang salah satu opsi yang sah —
         kalau meleset, jangan rusak state: biarkan pilihan user/default berlaku */
      if (clean.funnelStage && !FUNNEL_KEYS.includes(clean.funnelStage)) delete clean.funnelStage;
      if (clean.audienceAwareness && !AWARENESS_KEYS.includes(clean.audienceAwareness)) delete clean.audienceAwareness;
      patchBrief(clean);
      if (talentUpdates?.length) setTalents(t => t.map((old, i) => talentUpdates[i] ? { ...old, ...Object.fromEntries(Object.entries(talentUpdates[i]).filter(([, v]) => v)) } : old));
      say(clean.funnelStage
        ? `Form Step 1 terisi otomatis. AI juga mengusulkan funnel ${clean.funnelStage} — konfirmasi di Langkah 2. ✅`
        : "Form Step 1 berhasil diisi otomatis! ✅");
    } catch (e) { console.error(e); say("Gagal mengisi otomatis: " + e.message, "error"); }
    finally { setBusy(""); }
  };

  const patchStory = p => setBrief(b => ({ ...b, story: { ...BLANK_STORY, ...(b.story || {}), ...p } }));

  const runDraftStory = async () => {
    if (!(brief.productName || "").trim() && !seed.trim())
      return say("Isi nama produk atau link marketplace di Langkah 1 dulu!", "error");
    setBusy("🗣️ AI menyusun draf kesaksian si pencerita...");
    try {
      const r = await aiDraftStory({ brief, seed });
      const bersih = Object.fromEntries(Object.entries(r).filter(([k, v]) =>
        (k === "teller" || STORY_KEYS.includes(k)) && typeof v === "string" && v.trim()));
      if (!Object.keys(bersih).length) throw new Error("AI tidak mengembalikan isi cerita.");
      patchStory(bersih);
      say("Draf kesaksian tersusun. WAJIB kamu sunting — cerita nyata selalu kalahkan cerita karangan AI.", "warning");
    } catch (e) { console.error(e); say("Gagal menyusun draf cerita: " + e.message, "error"); }
    finally { setBusy(""); }
  };

  const runAuditStory = async () => {
    if (!scenes.length) return say("Belum ada naskah untuk diaudit. Generate naskah dulu.", "error");
    setBusy("🔍 Mengaudit: naskah ini masih kesaksian orang atau sudah jadi iklan?");
    try {
      const r = await aiAuditStory({ scenes, brief, meta });
      setStoryAudit(r);
      const rata = Math.round((((r.skorCerita || 0) + (r.skorKejujuran || 0) + (r.skorHook || 0) + (r.skorRekomendasi || 0)) / 4));
      say(rata >= 75
        ? `Audit selesai — skor rata-rata ${rata}/100. Naskah terasa sebagai kesaksian orang. ✅`
        : `Audit selesai — skor rata-rata ${rata}/100. Baca catatan perbaikan di bawah sebelum lanjut render.`,
        rata >= 75 ? "success" : "warning");
    } catch (e) { console.error(e); say("Gagal mengaudit cerita: " + e.message, "error"); }
    finally { setBusy(""); }
  };

  const runIdeas = async () => {
    if (!seed.trim()) return say("Isi deskripsi atau link produk di Langkah 1 dulu!", "error");
    setBusy("🪄 Meracik 5 ide cerita AI...");
    try { setIdeas(await aiIdeas({ seed, brief, meta })); say("Berhasil meracik 5 ide cerita!"); }
    catch (e) { console.error(e); say("Gagal: " + e.message, "error"); }
    finally { setBusy(""); }
  };

  const runApplyIdea = async () => {
    if (!(brief.customIdea || "").trim()) return say("Isi ide spesifik dulu!", "error");
    setBusy("🪄 Menerapkan ide ke seluruh pengaturan...");
    try {
      const r = await aiApplyIdea({ seed, brief, meta });
      if (r.isValidIdea === false) { say("Ide ditolak AI: " + (r.directorFeedback || "input tidak valid"), "error"); return; }
      const { talentUpdates, scenarioPropsExtracted, videoType, tone, format, ...rest } = r;
      const sp = scenarioPropsExtracted && Object.fromEntries(Object.entries(scenarioPropsExtracted).filter(([, v]) => v && v.trim()));
      patchBrief({ ...Object.fromEntries(Object.entries(rest).filter(([, v]) => v)), ...(sp && Object.keys(sp).length ? { scenarioProps: sp } : {}) });
      if (videoType || tone || format) setMeta(m => ({ ...m, ...(videoType && { videoType }), ...(tone && { tone }), ...(format && { format }) }));
      if (talentUpdates?.length) setTalents(t => t.map((old, i) => talentUpdates[i] ? { ...old, ...Object.fromEntries(Object.entries(talentUpdates[i]).filter(([, v]) => v)) } : old));
      setFeedback(r);
      say("✅ Ide diterapkan! Mode produksi & talent ikut diperbarui.");
    } catch (e) { console.error(e); say("Gagal menerapkan ide: " + e.message, "error"); }
    finally { setBusy(""); }
  };

  const runScript = async () => {
    if (!brief.productName) return say("Isi nama produk dulu!", "error");
    setBusy("✍️ Menulis naskah & storyboard...");
    try {
      const r = await aiScript({ brief, meta, talents, visionNote: brief.productVisualDescription });
      if (!r?.scenes?.length) throw new Error("Struktur skenario tidak valid.");
      /* varian dikunci untuk SELURUH video: pilihan AI bila sah, kalau tidak varian pertama yang berfoto */
      const nVar = brief.productVariants?.length || 0;
      const okIdx = i => Number.isInteger(i) && i >= 0 && i < nVar;
      const fotoIdx = nVar ? brief.productVariants.findIndex(v => v.image) : -1;
      const lockedVariant = nVar === 0 ? null
        : nVar === 1 ? 0
        : okIdx(r.chosenVariantIndex) ? r.chosenVariantIndex
        : (fotoIdx >= 0 ? fotoIdx : 0);

      const built = Array.from({ length: meta.durationScenes }, (_, i) => {
        const sc = r.scenes[i] || {};
        return {
          sceneNumber: i + 1,
          title: sc.title || `Scene #${i + 1}`,
          voiceover: sc.voiceover || "",
          sfx: sc.sfx || "",
          transitionNote: sc.transitionNote || "Cut to next",
          shots: Array.from({ length: meta.shotsPerScene }, (_, j) => {
            const s = sc.shots?.[j] || {};
            const base = blankShot(j, faceless);
            return {
              ...base,
              title: s.title || base.title,
              cameraAngle: s.cameraAngle || base.cameraAngle,
              cameraMove: s.cameraMove || "",
              location: s.location || "",
              talent: s.talent || "",
              props: s.props || "",
              visualDescription: s.visualDescription || "Tampilkan visual produk menarik",
              directorNotes: s.directorNotes || "Natural",
              usePrevFrame: !faceless && (i > 0 || j > 0),
              variantIndex: (() => {
                /* PENJAGA: satu video = satu varian. AI kadang berganti varian antar shot
                   padahal cerita hanya soal satu produk yang dibeli. */
                const ok2 = i => Number.isInteger(i) && i >= 0 && i < (brief.productVariants?.length || 0);
                if (!ok2(s.variantIndex)) return null;
                return ok2(lockedVariant) ? lockedVariant : s.variantIndex;
              })(),
              useTalent2Ref: brief.talentCount === "2 Talent (Interaksi)"
            };
          })
        };
      });
      setScenes(built);
      setMapped(false);
      setStoryAudit(null); /* naskah berubah -> hasil audit lama tidak berlaku lagi */
      if (r.recommendedTone && TONES.includes(r.recommendedTone)) setMeta(m => ({ ...m, tone: r.recommendedTone }));
      if (!faceless && r.talentProfiles) {
        setTalents(t => t.map((old, i) => {
          const p = r.talentProfiles[i === 0 ? "talent1" : "talent2"];
          return p?.name ? { ...old, name: p.name.trim(), gender: ["Pria", "Wanita"].includes(p.gender) ? p.gender : old.gender, age: (p.age || "").trim() || old.age } : old;
        }));
      }
      /* isi props 4.3 dari naskah — diklasifikasi AI ke 3 tipe */
      try {
        const cls = await aiClassifyProps({ scenes: built, brief });
        if (cls) {
          setPropRefs(prev => {
            const next = { ...prev };
            Object.keys(cls).forEach(k => {
              const slots = [0, 1, 2].map(i => (prev[k] && prev[k][i]) || { img: "", text: "" });
              let n = 0;
              next[k] = slots.map(sl => (sl.text || "").trim() || n >= cls[k].length ? sl : { ...sl, text: cls[k][n++] });
            });
            return next;
          });
          /* aktifkan tipe props yang benar-benar terpakai + sinkronkan teks induknya */
          const sp = { ...(brief.scenarioProps || {}) };
          Object.keys(cls).forEach(k => { if (cls[k].length) sp[k] = cls[k].join(", "); });
          if (Object.keys(sp).length) patchBrief({ scenarioProps: sp });
        }
      } catch (e) { console.warn("Klasifikasi props gagal:", e.message); }

      /* isi lokasi dari naskah bila masih kosong */
      const locs = [];
      built.forEach(s => s.shots.forEach(x => { const l = (x.location || "").trim(); if (l && !locs.includes(l)) locs.push(l); }));
      if (locs.length) {
        if (!(brief.location || "").trim()) patchBrief({ location: locs[0] });
        setLocRefs(prev => { let k = 0; return prev.map(r2 => (!r2.text?.trim() && k < locs.length) ? { ...r2, text: locs[k++] } : r2); });
      }
      /* peringatkan bila naskah memakai varian yang belum ada fotonya —
         render akan kehilangan acuan visual varian itu */
      const dipakai = new Set();
      built.forEach(sc => sc.shots.forEach(x => { if (Number.isInteger(x.variantIndex)) dipakai.add(x.variantIndex); }));
      const bolong = [...dipakai].filter(i => brief.productVariants?.[i] && !brief.productVariants[i].image)
        .map(i => brief.productVariants[i].name || "Varian " + (i + 1));
      if (bolong.length) {
        say(`Naskah jadi. Catatan: varian ${bolong.join(", ")} dipakai di naskah tapi belum ada fotonya — unggah di Langkah 1 agar render varian akurat.`, "warning");
      } else {
        say("Naskah berhasil dibuat! Lanjut ke Langkah 5 untuk referensi visual.");
      }
    } catch (e) { console.error(e); say("Gagal buat naskah: " + e.message, "error"); }
    finally { setBusy(""); }
  };

  /* Dipakai tombol "Lanjut ke Render Storyboard": petakan dulu bila belum,
     baru pindah ke Step 6. Menghemat satu klik dan mencegah lupa memetakan. */
  const mapThenGo = async () => {
    setAskMapGo(true);
    if (!mapped) { const ok = await runMapRefs(false, true); if (!ok) return; }
    setAskMapGo(false);
    go(6);
  };

  const runMapRefs = async (force = false, quiet = false) => {
    if (!scenes.length) { say("Belum ada naskah untuk dipetakan! Kembali ke Langkah 4 dulu.", "error"); return false; }
    const miss = [];
    if (!locRefs.some(l => l?.img)) miss.push("Lokasi (5.2) — belum ada foto");
    if (!prodImgs.filter(Boolean).length) miss.push("Produk (Langkah 1) — belum ada foto galeri");
    if (!SCENARIO_PROPS.some(p => (propRefs[p.key] || []).some(s => s?.img))) miss.push("Props Skenario (5.3) — belum ada foto");
    if (!faceless && !talent1 && !talent2) miss.push("Talent (5.1) — belum ada foto");
    if (miss.length >= 4) { say("Belum ada satu pun aset referensi. Unggah foto talent/lokasi/props/produk dulu — kalau dijalankan sekarang semua penanda akan kosong.", "error"); return false; }
    /* modal in-app, BUKAN window.confirm — Canvas sering memblokir dialog native */
    if (miss.length && !force) { setAskMap(miss); return false; }
    setAskMap(null);

    setBusy("🔎 Memindai naskah & memetakan referensi tiap shot...");
    try {
      const mapped = await aiMapRefs({ scenes, brief, locRefs, prodImgs, propRefs, hasMerged: Boolean(mergedPanel) });
      if (!mapped.length) throw new Error("AI tidak mengembalikan pemetaan apa pun.");
      let n = 0;
      setScenes(prev => prev.map(sc => {
        const m = mapped.find(x => x.sceneNumber === sc.sceneNumber);
        if (!m) return sc;
        return { ...sc, shots: sc.shots.map(sh => {
          const r = m.shots?.find(x => x.shotNumber === sh.shotNumber);
          if (!r) return sh;
          n++;
          const prod = [...sh.useProductRefs];
          if (Array.isArray(r.useProductSlots)) for (let i = 0; i < 4; i++) prod[i] = r.useProductSlots.includes(i + 1);
          const locs = [false, false, false];
          if (r.useLocationSlot >= 1 && r.useLocationSlot <= 3) locs[r.useLocationSlot - 1] = true;
          return { ...sh,
            useTalentRef: Boolean(r.useTalent1), useTalent2Ref: Boolean(r.useTalent2),
            useProductRefs: prod, useLocationRefs: locs,
            useMergedRef: Boolean(r.useMergedPanel) && Boolean(mergedPanel),
            useScenarioPropRefs: {
              comparison: Boolean(r.useScenarioProps?.comparison),
              narrative: Boolean(r.useScenarioProps?.narrative),
              decoration: Boolean(r.useScenarioProps?.decoration) },
            productAnim: !(r.useTalent1 || r.useTalent2) && Boolean(r.isMotionGraphic) };
        }) };
      }));
      setMapped(true);
      say(quiet ? `Referensi dipetakan ke ${n} shot — lanjut ke render.` : `Selesai — ${n} shot dipetakan. Cek penanda aktif di Langkah 6.`);
      return true;
    } catch (e) { console.error(e); say("Gagal memetakan referensi: " + e.message, "error"); return false; }
    finally { setBusy(""); }
  };

  const runMerge = async (mode = "auto") => {
    const imgs = prodImgs.filter(Boolean);
    if (!imgs.length) return say("Unggah minimal 1 foto produk dulu!", "error");
    const angle = mode === "auto" ? imgs.length === 1 : mode === "angle";
    flag("merge", true);
    setBusy(angle ? "🔄 Membuat panel multi-angle..." : `🧩 Menggabungkan ${imgs.length} foto jadi 1 panel...`);
    try { setMergedPanel(await aiMergePanel({ imgs, productName: brief.productName || seed, mode })); say("Panel berhasil dibuat! Periksa tulisan & warna kemasan sebelum dipakai."); }
    catch (e) { console.error(e); say("Gagal membuat panel: " + e.message, "error"); }
    finally { flag("merge", false); setBusy(""); }
  };

  const genTalentPhoto = async idx => {
    flag("tal" + idx, true); setBusy("🎭 Membuat foto referensi talent...");
    try { const img = await shrink(await genImage(promptTalent(talents[idx]), "1:1", [])); (idx === 0 ? setTalent1 : setTalent2)(img); say("Foto talent berhasil dibuat!"); }
    catch (e) { say("Gagal buat foto: " + e.message, "error"); }
    finally { flag("tal" + idx, false); setBusy(""); }
  };

  const genLocPhoto = async i => {
    const text = i === 0 ? (brief.location || locRefs[0]?.text) : locRefs[i]?.text;
    flag("loc" + i, true); setBusy("🏠 Membuat foto referensi lokasi...");
    try {
      const img = await shrink(await genImage(promptLocation(text, brief.visualStyle), "1:1", [], "dont_allow"));
      setLocRefs(p => p.map((r, k) => k === i ? { ...r, img } : r));
      say("Foto lokasi berhasil dibuat!");
    } catch (e) { say("Gagal: " + e.message, "error"); }
    finally { flag("loc" + i, false); setBusy(""); }
  };

  const genPropPhoto = async (key, i) => {
    const slot = (propRefs[key] || [])[i] || { img: "", text: "" };
    const id = key + i; flag(id, true); setBusy("🎁 Membuat foto referensi props...");
    try {
      const img = await shrink(await genImage(promptProp(key, slot.text || brief.scenarioProps?.[key], brief.productName, brief.productCategory), "1:1", []));
      setPropRefs(p => { const arr = [...(p[key] || [])]; while (arr.length < 3) arr.push({ img: "", text: "" }); arr[i] = { ...arr[i], img }; return { ...p, [key]: arr }; });
      say("Foto props berhasil dibuat!");
    } catch (e) { say("Gagal: " + e.message, "error"); }
    finally { flag(id, false); setBusy(""); }
  };

  /* ---------------- render shot ---------------- */
  const prevFrameOf = (si, shi) => {
    if (shi > 0) return scenes[si].shots[shi - 1].imageUrl;
    if (si > 0) { const p = scenes[si - 1].shots; return p[p.length - 1].imageUrl; }
    return "";
  };

  const renderShot = async (si, shi) => {
    const shot = scenes[si].shots[shi];
    const refs = buildRefs(shot, { ...A, prevFrame: prevFrameOf(si, shi) });
    const prompt = shot.customPrompt?.trim() ? shot.customPrompt : buildImagePrompt(shot, A);
    const img = await genImage(prompt, meta.format === "portrait" ? "9:16" : "16:9", refs);
    setScenes(p => p.map((sc, i) => i !== si ? sc : { ...sc, shots: sc.shots.map((s, j) => j !== shi ? s : { ...s, imageUrl: img }) }));
  };

  const renderOne = async (si, shi) => {
    const id = si + "-" + shi; flag(id, true); setBusy(`🖼️ Merender Scene ${si + 1} Shot ${shi + 1}...`);
    try { await renderShot(si, shi); say(`Visual Shot ${shi + 1} berhasil dibuat! 🖼️`); }
    catch (e) { console.error(e); say(`Gagal render Shot ${shi + 1}: ` + e.message, "error"); }
    finally { flag(id, false); setBusy(""); }
  };

  const renderScene = async (si, batch = false) => {
    flag("sc" + si, true);
    let bad = 0, stop = false;
    for (let j = 0; j < scenes[si].shots.length; j++) {
      if (abortRef.current) { stop = true; break; }
      const id = si + "-" + j; flag(id, true);
      setBusy(`⚡ Scene ${si + 1} — shot ${j + 1}/${scenes[si].shots.length}...`);
      try { await renderShot(si, j); } catch (e) { console.error(e); bad++; }
      finally { flag(id, false); }
      if (j < scenes[si].shots.length - 1) await new Promise(r => setTimeout(r, 900));
    }
    flag("sc" + si, false);
    if (!batch) setBusy("");
    if (stop) { if (!batch) say("Render dihentikan.", "warning"); return; }
    if (batch) return;
    bad ? say(`Scene ${si + 1} selesai, ${bad} shot gagal. Render ulang yang kosong.`, "error")
        : say(`Semua visual Scene ${si + 1} selesai! 🎬`);
  };

  const renderAll = async () => {
    if (!scenes.length) return say("Belum ada scene.", "error");
    abortRef.current = false;
    flag("all", true);
    for (let i = 0; i < scenes.length; i++) {
      if (abortRef.current) break;
      await renderScene(i, true);
    }
    const dibatalkan = abortRef.current;
    abortRef.current = false;
    flag("all", false); setBusy("");
    say(dibatalkan ? "Render batch dibatalkan — gambar yang sudah jadi tetap tersimpan." : "Semua visual di semua scene selesai! 🎬✨",
        dibatalkan ? "warning" : "success");
  };

  /* batalkan render batch: shot yang sedang jalan diselesaikan dulu, sisanya dilewati */
  const cancelRender = () => {
    if (!flags.all && !Object.keys(flags).some(k => k.startsWith("sc") && flags[k])) return;
    abortRef.current = true;
    setBusy("⏹️ Menghentikan setelah shot ini selesai...");
    say("Permintaan batal diterima — menunggu shot yang sedang berjalan.", "warning");
  };

  const resetAll = () => {
    setBrief(BLANK_BRIEF); setMeta(BLANK_META); setScenes([]); setSeed("");
    setProdImgs(["", "", "", ""]); setMergedPanel(""); setTalent1(""); setTalent2("");
    setLocRefs([{ img: "", text: "" }, { img: "", text: "" }, { img: "", text: "" }]);
    setPropRefs({ comparison: [], narrative: [], decoration: [] });
    setTalents([BLANK_TALENT, { ...BLANK_TALENT }]); setIdeas(null); setFeedback(null);
    setFunnelAi(null); setMapped(false); setStoryAudit(null);
    /* hanya buang draf kerja — pustaka proyek tersimpan TIDAK ikut terhapus */
    ["sc3_seed", "sc3_brief", "sc3_meta", "sc3_talents", "sc3_scenes", "sc3_prod",
     "sc3_merged", "sc3_t1", "sc3_t2", "sc3_loc", "sc3_props"].forEach(k => {
      try { localStorage.removeItem(k); } catch (e) {}
    });
    clearActiveDraft();
    setLastSaved(null); setSaveStatus("idle");
    setAskReset(false); go(1); say("Workspace direset. Proyek di pustaka tetap aman.", "warning");
  };

  const ctx = {
    step, go, seed, setSeed, brief, setBrief, patchBrief, meta, setMeta, talents, setTalents,
    scenes, setScenes, prodImgs, setProdImgs, mergedPanel, setMergedPanel,
    talent1, setTalent1, talent2, setTalent2, locRefs, setLocRefs, propRefs, setPropRefs,
    busy, toast, say, flags, flag, ideas, setIdeas, pickIdea, setPickIdea, feedback, setFeedback,
    talentTab, setTalentTab, exportScene, setExportScene, newComp, setNewComp,
    faceless, okStep1, okFunnel, okStep2, okStep3, okStep4, step4Missing, ideaApplied, hasIdea, mapThenGo, mapped, A,
    ceritaSiap, ceritaTerisi, patchStory, runDraftStory, runAuditStory, storyAudit, setStoryAudit,
    runResearch, runIdeas, runApplyIdea, runScript, runMapRefs, runMerge, setBusy,
    genTalentPhoto, genLocPhoto, genPropPhoto, renderOne, renderScene, renderAll, cancelRender,
    funnelAi, setFunnelAi
  };

  return (
    <div className="min-h-screen bg-[#fcfcfd] flex flex-col font-sans antialiased text-slate-900 pb-16">
      <div className="sticky top-0 z-40">
        <header className="bg-white/90 backdrop-blur-xl border-b border-slate-200 px-3 sm:px-6 py-3 sm:py-4 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] relative flex items-center justify-center">
          <div className="flex items-center gap-2 sm:gap-3 pr-32 sm:pr-0">
            <div className="bg-indigo-600 p-2 sm:p-3 rounded-xl sm:rounded-2xl text-white shadow-md shadow-indigo-600/30 shrink-0"><Icon n="Sparkles" className="w-5 h-5 sm:w-7 sm:h-7" /></div>
            <div className="text-left sm:text-center min-w-0">
              <div className="flex items-center gap-1.5 sm:justify-center">
                <h1 className="text-sm sm:text-xl font-black tracking-tight text-slate-900 truncate" style={{ fontFamily: "Space Grotesk,sans-serif" }}>STILLCUAN SG V3</h1>
                <span className="text-[8px] sm:text-[10px] font-black uppercase tracking-wider bg-rose-50 text-rose-700 border border-rose-200 px-1.5 py-0.5 rounded-full shrink-0">Cerita</span>
              </div>
              <p className="text-[9px] sm:text-[11px] text-slate-500 font-semibold tracking-wide truncate" style={{ fontFamily: "JetBrains Mono,monospace" }}>Kesaksian Nyata → Naskah → Storyboard → I2V</p>
            </div>
          </div>
          <div className="absolute right-3 sm:right-6 top-1/2 -translate-y-1/2 flex items-center gap-1.5 sm:gap-2">
            {/* status autosave */}
            <span title={lastSaved ? "Terakhir disimpan " + lastSaved.toLocaleTimeString("id-ID") : "Belum ada perubahan tersimpan"}
              className={"hidden md:flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl border text-[10px] font-bold " + (
                saveStatus === "saving" ? "bg-amber-50 border-amber-200 text-amber-700"
                  : saveStatus === "error" ? "bg-red-50 border-red-200 text-red-600"
                  : "bg-slate-50 border-slate-200 text-slate-500")}>
              <span className={"w-1.5 h-1.5 rounded-full " + (
                saveStatus === "saving" ? "bg-amber-500 spin" : saveStatus === "error" ? "bg-red-500" : "bg-emerald-500")} />
              {saveStatus === "saving" ? "Menyimpan..."
                : saveStatus === "error" ? "Gagal simpan"
                : lastSaved ? "Tersimpan " + lastSaved.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" })
                : "Tersimpan"}
            </span>
            <button onClick={() => setProjectModal({ open: true, mode: "open" })} title="Buka proyek tersimpan / impor JSON"
              className="p-2.5 sm:py-2 sm:px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition-all flex items-center gap-1">
              <Icon n="Box" className="w-4 h-4" /><span className="hidden sm:inline">Buka</span>
            </button>
            <button onClick={() => setProjectModal({ open: true, mode: "save" })} title="Simpan proyek ke pustaka / unduh JSON"
              className="p-2.5 sm:py-2 sm:px-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition-all flex items-center gap-1">
              <Icon n="Download" className="w-4 h-4" /><span className="hidden sm:inline">Simpan</span>
            </button>
            <button onClick={() => setAskReset(true)} title="Reset workspace"
              className="p-2.5 sm:py-2 sm:px-3 bg-red-600/10 hover:bg-red-600 text-red-500 hover:text-white rounded-xl text-xs font-bold transition-all flex items-center gap-1">
              <Icon n="Trash2" className="w-4 h-4" /><span className="hidden sm:inline">Reset</span>
            </button>
          </div>
        </header>
        <div className="bg-white/95 backdrop-blur-xl border-b border-slate-200 px-2 sm:px-6 py-2 overflow-x-auto hide-scrollbar">
          <div className="flex items-center gap-1 sm:gap-2 sm:justify-center w-max sm:w-full mx-auto">
            {STEPS.map((s, i) => (
              <button key={i} type="button" onClick={() => go(i + 1)} title={s.desc}
                className={"flex items-center gap-1.5 px-2 sm:px-3 py-1.5 rounded-full border transition-all shrink-0 " + (step === i + 1 ? "border-indigo-500 bg-indigo-50 shadow-sm" : "border-transparent hover:bg-slate-50")}>
                <div className={`w-5 h-5 sm:w-6 sm:h-6 rounded-full flex items-center justify-center shrink-0 ${step === i + 1 ? "bg-indigo-600 text-white" : s.bg + " " + s.fg}`}>
                  <Icon n={s.icon} className="w-3 h-3 sm:w-3.5 sm:h-3.5" />
                </div>
                <span className={"text-[9px] sm:text-[10px] font-bold whitespace-nowrap " + (step === i + 1 ? "text-indigo-700" : "text-slate-500")}>{s.short}</span>
                {s.badge && (
                  <span className={"text-[7px] sm:text-[8px] font-black uppercase px-1 py-0.5 rounded " + (step === i + 1 ? "bg-amber-400 text-slate-900" : "bg-amber-100 text-amber-700")}>{s.badge}</span>
                )}
              </button>
            ))}
          </div>
        </div>
        <Banner busy={busy} toast={toast} since={busySince} onClose={() => setToast(null)} />
      </div>

      <main className="max-w-7xl w-full mx-auto px-3 sm:px-4 py-5 sm:py-8 flex-1 space-y-6 sm:space-y-8">
        {step === 1 && <Step1 ctx={ctx} />}
        {step === 2 && <StepFunnel ctx={ctx} />}
        {step === 3 && <Step2 ctx={ctx} />}
        {step === 4 && <Step3 ctx={ctx} />}
        {step === 5 && <Step4 ctx={ctx} />}
        {step === 6 && <Step5 ctx={ctx} />}
      </main>

      {askMap && (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[200] flex items-center justify-center p-4 animate-fade-in">
          <div className="bg-white rounded-3xl p-6 shadow-2xl max-w-md w-full space-y-4">
            <div className="flex items-center gap-3">
              <div className="w-11 h-11 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center shrink-0"><Icon n="AlertTriangle" className="w-5 h-5" /></div>
              <h3 className="text-base font-black text-slate-800" style={{ fontFamily: "Space Grotesk,sans-serif" }}>Sebagian Aset Belum Siap</h3>
            </div>
            <p className="text-xs text-slate-500 leading-relaxed">Kategori berikut <b>akan dilewati</b> — penandanya tidak akan aktif di shot mana pun:</p>
            <ul className="space-y-1.5">
              {askMap.map(m => (
                <li key={m} className="text-[11px] font-semibold text-amber-800 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2">{m}</li>
              ))}
            </ul>
            <p className="text-[11px] text-slate-400 leading-relaxed">Disarankan lengkapi dulu di bawah, lalu tekan tombol ini lagi.</p>
            <div className="flex items-center gap-3 pt-1">
              <button onClick={() => setAskMap(null)} className="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs">Batal, Lengkapi Dulu</button>
              <button onClick={async () => { const ok = await runMapRefs(true); if (ok && askMapGo) go(6); }} className="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs">Tetap Lanjutkan</button>
            </div>
          </div>
        </div>
      )}

      <ProjectManagerModal open={projectModal.open} mode={projectModal.mode}
        onClose={() => setProjectModal(m => ({ ...m, open: false }))}
        current={snapshot()} onLoad={applyProject} onReset={resetAll} say={say} />

      {askReset && (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[200] flex items-center justify-center p-4 animate-fade-in">
          <div className="bg-white rounded-3xl p-6 shadow-2xl max-w-sm w-full flex flex-col items-center text-center space-y-4">
            <div className="w-12 h-12 bg-red-100 text-red-500 rounded-full flex items-center justify-center"><Icon n="AlertTriangle" className="w-6 h-6" /></div>
            <h3 className="text-lg font-black text-slate-800" style={{ fontFamily: "Space Grotesk,sans-serif" }}>Hapus Semua Kemajuan?</h3>
            <p className="text-xs text-slate-500 leading-relaxed">Seluruh brief, naskah, dan gambar referensi akan dihapus. Tindakan ini tidak bisa dibatalkan.</p>
            <div className="flex items-center gap-3 w-full pt-2">
              <button onClick={() => setAskReset(false)} className="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs">Batal</button>
              <button onClick={resetAll} className="flex-1 py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl text-xs flex items-center justify-center gap-1.5">
                <Icon n="Trash2" className="w-4 h-4" /> Ya, Hapus
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------- tombol lanjut sticky ---------- */
const NextBar = ({ ok, onNext, label, warn }) => (
  <div className="sticky bottom-3 sm:bottom-6 z-50 flex justify-center w-full px-2 sm:px-4 mt-6 sm:mt-8 pointer-events-none">
    <button onClick={() => ok ? onNext() : warn()} disabled={!ok}
      className="pointer-events-auto px-5 sm:px-8 bg-slate-900 hover:bg-slate-800 disabled:bg-slate-300 disabled:text-slate-500 text-white font-black rounded-full text-xs sm:text-sm transition-all shadow-xl shadow-slate-900/20 flex items-center justify-center gap-2 sm:gap-3 py-3.5 sm:py-4 w-full max-w-md ring-4 ring-white border border-slate-800">
      {!ok && <Icon n="Lock" className="w-4 h-4 sm:w-5 sm:h-5 opacity-50 shrink-0" />}
      <span className="truncate">{label}</span>
      <Icon n="ChevronRight" className="w-4 h-4 sm:w-5 sm:h-5 shrink-0" />
    </button>
  </div>
);

const BackBar = ({ onBack, badge, title, desc }) => (
  <div className="bg-white p-4 md:p-6 rounded-3xl shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 relative overflow-hidden">
    <div className="absolute top-0 right-0 -mr-10 -mt-10 w-32 h-32 bg-indigo-50 rounded-full blur-2xl pointer-events-none" />
    <div className="relative z-10">
      <span className="text-xs font-bold text-indigo-600 uppercase tracking-widest bg-indigo-50 border border-indigo-100 px-2.5 py-1 rounded-full">{badge}</span>
      <h2 className="text-xl font-black mt-2 text-slate-900" style={{ fontFamily: "Space Grotesk,sans-serif" }}>{title}</h2>

        <div className="pt-5 border-t border-slate-100 space-y-2 relative z-10">

            ["Persona Kreator", "creatorPersona", "Contoh: Dokter, everyday user, reviewer"],

            <div className="space-y-1.5">

            </div>
          </div>
        </Card>
      </div>

      <NextBar ok={okStep1} onNext={() => go(2)} label="LANJUT KE TAHAPAN FUNNEL (STEP 2)"
        warn={() => say("Lengkapi seluruh form di Step 1 dulu!", "error")} />

  );
