      )}

      <NextBar ok={okStep4} onNext={mapThenGo}
        label={mapped ? "Lanjut ke Render Storyboard" : "Petakan Referensi & Lanjut ke Render"}
        warn={() => say("Lengkapi dulu: " + step4Missing.join(" · "), "error")} />
    </div>
  );
}


/* ===== 10_step5.jsx ===== */
/* ============================================================
   STEP 6 — Render Storyboard & Prompt I2V
   ============================================================ */
function Step5({ ctx }) {
  const { brief, meta, scenes, setScenes, prodImgs, mergedPanel, talent1, talent2, locRefs, propRefs,
          faceless, flags, busy, say, go, renderOne, renderScene, renderAll, cancelRender, exportScene, setExportScene, A } = ctx;

  /* progres render seluruh video — dipakai bar status & tombol unduh massal */
  const allShots = scenes.flatMap(s => s.shots || []);
  const totalShots = allShots.length;
  const doneShots = allShots.filter(x => x.imageUrl).length;
  const rendering = Boolean(flags.all) || Object.keys(flags).some(k => k.indexOf("sc") === 0 && flags[k]);

  const updShot = (si, shi, patch) => setScenes(p => p.map((s, i) => i !== si ? s : { ...s, shots: s.shots.map((x, j) => j !== shi ? x : { ...x, ...patch }) }));
  const upd = (si, patch) => setScenes(p => p.map((s, i) => i === si ? { ...s, ...patch } : s));
  const portrait = meta.format === "portrait";

  const copyI2V = sc => {
    const txt = buildI2V(sc, A);
    const ta = document.createElement("textarea");
    ta.value = txt; ta.style.position = "fixed"; ta.style.top = "0"; ta.style.left = "0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand("copy") ? say("Prompt I2V Scene " + sc.sceneNumber + " disalin!") : say("Gagal menyalin.", "error"); }
    catch (e) { say("Gagal menyalin: " + e.message, "error"); }
    document.body.removeChild(ta);
  };

  const dlTxt = sc => {
    const blob = new Blob([buildI2V(sc, A)], { type: "text/plain;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `Scene_${sc.sceneNumber}_I2V_${brief.productName || "UGC"}.txt`;
    a.click();
    say("Prompt I2V diunduh!");
  };

  const dlAll = () => {
    const all = scenes.map(sc => buildI2V(sc, A)).join("\n\n" + "=".repeat(70) + "\n\n");
    const blob = new Blob([all], { type: "text/plain;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `SEMUA_PROMPT_I2V_${brief.productName || "UGC"}.txt`;
    a.click();
    say("Semua prompt I2V diunduh!");
  };

  /* salin seluruh naskah sebagai teks siap tempel (brief + VO + shot) */
  const copyFullScript = () => {
    let out = `=== STORYBOARD NASKAH UGC: ${brief.productName || "PRODUK"} ===\n`;
    out += `Tahapan Funnel: ${brief.funnelStage || "-"} (${brief.audienceAwareness || "-"})\n`;
    out += `Sudut Cerita: ${brief.funnelAngle || "-"}\n`;
    out += `Goal: ${brief.goal || "-"} | Gaya Video: ${meta.videoType} | Format: ${meta.format}\n`;
    out += `CTA: ${brief.cta || "-"}\n\n`;
    scenes.forEach(sc => {
      out += `--- SCENE ${sc.sceneNumber}: ${sc.title} ---\n`;
      out += `VO: "${sc.voiceover}"\n`;
      if (sc.sfx) out += `SFX: ${sc.sfx}\n`;
      (sc.shots || []).forEach(sh => {
        out += `  [Shot ${sh.shotNumber}] (${sh.timeRange}) ${sh.title || ""}\n`;
        out += `  Visual: ${sh.visualDescription}\n`;
        out += `  Kamera: ${sh.cameraMove || "-"} | Talent: ${sh.talent || "-"} | Lokasi: ${sh.location || "-"}\n`;
        if (sh.props) out += `  Props: ${sh.props}\n`;
      });
      if (sc.transitionNote) out += `  Transisi: ${sc.transitionNote}\n`;
      out += "\n";
    });
    const ta = document.createElement("textarea");
    ta.value = out; ta.style.position = "fixed"; ta.style.top = "0"; ta.style.left = "0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand("copy") ? say("Naskah lengkap disalin ke clipboard! 📋") : say("Gagal menyalin.", "error"); }
    catch (e) { say("Gagal menyalin: " + e.message, "error"); }
    document.body.removeChild(ta);
  };

  /* unduh semua frame yang sudah dirender sekaligus */
  const dlAllImages = () => {
    let n = 0;
    scenes.forEach(sc => (sc.shots || []).forEach(sh => {
      if (!sh.imageUrl) return;
      n++;
      const a = document.createElement("a");
      a.href = sh.imageUrl;
      a.download = `Scene_${sc.sceneNumber}_Shot_${sh.shotNumber}_${brief.productName || "UGC"}.png`;
      a.click();
    }));
    n ? say(`${n} gambar storyboard diunduh! 📥`) : say("Belum ada visual yang di-render.", "error");
  };

  const exportPNG = async n => {
    const el = document.getElementById("cap-" + n);
    if (!el) return;
    setExportScene(n);
    await new Promise(r => setTimeout(r, 180));
    try {
      const url = await domtoimage.toPng(el, { bgcolor: "#ffffff" });
      const a = document.createElement("a");
      a.download = `Scene_${n}_${brief.productName || "UGC"}.png`;
      a.href = url; a.click();
      say("Scene diekspor PNG! 🎬");
    } catch (e) { say("Gagal ekspor PNG.", "error"); }
    finally { setExportScene(null); }
  };

  return (
    <div className="space-y-8 animate-fade-in">
      <BackBar onBack={() => go(5)} badge="Langkah 6" title="Render Storyboard & Prompt I2V"
        desc="Render tiap shot jadi gambar storyboard, lalu salin prompt Image-to-Video per scene." />

      <div className="bg-slate-900 text-white p-5 rounded-3xl shadow-xl space-y-4">
        <div className="flex items-start justify-between flex-wrap gap-4">
          <div className="space-y-1.5 min-w-0">
            <div className="flex items-center gap-2 flex-wrap">
              <span className="text-[10px] font-black tracking-wider uppercase bg-amber-400 text-slate-900 px-2.5 py-0.5 rounded-full">
                Funnel: {brief.funnelStage || "-"}
              </span>
              <span className="text-[11px] text-slate-300 font-semibold">{brief.audienceAwareness || "-"}</span>
            </div>
            <h4 className="text-sm font-black text-white" style={{ fontFamily: "Space Grotesk,sans-serif" }}>
              {brief.productName || "Produk"} — {scenes.length} Scene / {totalShots} Shot
            </h4>
            <p className="text-[11px] text-slate-400">
              Progres render: <b className="text-white">{doneShots}</b> dari <b className="text-white">{totalShots}</b> shot selesai
            </p>
          </div>
          <div className="flex items-center gap-2 flex-wrap w-full sm:w-auto">
            {rendering ? (
              <button onClick={cancelRender}
                className="py-2 px-4 bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs rounded-xl flex items-center gap-1.5 shadow-lg shadow-rose-600/30">
                <Icon n="X" className="w-3.5 h-3.5" /> Batal Render
              </button>
            ) : (
              <button onClick={renderAll} disabled={Boolean(busy) || !scenes.length}
                className="py-2 px-4 bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white font-bold text-xs rounded-xl flex items-center gap-1.5">
                <Icon n="Zap" className="w-3.5 h-3.5 text-yellow-300" /> Render Semua Frame
              </button>
            )}
            <button onClick={dlAll} disabled={!scenes.length} title="Satu prompt per scene = satu klip 10 detik"
              className="py-2 px-4 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-40 text-white font-bold text-xs rounded-xl flex items-center gap-1.5">
              <Icon n="Download" className="w-3.5 h-3.5" /> Prompt I2V
            </button>
            <button onClick={copyFullScript} disabled={!scenes.length}
              className="py-2 px-3.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 disabled:opacity-40 text-slate-200 font-bold text-xs rounded-xl flex items-center gap-1.5">
              <Icon n="Copy" className="w-3.5 h-3.5" /> Salin Naskah
            </button>
            <button onClick={dlAllImages} disabled={!doneShots}
              className="py-2 px-3.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 disabled:opacity-40 text-slate-200 font-bold text-xs rounded-xl flex items-center gap-1.5">
              <Icon n="ImageIcon" className="w-3.5 h-3.5" /> Unduh Gambar
            </button>
          </div>
        </div>
        {Boolean(totalShots) && (
          <div className="h-1.5 w-full bg-slate-800 rounded-full overflow-hidden">
            <div className="h-full bg-emerald-500 transition-all" style={{ width: (doneShots / totalShots * 100) + "%" }} />
          </div>
        )}
      </div>

      {faceless && (
        <div className="bg-slate-900 text-white rounded-3xl p-4 md:p-6 border shadow-lg space-y-4">
          <div className="flex items-center gap-2">
            <Icon n="Sparkles" className="w-5 h-5 text-indigo-400" />
            <h3 className="font-black text-sm" style={{ fontFamily: "Space Grotesk,sans-serif" }}>🎞️ Motion Graphic Control Center</h3>
          </div>
          <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2">
            {ANIM_STYLES.map(a => (
              <button key={a.name} onClick={() => {
                  setScenes(p => p.map(s => ({ ...s, shots: s.shots.map(x => ({ ...x, productAnim: true, animStyle: a.name })) })));
                  say(`Gaya "${a.name}" diterapkan ke semua shot! 🎬`);
                }}
                className="p-3 bg-slate-800 border border-slate-700 hover:border-indigo-400 rounded-xl text-left transition-all group">
                <p className="text-xs font-bold text-white group-hover:text-indigo-300">{a.name}</p>
              </button>
            ))}
          </div>
          <p className="text-[10px] text-slate-400">*Klik untuk menerapkan gaya animasi ke seluruh shot sekaligus.</p>
        </div>
      )}

      {!scenes.length && (
        <div className="bg-white rounded-3xl border border-dashed border-slate-300 p-16 text-center">
          <Icon n="Clapperboard" className="w-12 h-12 text-slate-300 mx-auto mb-4" />
          <h3 className="text-sm font-bold text-slate-700">Belum ada skenario</h3>
          <p className="text-xs text-slate-400 mt-1">Kembali ke Langkah 4 untuk menyusun naskah lebih dulu.</p>
        </div>
      )}

      {scenes.map((sc, si) => (
        <div key={si} className="bg-white rounded-3xl border shadow-sm p-4 md:p-6 space-y-6">
          <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-4">
            <div className="flex items-center gap-3">
              <span className="bg-indigo-600 text-white text-[10px] font-black tracking-widest py-1 px-3 rounded-full uppercase">Scene {sc.sceneNumber}</span>
              <h4 className="text-base font-black text-slate-800" style={{ fontFamily: "Space Grotesk,sans-serif" }}>{sc.title}</h4>
            </div>
            <div className="grid grid-cols-2 sm:flex sm:items-center gap-2 sm:flex-wrap">
              <button onClick={() => renderScene(si)} disabled={Boolean(busy) || flags["sc" + si]}
                className="py-2.5 px-3 bg-violet-600 hover:bg-violet-700 disabled:opacity-50 text-white font-bold text-[11px] rounded-xl flex items-center justify-center gap-1.5">
                <Icon n="Zap" className="w-3.5 h-3.5 text-yellow-300" /> Render Scene
              </button>
              <button onClick={() => copyI2V(sc)} className="py-2.5 px-3 bg-indigo-50 border border-indigo-200 hover:bg-indigo-100 text-indigo-700 font-bold text-[11px] rounded-xl flex items-center justify-center gap-1">
                <Icon n="Copy" className="w-3.5 h-3.5" /> Copy I2V
              </button>
              <button onClick={() => dlTxt(sc)} className="py-2.5 px-3 bg-slate-50 border hover:bg-slate-100 text-slate-700 font-bold text-[11px] rounded-xl flex items-center justify-center gap-1">
                <Icon n="Download" className="w-3.5 h-3.5" /> TXT
              </button>
              <button onClick={() => exportPNG(sc.sceneNumber)} className="py-2.5 px-3 bg-slate-50 border hover:bg-slate-100 text-slate-700 font-bold text-[11px] rounded-xl flex items-center justify-center gap-1">
                <Icon n="ImageIcon" className="w-3.5 h-3.5" /> PNG
              </button>
            </div>
          </div>

          <div id={"cap-" + sc.sceneNumber} className={"space-y-6 " + (exportScene === sc.sceneNumber && portrait ? "w-max pr-8" : "")}>
            {exportScene === sc.sceneNumber ? (
              <div className="bg-slate-900 rounded-2xl p-5 mb-4 border border-slate-700">
                <h3 className="text-white font-black text-xl mb-2" style={{ fontFamily: "Space Grotesk,sans-serif" }}>{sc.title}</h3>
                <p className="text-amber-300 font-black text-xs uppercase tracking-widest mb-1">VOICEOVER / DIALOG</p>
                <p className="text-white italic text-base font-semibold whitespace-pre-wrap leading-relaxed">{sc.voiceover}</p>
              </div>
            ) : (
              <div className="bg-slate-900 rounded-2xl p-5 space-y-4">
                <div className="flex flex-wrap gap-2 text-[10px] text-slate-300 border-b border-slate-700 pb-3">
                  {[["Format", meta.format], ["Tone", meta.tone], ["Video", meta.videoType], ["Kamera", (brief.cameraStyle || "").split(" (")[0]]].map(([k, v]) => (
                    <span key={k} className="px-2 py-1 bg-slate-800 rounded-lg">{k}: <strong className="text-white">{v}</strong></span>
                  ))}
                </div>
                <div>
                  <label className="text-[9px] font-bold text-amber-400 block mb-1">NASKAH / VOICE OVER</label>
                  <textarea rows={3} value={sc.voiceover} onChange={e => upd(si, { voiceover: e.target.value })}
                    className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-xs text-white italic focus:outline-none focus:border-indigo-500 resize-none" />
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div>
                    <label className="text-[9px] font-bold text-slate-400 block mb-1">JUDUL SCENE</label>
                    <input type="text" value={sc.title} onChange={e => upd(si, { title: e.target.value })}
                      className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500" />
                  </div>
                  <div>
                    <label className="text-[9px] font-bold text-slate-400 block mb-1">AUDIO / SFX</label>
                    <input type="text" value={sc.sfx || ""} onChange={e => upd(si, { sfx: e.target.value })}
                      className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500" />
                  </div>
                  <div>
                    <label className="text-[9px] font-bold text-slate-400 block mb-1">TRANSISI AKHIR</label>
                    <input type="text" value={sc.transitionNote} onChange={e => upd(si, { transitionNote: e.target.value })}
                      className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500" />
                  </div>
                </div>
                <div className="pt-3 border-t border-slate-700/50">
                  <label className="text-[9px] font-bold text-indigo-400 uppercase tracking-widest flex items-center justify-between">
                    <span className="flex items-center gap-1.5"><Icon n="Video" className="w-3 h-3" /> Prompt Image-to-Video (Scene Ini)</span>
                    <button type="button" onClick={() => copyI2V(sc)}
                      className="py-1 px-2 bg-indigo-500/20 hover:bg-indigo-500/40 text-indigo-300 rounded flex items-center gap-1 transition-all">
                      <Icon n="Copy" className="w-3 h-3" /> Copy
                    </button>
                  </label>
                  <textarea readOnly rows={4} value={buildI2V(sc, A)}
                    className="w-full mt-2 bg-slate-950 border border-slate-700 rounded-lg p-3 text-[10px] text-slate-300 font-mono resize-y focus:outline-none" />
                </div>
              </div>
            )}

            <div className={portrait
              ? (exportScene === sc.sceneNumber ? "flex flex-row gap-4 pb-2" : "flex flex-row overflow-x-auto gap-4 pb-2 snap-x")
              : "grid grid-cols-1 md:grid-cols-2 gap-6"}>
              {sc.shots.map((sh, shi) => {
                const rendering = flags[si + "-" + shi];
                const exporting = exportScene === sc.sceneNumber;
                return (
                  <div key={shi} className={"bg-white border-2 border-slate-100 rounded-3xl p-3.5 sm:p-5 shadow-sm snap-center flex flex-col gap-3 sm:gap-4 " + (portrait ? "w-[78vw] sm:w-[300px] md:w-[320px] shrink-0" : "w-full")}>
                    <div className="flex justify-between items-center border-b pb-2">
                      <span className="text-xs font-black text-rose-500">Shot {sh.shotNumber}</span>
                      <span className="text-[10px] text-slate-400 font-mono">{sh.timeRange}</span>
                    </div>

                    <div className={`rounded-2xl border-2 relative overflow-hidden flex items-center justify-center bg-slate-50 ${portrait ? "aspect-[9/16]" : "aspect-[16/9]"} w-full`}>
                      {sh.imageUrl ? <img src={sh.imageUrl} className="w-full h-full object-contain" alt="" />
                        : rendering ? (
                          <div className="text-center space-y-2">
                            <Icon n="RefreshCw" className="w-6 h-6 text-indigo-500 spin mx-auto" />
                            <p className="text-[10px] text-indigo-400 font-bold">Rendering Frame...</p>
                          </div>
                        ) : (
                          <div className="text-center p-4 space-y-3">
                            <Icon n="ImageIcon" className="w-8 h-8 text-slate-300 mx-auto" />
                            <p className="text-[10px] text-slate-400 font-bold">Belum ada visual</p>
                          </div>
                        )}
                    </div>

                    {!exporting && (
                      <div className="flex gap-1.5">
                        <button onClick={() => renderOne(si, shi)} disabled={rendering || Boolean(busy)}
                          className="flex-1 py-1.5 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-400 text-white rounded-xl text-[10px] font-bold flex items-center justify-center gap-1 transition-all">
                          <Icon n="RefreshCw" className="w-3 h-3" /> {sh.imageUrl ? "Render Ulang" : "Render Visual"}
                        </button>
                        <label className="py-1.5 px-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-[10px] font-bold cursor-pointer flex items-center gap-1">
                          <Icon n="Upload" className="w-3 h-3" /> Upload
                          <input type="file" accept="image/*" className="hidden"
                            onChange={async e => { const f = e.target.files?.[0]; if (f) { updShot(si, shi, { imageUrl: await shrink(await fileToData(f)) }); say("Gambar shot diunggah!"); } e.target.value = ""; }} />
                        </label>
                        {sh.imageUrl && (
                          <button onClick={() => { const a = document.createElement("a"); a.href = sh.imageUrl; a.download = `S${si + 1}_Shot${sh.shotNumber}.png`; a.click(); }}
                            title="Unduh" className="py-1.5 px-2 bg-emerald-100 hover:bg-emerald-200 text-emerald-700 rounded-xl text-[10px] font-bold flex items-center">
                            <Icon n="Download" className="w-3 h-3" />
                          </button>
                        )}
                      </div>
                    )}

                    <div className="flex-1 flex flex-col gap-3">
                      {[["Judul Shot", "title"], ["Lokasi Latar", "location"], ["Talent Shot", "talent"], ["Props Shot", "props"], ["Gerak Kamera", "cameraMove"], ["Angle Kamera", "cameraAngle"]].map(([lab, key]) => (
                        <div key={key} className="space-y-1">
                          <Label>{lab}</Label>
                          {exporting
                            ? <div className="w-full bg-white border-2 border-slate-300 rounded-lg px-3 py-2 text-slate-900 min-h-[2.2rem] flex items-center text-xs font-bold">{sh[key] || "-"}</div>
                            : <input type="text" value={sh[key] || ""} onChange={e => updShot(si, shi, { [key]: e.target.value })}
                                className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs font-semibold text-slate-800 focus:outline-none focus:border-indigo-400 focus:bg-white" />}
                        </div>
                      ))}
                      <div className="space-y-1">
                        <Label>Deskripsi Visual</Label>
                        {exporting
                          ? <div className="w-full bg-white border-2 border-slate-300 rounded-lg p-3 text-slate-900 text-sm font-semibold leading-relaxed whitespace-pre-wrap">{sh.visualDescription}</div>
                          : <textarea rows={4} value={sh.visualDescription} onChange={e => updShot(si, shi, { visualDescription: e.target.value })}
                              className="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 text-xs text-slate-800 resize-none leading-relaxed focus:outline-none focus:border-indigo-400 focus:bg-white" />}
                      </div>
                      <div className="space-y-1">
                        <Label>Catatan Sutradara</Label>
                        {exporting
                          ? <div className="w-full bg-white border-2 border-slate-300 rounded-lg p-3 text-slate-900 text-xs font-bold whitespace-pre-wrap">{sh.directorNotes}</div>
                          : <textarea rows={3} value={sh.directorNotes} onChange={e => updShot(si, shi, { directorNotes: e.target.value })}
                              className="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 text-xs text-slate-600 resize-none leading-relaxed focus:outline-none focus:border-indigo-400 focus:bg-white" />}
                      </div>

                      {!exporting && (
                        <>
                          <div className="pt-2 border-t border-dashed space-y-1.5">
                            <span className="text-[9px] font-bold text-slate-400 block uppercase">Referensi Gambar Aktif</span>
                            <div className="flex flex-wrap gap-1.5">
                              {[0, 1, 2].map(i => locRefs[i]?.img ? (
                                <label key={"l" + i} className={"flex items-center gap-1 px-2 py-1 rounded border text-[10px] font-bold cursor-pointer transition-all " + (sh.useLocationRefs?.[i] ? "bg-cyan-600 text-white border-cyan-600" : "bg-white text-slate-600 border-slate-200 hover:bg-slate-50")}>
                                  <input type="checkbox" className="hidden" checked={Boolean(sh.useLocationRefs?.[i])}
                                    onChange={e => { const a = [...(sh.useLocationRefs || [false, false, false])]; a[i] = e.target.checked; updShot(si, shi, { useLocationRefs: a }); }} />
                                  📍 Lokasi {i + 1}
                                </label>
                              ) : null)}

                              {talent1 && (
                                <label className={"flex items-center gap-1 px-2 py-1 rounded border text-[10px] font-bold cursor-pointer transition-all " + (sh.useTalentRef ? "bg-indigo-600 text-white border-indigo-600" : "bg-white text-slate-600 border-slate-200 hover:bg-slate-50")}>
                                  <input type="checkbox" className="hidden" checked={Boolean(sh.useTalentRef)} onChange={e => updShot(si, shi, { useTalentRef: e.target.checked })} />
                                  👤 Talent 1
                                </label>
                              )}
                              {talent2 && brief.talentCount === "2 Talent (Interaksi)" && (
                                <label className={"flex items-center gap-1 px-2 py-1 rounded border text-[10px] font-bold cursor-pointer transition-all " + (sh.useTalent2Ref ? "bg-indigo-600 text-white border-indigo-600" : "bg-white text-slate-600 border-slate-200 hover:bg-slate-50")}>
                                  <input type="checkbox" className="hidden" checked={Boolean(sh.useTalent2Ref)} onChange={e => updShot(si, shi, { useTalent2Ref: e.target.checked })} />
                                  👤 Talent 2
                                </label>
                              )}

                              {prodImgs.map((p, i) => p ? (
                                <label key={"p" + i} className={"flex items-center gap-1 px-2 py-1 rounded border text-[10px] font-bold cursor-pointer transition-all " + (sh.useProductRefs?.[i] ? "bg-emerald-600 text-white border-emerald-600" : "bg-white text-slate-600 border-slate-200 hover:bg-slate-50")}>
                                  <input type="checkbox" className="hidden" checked={Boolean(sh.useProductRefs?.[i])}
                                    onChange={e => { const a = [...(sh.useProductRefs || [false, false, false, false])]; a[i] = e.target.checked; updShot(si, shi, { useProductRefs: a }); }} />
                                  🧴 Produk {i + 1}
                                </label>
                              ) : null)}

                              {mergedPanel && (
                                <label className={"flex items-center gap-1 px-2 py-1 rounded border text-[10px] font-bold cursor-pointer transition-all " + (sh.useMergedRef ? "bg-fuchsia-600 text-white border-fuchsia-600" : "bg-white text-slate-600 border-slate-200 hover:bg-slate-50")}>
                                  <input type="checkbox" className="hidden" checked={Boolean(sh.useMergedRef)} onChange={e => updShot(si, shi, { useMergedRef: e.target.checked })} />
                                  🧩 Panel Gabungan
                                </label>
                              )}

                              {SCENARIO_PROPS.filter(p => (propRefs[p.key] || []).some(s => s?.img)).map(p => (
                                <label key={p.key} className={"flex items-center gap-1 px-2 py-1 rounded border text-[10px] font-bold cursor-pointer transition-all " + (sh.useScenarioPropRefs?.[p.key] ? "bg-rose-600 text-white border-rose-600" : "bg-white text-slate-600 border-slate-200 hover:bg-slate-50")}>
                                  <input type="checkbox" className="hidden" checked={Boolean(sh.useScenarioPropRefs?.[p.key])}
                                    onChange={e => updShot(si, shi, { useScenarioPropRefs: { ...(sh.useScenarioPropRefs || {}), [p.key]: e.target.checked } })} />
                                  {p.emoji} {p.label.replace("Props ", "")}
                                </label>
                              ))}

                              {(shi > 0 || si > 0) && (
                                <label className={"flex items-center gap-1 px-2 py-1 rounded border text-[10px] font-bold cursor-pointer transition-all " + (sh.usePrevFrame ? "bg-slate-800 text-white border-slate-800" : "bg-white text-slate-600 border-slate-200 hover:bg-slate-50")}
                                  title="Kirim frame sebelumnya sebagai acuan konsistensi wardrobe & pencahayaan">
                                  <input type="checkbox" className="hidden" checked={Boolean(sh.usePrevFrame)} onChange={e => updShot(si, shi, { usePrevFrame: e.target.checked })} />
                                  <Icon n="Link" className="w-3 h-3" /> Frame Sebelumnya
                                </label>
                              )}
                            </div>
                          </div>

                          <div className="flex items-center justify-between gap-2 flex-wrap pt-1">
                            <label className="flex items-center gap-1.5 text-[10px] font-bold text-slate-500 cursor-pointer">
                              <input type="checkbox" checked={Boolean(sh.productAnim)} onChange={e => updShot(si, shi, { productAnim: e.target.checked })} />
                              Motion Graphic
                            </label>
                            {sh.productAnim && (
                              <select value={sh.animStyle} onChange={e => updShot(si, shi, { animStyle: e.target.value })}
                                className="text-[9px] font-bold bg-slate-50 border border-slate-200 rounded px-1.5 py-0.5">
                                {ANIM_STYLES.map(a => <option key={a.name} value={a.name}>{a.name}</option>)}
                                <option value="Kustom">Kustom</option>
                              </select>
                            )}
                          </div>
                          {sh.productAnim && sh.animStyle === "Kustom" && (
                            <input type="text" value={sh.animStyleCustom || ""} onChange={e => updShot(si, shi, { animStyleCustom: e.target.value })}
                              placeholder="Deskripsi gaya animasi kustom..."
                              className="text-[9px] font-bold bg-slate-50 border border-slate-200 rounded px-1.5 py-1 w-full" />
                          )}
                        </>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      ))}

      <div className="flex justify-start pt-6 border-t">
        <button onClick={() => go(3)} className="py-3 px-6 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl transition-all">← Kembali ke Edit Konsep</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
