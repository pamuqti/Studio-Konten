          <p className="text-[11px] text-amber-700/80 leading-relaxed max-w-md">5 ide PURE UGC — setiap ide terasa seperti konten personal spontan yang direkam di rumah dengan smartphone, bukan produksi iklan profesional. Masing-masing untuk mode produksi berbeda (On-Cam, VO, 2 Talent, Faceless, Motion Graphic) dengan sudut cerita berbeda, dirancang untuk tahapan funnel <b>{brief.funnelStage || "TOFU"}</b>. Atau tulis sendiri.</p>
          <button type="button" onClick={runIdeas} disabled={Boolean(busy) || !seed.trim()}
            className="flex items-center gap-2 px-6 py-3 mt-1 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 disabled:from-amber-300 disabled:to-amber-300 text-white text-xs font-black rounded-full shadow-lg shadow-amber-300/50 transition-all">
            <Icon n="Sparkles" className="w-4 h-4" /> Generate 5 Ide Cerita (AI)
          </button>
        </div>

        {ideas?.length > 0 && (
          <div className="flex flex-col gap-2">
            {ideas.map((x, i) => {
              const on = pickIdea === "idea" + i;
              return (
              <label key={i} onClick={() => { setPickIdea("idea" + i); setFeedback(null); patchBrief({ customIdea:
                  `Sudut Cerita: ${x.angle || "-"}\nMode: ${x.mode}\nJudul: ${x.title}\nHOOK 3 DETIK (wajib jadi shot pertama): ${x.hook || "-"}\nSkenario: ${x.scenario}${x.whyItWorks ? `\nAlasan efektif: ${x.whyItWorks}` : ""}` }); }}
                className={"flex items-start gap-3 p-3 rounded-xl border cursor-pointer transition-all " + (on ? "bg-amber-100 border-amber-400 ring-1 ring-amber-400 shadow-sm" : "bg-white border-amber-200 hover:border-amber-300")}>
                <div className={"mt-0.5 w-3.5 h-3.5 rounded-full border-2 flex items-center justify-center shrink-0 " + (on ? "border-amber-500" : "border-slate-300")}>
                  {on && <div className="w-1.5 h-1.5 rounded-full bg-amber-500" />}
                </div>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-1.5 flex-wrap">
                    <span className="text-[8px] font-black px-1.5 py-0.5 bg-slate-800 text-white rounded uppercase tracking-wide">{i + 1}. {x.mode}</span>
                    {x.angle && <span className="text-[8px] font-black px-1.5 py-0.5 bg-amber-500 text-white rounded uppercase tracking-wide">Sudut: {x.angle}</span>}
                    {x.beatDipakai && <span className="text-[8px] font-black px-1.5 py-0.5 bg-rose-600 text-white rounded uppercase tracking-wide">Beat: {x.beatDipakai}</span>}
                  </div>
                  <p className="text-[11px] font-bold text-amber-900 mt-1">{x.title}</p>
                  {x.hook && (
                    <p className="text-[10px] text-slate-800 mt-1.5 leading-relaxed bg-white/80 border-l-2 border-amber-500 pl-2 py-1 rounded-r">
                      <span className="font-black text-amber-700">HOOK 3 DTK: </span>"{x.hook}"
                    </p>
                  )}
                  <p className="text-[10px] text-amber-800/70 mt-1.5 leading-relaxed">{x.scenario}</p>
                  {x.whyItWorks && <p className="text-[9px] text-emerald-700 mt-1.5 leading-relaxed italic">💡 {x.whyItWorks}</p>}
                </div>
              </label>
            );})}
            <label onClick={() => { setPickIdea("custom"); if ((brief.customIdea || "").startsWith("Mode:")) patchBrief({ customIdea: "" }); }}
              className={"flex items-start gap-3 p-3 rounded-xl border cursor-pointer transition-all " + (pickIdea === "custom" ? "bg-amber-100 border-amber-400 ring-1 ring-amber-400" : "bg-white border-amber-200 hover:border-amber-300")}>
              <div className={"mt-0.5 w-3.5 h-3.5 rounded-full border-2 flex items-center justify-center shrink-0 " + (pickIdea === "custom" ? "border-amber-500" : "border-slate-300")}>
                {pickIdea === "custom" && <div className="w-1.5 h-1.5 rounded-full bg-amber-500" />}
              </div>
              <div className="flex-1">
                <span className="text-[10px] font-bold text-amber-900">Tulis Sendiri (Custom)</span>
                <p className="text-[10px] text-amber-800/70 mt-1">Gunakan editor di bawah untuk menulis bebas ide POV, drama, atau skenario spesifik.</p>
              </div>
            </label>
          </div>
        )}

        <textarea rows={3} value={brief.customIdea || ""} onChange={e => { patchBrief({ customIdea: e.target.value }); setPickIdea("custom"); setFeedback(null); }}
          placeholder="Contoh: POV problem wajah kusam saat bangun tidur, lalu solusi dalam drama mini yang lucu..."
          className="w-full bg-white border border-amber-200 shadow-sm rounded-xl p-3 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 resize-y leading-relaxed" />

        <div className="flex justify-center">
          <button type="button" onClick={runApplyIdea} disabled={Boolean(busy) || !(brief.customIdea || "").trim()}
            className="flex items-center gap-2 px-6 py-2.5 bg-amber-500 hover:bg-amber-600 disabled:bg-amber-200 text-white text-xs font-black rounded-full shadow-md transition-all">
            <Icon n="Wand2" className="w-4 h-4" /> Terapkan Ide ke Pengaturan (AI)
          </button>
        </div>
        {!hasIdea && (
          <p className="text-[10px] text-amber-800 bg-amber-100/70 border border-amber-300 rounded-lg px-3 py-2 leading-relaxed text-center">
            Pilih salah satu ide di atas, atau tulis ide sendiri di kolom bawah. Naskah tidak bisa dibuat tanpa arah cerita.
          </p>
        )}
        {hasIdea && !feedback && (
          <p className="text-[10px] text-amber-800 bg-amber-100/70 border border-amber-300 rounded-lg px-3 py-2 leading-relaxed text-center">
            ⚠️ Ide belum diterapkan. Naskah dibuat dari <b>hasil penerapan</b> (goal, tone, talent, lokasi, props) —
            bukan dari teks ide saja. Klik tombol di atas dulu sebelum lanjut ke Naskah.
          </p>
        )}
        {feedback && (
          <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-4 max-h-60 overflow-y-auto animate-fade-in">
            <h4 className="text-[11px] font-black text-emerald-800 flex items-center gap-2 mb-2 uppercase tracking-wider">
              <Icon n="Check" className="w-4 h-4 text-emerald-600" /> Pengaturan Diterapkan (Sutradara AI)
            </h4>
            <p className="text-[11.5px] text-emerald-900 leading-relaxed italic border-l-[3px] border-emerald-300 pl-3 whitespace-pre-wrap">"{feedback.directorFeedback}"</p>
            <div className="flex justify-end gap-2 pt-3">
              <button type="button" onClick={() => setFeedback(null)} className="px-3 py-1.5 text-[10px] font-bold text-emerald-700 bg-emerald-100 hover:bg-emerald-200 rounded-lg">Tutup</button>
            </div>
          </div>
        )}
      </div>

      {/* 3.3 goal */}
      <Card color="bg-indigo-600" icon="Compass" title="3.3 Tujuan Video (Goal)" sub="Arah utama seluruh naskah">
        <div className="flex flex-wrap gap-2">
          {GOALS.map(g => (
            <button key={g.key} onClick={() => {
                const vt = goalVideoTypes(g.key);
                const hk = hooksForGoal(g.key);
                patchBrief({ goal: g.key, hookType: hk[0] || brief.hookType, selectedGoalComponents: g.components.slice() });
                if (vt.length) setMeta(m => ({ ...m, videoType: vt[0] }));
              }}
              className={"px-3 py-1.5 rounded-lg text-[10px] font-bold border transition-all " + (brief.goal === g.key ? "bg-indigo-50 text-indigo-700 border-indigo-500 ring-1 ring-indigo-500 shadow-sm" : "bg-white text-slate-600 border-slate-200 hover:border-indigo-300")}>
              {g.label}
            </button>
          ))}
        </div>

        {brief.goal && (
          <div className="mt-4 bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
            <p className="text-[10px] text-slate-600 italic border-b border-slate-200 pb-3">{GOALS.find(g => g.key === brief.goal)?.desc}</p>
            <div className="flex items-center gap-1.5 text-[10px] font-bold text-slate-700 uppercase tracking-wider">
              <Icon n="Check" className="w-3 h-3 text-emerald-500" /> Komponen Taktis Aktif
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              {(() => {
                const base = GOALS.find(g => g.key === brief.goal)?.components || [];
                const extra = comps.filter(c => !base.includes(c));
                return [...base, ...extra].map(c => {
                  const on = comps.includes(c), custom = !base.includes(c);
                  return (
                    <label key={c} className={"flex items-start justify-between gap-2 p-2.5 rounded-xl border text-[10px] cursor-pointer transition-all " + (on ? "bg-emerald-50 border-emerald-300 text-emerald-800 shadow-sm" : "bg-white border-slate-200 text-slate-500 hover:border-slate-300")}>
                      <div className="flex items-start gap-2 flex-1">
                        <input type="checkbox" checked={on} onChange={() => patchBrief({ selectedGoalComponents: on ? comps.filter(x => x !== c) : [...comps, c] })}
                          className="mt-0.5 w-3.5 h-3.5 rounded text-emerald-600 border-slate-300" />
                        <span className="leading-tight font-medium">{c}{custom && <span className="text-[9px] bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded-md font-bold ml-1.5">Kustom</span>}</span>
                      </div>
                      {custom && <button type="button" onClick={e => { e.preventDefault(); patchBrief({ selectedGoalComponents: comps.filter(x => x !== c) }); }} className="text-slate-400 hover:text-rose-400"><Icon n="Trash2" className="w-3.5 h-3.5" /></button>}
                    </label>
                  );
                });
              })()}
            </div>
            <div className="flex gap-2 pt-2 border-t border-slate-200">
              <input type="text" value={newComp} onChange={e => setNewComp(e.target.value)} placeholder="Tambah komponen taktis..."
                onKeyDown={e => { if (e.key === "Enter" && newComp.trim()) { patchBrief({ selectedGoalComponents: [...comps, newComp.trim()] }); setNewComp(""); } }}
                className="flex-1 bg-white border border-slate-200 rounded-lg px-2 py-1.5 text-[10px] focus:outline-none focus:border-indigo-500" />
              <button type="button" onClick={() => { if (newComp.trim()) { patchBrief({ selectedGoalComponents: [...comps, newComp.trim()] }); setNewComp(""); } }}
                className="bg-slate-200 hover:bg-slate-300 text-slate-700 text-[10px] font-bold px-2.5 py-1.5 rounded-lg"><Icon n="Plus" className="w-3 h-3" /></button>
            </div>
          </div>
        )}
      </Card>

      {/* 3.4 mode produksi */}
      <Card color="bg-indigo-600" icon="Video" title="3.4 Mode Produksi & Talent" sub="Siapa yang tampil di video">
        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-2 sm:gap-3">
          {PROD_MODES.map(m => {
            const on = (brief.productionMode || "Talent") === m.prod && (brief.talentCount || "1 Talent Utama") === m.talent;
            return (
              <button key={m.id} onClick={() => {
                  const list = m.prod === "MotionGraphic" ? LOCATIONS_MG : LOCATIONS_TALENT;
                  const loc = list.includes(brief.location) ? brief.location : list[0];
                  patchBrief({ productionMode: m.prod, talentCount: m.talent, location: loc });
                  if ((m.prod === "MotionGraphic" || m.talent === "Tanpa Talent (Hanya Produk)") && ["Day in My Life", "Skit / Mini Drama", "Talking Head"].includes(meta.videoType))
                    setMeta(x => ({ ...x, videoType: "Review Produk" }));
                }}
                className={"p-3 rounded-xl border transition-all flex flex-col items-center text-center gap-2 " + (on ? "border-indigo-500 bg-indigo-50 ring-1 ring-indigo-500 shadow-sm scale-[1.02]" : "border-slate-200 bg-white hover:border-indigo-300")}>
                <div className={"p-2.5 rounded-full " + (on ? "bg-indigo-600 text-white shadow-sm" : "bg-slate-100 text-slate-500")}><Icon n={m.icon} className="w-5 h-5" /></div>
                <div>
                  <h4 className={"text-[11px] font-bold " + (on ? "text-indigo-900" : "text-slate-700")}>{m.label}</h4>
                  <p className={"text-[9px] mt-1 " + (on ? "text-indigo-700/80" : "text-slate-500")}>{m.desc}</p>
                </div>
              </button>
            );
          })}
        </div>
      </Card>

      {/* 3.5 gaya video */}
      <Card color="bg-indigo-600" icon="Clapperboard" title="3.5 Gaya Video" sub="Format penyampaian cerita">
        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
          {VIDEO_TYPES.filter(v => !(isFaceless(brief) && ["Day in My Life", "Skit / Mini Drama", "Talking Head"].includes(v.name))).map(v => {
            const on = meta.videoType === v.name;
            const rec = brief.goal && goalVideoTypes(brief.goal).includes(v.name);
            return (
              <button key={v.name} type="button" onClick={() => setMeta({ ...meta, videoType: v.name })}
                className={"relative p-3.5 rounded-2xl border text-left flex flex-col justify-between gap-3 transition-all " + (on ? "border-indigo-500 bg-white text-indigo-900 ring-1 ring-indigo-500 shadow-md" : "bg-white border-slate-200 hover:border-indigo-300 text-slate-700")}>
                <div className="flex justify-between items-start w-full">
                  <div className={`p-2 rounded-xl border ${on ? v.color : "bg-slate-50 border-slate-200 text-slate-500"}`}><Icon n={v.icon} className="w-4 h-4" /></div>
                  {on && <span className="bg-emerald-500 text-white p-0.5 rounded-full"><Icon n="Check" className="w-3 h-3" /></span>}
                </div>
                <div>
                  <h4 className="font-bold text-xs">{v.name}</h4>
                  <p className={"text-[9px] mt-1 " + (on ? "text-indigo-700/70" : "text-slate-500")}>{v.desc}</p>
                </div>
                {rec && <div className="absolute top-3 right-3 text-[8px] font-black uppercase bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-md border border-emerald-200">Rekomen</div>}
              </button>
            );
          })}
        </div>
      </Card>

      {/* 3.6 tone */}
      <Card color="bg-indigo-600" icon="Music" title="3.6 Tone Narasi" sub="Warna kotak = kecocokan dengan gaya video terpilih">
        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2">
          {TONES.map((t, i) => {
            const sc = COMBO[meta.videoType]?.[i] ?? 1;
            const base = sc === 3 ? "bg-emerald-50 border-emerald-300 text-emerald-700"
                       : sc === 2 ? "bg-amber-50 border-amber-300 text-amber-700"
                       : "bg-white border-slate-200 text-slate-600 hover:border-indigo-300";
            return (
              <button key={t} type="button" onClick={() => setMeta({ ...meta, tone: t })}
                className={`px-3 py-2.5 rounded-xl text-[10px] font-bold border text-left transition-all ${base} ${meta.tone === t ? "ring-2 ring-indigo-500 shadow-md scale-105" : ""}`}>
                <span className="block truncate">{t}</span>
              </button>
            );
          })}
        </div>
      </Card>

      <NextBar ok={okStep2} onNext={() => go(4)} label="Lanjut ke Naskah"
        warn={() => say(!ceritaSiap
          ? `Lengkapi Kesaksian Pencerita dulu (${ceritaTerisi}/${STORY_BEATS.length} beat terisi) — itu jantung naskahnya, bukan pelengkap.`
          : !hasIdea
          ? "Pilih salah satu ide cerita di 3.2 (atau tulis sendiri) dulu — naskah butuh arah cerita."
          : !ideaApplied
          ? "Klik 'Terapkan Ide ke Pengaturan (AI)' dulu — naskah dibuat dari hasil penerapan itu, bukan dari teks idenya saja."
          : "Lengkapi Goal, Gaya Video, Tone, dan Gaya Kamera dulu!", "error")} />
    </div>
  );
}


/* ===== 08a_funnel.jsx ===== */
/* ============================================================
   STEP FUNNEL (2) — tahapan funnel & kematangan audiens
   Dipindahkan dari V3: menentukan psikologi penonton, hook,
   dan sudut cerita SEBELUM konsep video disusun.
   ============================================================ */
function StepFunnel({ ctx }) {
  const { seed, brief, patchBrief, meta, setMeta, busy, setBusy, say, go, funnelAi, setFunnelAi,
          ceritaSiap, ceritaTerisi, runDraftStory } = ctx;
  const current = funnelOf(brief.funnelStage || "TOFU");

  /* pilih stage manual: selaraskan goal, hook, CTA, dan gaya video */
  const selectFunnel = (key, sync = true) => {
    const stage = FUNNEL_STAGES.find(f => f.key === key);
    if (!stage) return;
    const patch = { funnelStage: key };
    if (sync) {
      patch.goal = stage.recommendedGoal;
      const g = GOALS.find(x => x.key === stage.recommendedGoal);
      if (g) patch.selectedGoalComponents = g.components.slice();
      if (stage.recommendedHooks.length) patch.hookType = stage.recommendedHooks[0];
      patch.cta = stage.ctaFormula;
      if (!(brief.funnelAngle || "").trim()) patch.funnelAngle = stage.exampleAngle;
      const vt = goalVideoTypes(stage.recommendedGoal);
      if (vt.length && !vt.includes(meta.videoType)) setMeta(m => ({ ...m, videoType: vt[0] }));
    }
    patchBrief(patch);
    say(`Tahapan funnel disetel ke: ${stage.name}`);
  };

  const runAi = async () => {
    if (!(brief.productName || "").trim() && !seed.trim())
      return say("Isi nama produk atau link marketplace di Langkah 1 dulu!", "error");
    setBusy("🎯 AI menganalisis produk & merekomendasikan tahapan funnel...");
    try {
      const r = await aiRecommendFunnel({ brief, seed });
      setFunnelAi(r);
      selectFunnel(r.recommendedFunnel, false);
      const patch = {
        funnelStage: r.recommendedFunnel,
        audienceAwareness: r.recommendedAwareness,
        funnelAngle: r.funnelAngle,
        funnelReasoning: r.reasoning,
        funnelTargetProblem: r.targetProblem || "",
        goal: GOALS.some(g => g.key === r.recommendedGoal) ? r.recommendedGoal : brief.goal,
        hookType: (r.recommendedHookFormula || "").split(":")[0].trim() || brief.hookType,
        cta: r.recommendedCta || brief.cta
      };
      const g = GOALS.find(x => x.key === patch.goal);
      if (g) patch.selectedGoalComponents = g.components.slice();
      patchBrief(patch);
      if (r.recommendedVideoType && VIDEO_TYPES.some(v => v.name === r.recommendedVideoType))
        setMeta(m => ({ ...m, videoType: r.recommendedVideoType }));
      say(`Rekomendasi AI: ${r.recommendedFunnel} — goal, hook, dan CTA ikut disesuaikan! ✅`);
    } catch (e) { console.error(e); say("Gagal menganalisis funnel: " + e.message, "error"); }
    finally { setBusy(""); }
  };

  return (
    <div className="space-y-8 animate-fade-in">
      <BackBar onBack={() => go(1)} badge="Langkah 2" title="Tahapan Funnel Marketing"
        desc="Tentukan posisi iklan ini di funnel (TOFU, MOFU, BOFU, Retensi). Pilihan ini mengarahkan psikologi penonton, formula hook 3 detik, dan sudut cerita naskah." />

      {/* status kesaksian: penentu kualitas rekomendasi funnel */}
      {ceritaSiap ? (
        <div className="bg-rose-50 border-2 border-rose-200 rounded-2xl px-4 py-3 flex flex-col sm:flex-row sm:items-center gap-3">
          <span className="text-[10px] font-black tracking-wider uppercase px-2.5 py-1 rounded-full bg-rose-600 text-white shrink-0">
            🗣️ Kesaksian aktif
          </span>
          <p className="text-[11px] text-rose-900 flex-1 min-w-0 leading-snug">
            AI akan membaca pengalaman <b>{sv(brief.story, "teller") || "si pencerita"}</b> untuk menebak posisi funnel —
            terutama <b>apa yang dulu menahannya membeli</b>. Itu bukti yang jauh lebih kuat daripada menebak dari harga.
          </p>
          <button type="button" onClick={() => go(3)}
            className="text-[10px] font-bold text-rose-700 hover:text-rose-900 underline underline-offset-2 shrink-0 text-left">
            Sunting kesaksian →
          </button>
        </div>
      ) : (
        <div className="bg-slate-50 border-2 border-slate-200 rounded-2xl px-4 py-3 flex flex-col sm:flex-row sm:items-center gap-3">
          <p className="text-[11px] text-slate-600 flex-1 leading-snug">
            💡 <b>Opsional tapi berpengaruh besar:</b> kesaksian pencerita baru terisi {ceritaTerisi}/{STORY_BEATS.length} beat.
            Tanpa itu, AI hanya bisa menebak posisi funnel dari harga & pain point — bukan dari alasan nyata orang batal beli.
          </p>
          <button type="button" onClick={runDraftStory} disabled={Boolean(busy)}
            className="shrink-0 py-2 px-3.5 bg-rose-600 hover:bg-rose-700 disabled:bg-rose-300 text-white font-bold text-[11px] rounded-xl flex items-center gap-1.5">
            <Icon n="Sparkles" className="w-3 h-3" /> Susun Draf Kesaksian
          </button>
        </div>
      )}

      {/* pemicu analisis AI */}
      <div className="bg-gradient-to-r from-indigo-900 via-slate-900 to-indigo-950 text-white p-5 sm:p-7 rounded-3xl shadow-xl border border-indigo-500/30 flex flex-col md:flex-row items-start md:items-center justify-between gap-5 relative overflow-hidden">
        <div className="absolute top-0 right-0 w-64 h-64 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none" />
        <div className="relative z-10 space-y-1.5 max-w-2xl">
          <div className="flex items-center gap-2 flex-wrap">
            <span className="bg-indigo-500/20 text-indigo-300 border border-indigo-400/30 text-[10px] font-black uppercase px-2.5 py-0.5 rounded-full">Fitur Strategis</span>
            <span className="text-[11px] text-amber-300 font-bold flex items-center gap-1">
              <Icon n="Zap" className="w-3 h-3 text-amber-300" /> Tentukan sebelum menyusun konsep
            </span>
          </div>
          <h3 className="text-lg sm:text-xl font-black tracking-tight" style={{ fontFamily: "Space Grotesk,sans-serif" }}>
            Biarkan AI Menentukan Funnel Terbaik untuk Produk Ini?
          </h3>
          <p className="text-xs text-slate-300 leading-relaxed">
            AI membaca harga ({brief.priceOwn || "belum diisi"}), keunggulan, dan pain point produk untuk memilih apakah naskah harus fokus pada <b>Awareness (TOFU)</b>, <b>Edukasi &amp; Bukti (MOFU)</b>, <b>Urgensi Diskon (BOFU)</b>, atau <b>Repeat Order (Retensi)</b>.
          </p>
        </div>
        <button type="button" onClick={runAi} disabled={Boolean(busy)}
          className="relative z-10 shrink-0 w-full md:w-auto py-3.5 px-6 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 disabled:opacity-50 text-white text-xs font-black rounded-2xl shadow-lg shadow-amber-500/20 flex items-center justify-center gap-2.5 transition-all">
          <Icon n="Sparkles" className="w-4 h-4 text-white" />
          <span>Analisis &amp; Rekomendasikan Funnel (AI)</span>
        </button>
      </div>

      {/* hasil analisis AI */}
      {funnelAi && (
        <div className="bg-emerald-50 border-2 border-emerald-300 rounded-3xl p-5 sm:p-6 space-y-4 animate-fade-in shadow-sm">
          <div className="flex items-start justify-between gap-3 flex-wrap">
            <div className="flex items-center gap-2.5">
              <div className="w-9 h-9 rounded-xl bg-emerald-500 text-white flex items-center justify-center shrink-0">
                <Icon n="Check" className="w-5 h-5" />
              </div>
              <div>
                <h4 className="text-sm font-black text-emerald-950 uppercase tracking-wide" style={{ fontFamily: "Space Grotesk,sans-serif" }}>Hasil Analisis Strategis Funnel</h4>
                <p className="text-[11px] text-emerald-800">
                  Rekomendasi: <strong className="text-emerald-900 bg-emerald-200/60 px-2 py-0.5 rounded-md">{funnelAi.recommendedFunnel}</strong> — {funnelAi.recommendedAwareness}
                </p>
              </div>
            </div>
            <span className="text-[10px] font-bold text-emerald-700 bg-emerald-100 px-3 py-1 rounded-full border border-emerald-200">Otomatis diterapkan</span>
          </div>

          <div className="bg-white/90 rounded-2xl p-4 border border-emerald-200/80 space-y-2.5 text-xs">
            <p className="text-slate-800 leading-relaxed"><strong className="text-slate-900">Alasan Marketing:</strong> {funnelAi.reasoning}</p>
            {Boolean(funnelAi.dasarKesaksian) && funnelAi.dasarKesaksian.trim() !== "-" && (
              <p className="text-[11px] text-rose-900 bg-rose-50 border border-rose-200 rounded-xl px-3 py-2 leading-relaxed">
                <b>🗣️ Dasar dari kesaksian:</b> {funnelAi.dasarKesaksian}
              </p>
            )}
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-2 border-t border-emerald-100 text-[11px]">
              <div>
                <span className="text-slate-500 font-bold block">🎯 Sudut Pesan (Angle):</span>
                <span className="text-emerald-950 font-semibold">{funnelAi.funnelAngle}</span>
              </div>
              <div>
                <span className="text-slate-500 font-bold block">⚡ Rekomendasi Hook 3 Detik:</span>
                <span className="text-emerald-950 font-semibold">"{funnelAi.recommendedHookFormula}"</span>
              </div>
            </div>
          </div>

          {Boolean(funnelAi.keyPointers?.length) && (
            <div className="space-y-1">
              <span className="text-[10px] font-bold text-emerald-800 uppercase tracking-wider block">Arahan penting untuk naskah:</span>
              <ul className="grid grid-cols-1 md:grid-cols-3 gap-2">
                {funnelAi.keyPointers.map((pt, i) => (
                  <li key={i} className="bg-white/80 border border-emerald-200 rounded-xl p-2.5 text-[11px] text-slate-700 font-medium flex items-start gap-1.5">
                    <span className="text-emerald-600 font-bold shrink-0">{i + 1}.</span>
                    <span className="leading-snug">{pt}</span>
                  </li>
                ))}
              </ul>
            </div>
          )}
        </div>
      )}

      {/* 2.1 pilih tahapan */}
      <Card color="bg-amber-500" icon="Layers" title="2.1 Pilih Tahapan Funnel" sub="Satu stage per video — jangan campur">
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          {FUNNEL_STAGES.map(stage => {
            const on = (brief.funnelStage || "TOFU") === stage.key;
            return (
              <div key={stage.key} onClick={() => selectFunnel(stage.key, true)}
                className={"p-5 rounded-3xl border-2 transition-all flex flex-col justify-between gap-4 cursor-pointer " + (on ? stage.borderActive + " shadow-md" : "border-slate-200 bg-white hover:border-slate-300 hover:shadow-sm")}>
                <div>
                  <div className="flex items-center justify-between gap-2 mb-2">
                    <span className={"text-[10px] font-black tracking-wider uppercase px-2.5 py-1 rounded-full " + (on ? stage.textBadge : "bg-slate-100 text-slate-600")}>{stage.badge}</span>
                    <div className={"w-5 h-5 rounded-full border-2 flex items-center justify-center shrink-0 " + (on ? stage.bgActive + " border-transparent text-white" : "border-slate-300 bg-white")}>
                      {on && <Icon n="Check" className="w-3 h-3 text-white" />}
                    </div>
                  </div>
                  <h4 className="text-sm font-black text-slate-900" style={{ fontFamily: "Space Grotesk,sans-serif" }}>{stage.name}</h4>
                  <p className="text-[11px] text-slate-500 font-medium mt-1 leading-snug">{stage.subtitle}</p>
                  <p className="text-xs text-slate-700 mt-3 leading-relaxed">{stage.description}</p>
                </div>
                <div className="space-y-2 pt-3 border-t border-slate-100 text-[11px]">
                  <div className="bg-slate-50/80 p-2.5 rounded-xl border border-slate-100">
                    <span className="text-[9px] font-bold text-slate-500 uppercase tracking-wider block mb-0.5">🧠 Kondisi pikiran audiens:</span>
                    <p className="text-slate-800 font-medium leading-tight">{stage.audienceMindset}</p>
                  </div>
                  <div className="bg-slate-50/80 p-2.5 rounded-xl border border-slate-100">
                    <span className="text-[9px] font-bold text-slate-500 uppercase tracking-wider block mb-0.5">🎬 Fokus naskah:</span>
                    <p className="text-slate-800 font-medium leading-tight">{stage.scriptObjective}</p>
                  </div>
                  <div>
                    <span className="text-[9px] font-bold text-slate-400 uppercase tracking-wider block mb-1">💡 Hook yang cocok:</span>
                    <div className="flex flex-wrap gap-1">
                      {stage.recommendedHooks.map(hk => (
                        <span key={hk} className="text-[9px] font-semibold bg-white border border-slate-200 text-slate-700 px-2 py-0.5 rounded-md">{hk}</span>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </Card>

      {/* 2.2 kematangan audiens */}
      <Card color="bg-indigo-600" icon="Compass" title="2.2 Kematangan Audiens" sub="5 tahap Eugene Schwartz — menentukan seberapa dalam naskah menjelaskan">
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
          {AWARENESS_LEVELS.map(item => {
            const on = (brief.audienceAwareness || "Problem-Aware") === item.level;
            return (
              <button key={item.level} type="button" onClick={() => patchBrief({ audienceAwareness: item.level })}
                className={"p-3.5 rounded-2xl border-2 text-left flex flex-col justify-between gap-2.5 transition-all " + (on ? "border-indigo-600 bg-indigo-50/70 ring-1 ring-indigo-500 shadow-sm" : "border-slate-200 bg-white hover:border-indigo-300")}>
                <div>
                  <div className="flex items-center justify-between mb-1.5 gap-1">
                    <span className={"text-[9px] font-black uppercase px-2 py-0.5 rounded-md " + (on ? "bg-indigo-600 text-white" : "bg-slate-100 text-slate-600")}>{item.level}</span>
                    {on && <Icon n="Check" className="w-3.5 h-3.5 text-indigo-600 shrink-0" />}
                  </div>
                  <h5 className="text-[11px] font-bold text-slate-900 leading-tight">{item.headline}</h5>
                  <p className="text-[10px] text-slate-500 mt-1 leading-snug">{item.description}</p>
                </div>
                <div className="pt-2 border-t border-slate-100 text-[9px] text-indigo-900/80 italic font-medium leading-tight">
                  Pendekatan: {item.scriptApproach}
                </div>
              </button>
            );
          })}
        </div>
      </Card>

      {/* 2.3 angle & CTA */}
      <Card color="bg-purple-600" icon="Sparkles" title="2.3 Sudut Pesan & CTA" sub="Diteruskan ke generator ide cerita dan penulisan naskah">
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
          <div className="space-y-2">
            <Label req>Sudut Pandang Utama (Angle Funnel)</Label>
            <textarea rows={3} value={brief.funnelAngle || ""} onChange={e => patchBrief({ funnelAngle: e.target.value })}
              placeholder={"Contoh: " + current.exampleAngle}
              className="w-full bg-slate-50 border-2 border-slate-200/80 rounded-2xl p-3.5 text-xs font-bold text-slate-800 focus:outline-none focus:border-indigo-500 resize-none leading-relaxed" />
            <button type="button" onClick={() => patchBrief({ funnelAngle: current.exampleAngle })}
              className="text-[10px] text-indigo-600 font-bold hover:underline text-left">
              Pakai contoh angle {current.key}: "{current.exampleAngle}"
            </button>
          </div>
          <div className="space-y-2">
            <Label req>Call-To-Action Sesuai Funnel</Label>
            <textarea rows={3} value={brief.cta || ""} onChange={e => patchBrief({ cta: e.target.value })}
              placeholder={"Contoh: " + current.ctaFormula}
              className="w-full bg-slate-50 border-2 border-slate-200/80 rounded-2xl p-3.5 text-xs font-bold text-slate-800 focus:outline-none focus:border-indigo-500 resize-none leading-relaxed" />
            <button type="button" onClick={() => patchBrief({ cta: current.ctaFormula })}
              className="text-[10px] text-indigo-600 font-bold hover:underline text-left">
              Pakai preset CTA {current.key}: "{current.ctaFormula}"
            </button>
          </div>
        </div>
      </Card>

      <NextBar ok={Boolean(brief.funnelStage && (brief.funnelAngle || "").trim() && (brief.cta || "").trim())}
        onNext={() => go(3)} label="LANJUT KE KONSEP VIDEO (STEP 3)"
        warn={() => say("Pilih tahapan funnel dan lengkapi sudut pesan + CTA dulu!", "error")} />
    </div>
  );
}


/* ===== 09_step34.jsx ===== */
/* ============================================================
   STEP 4 — Naskah
   ============================================================ */
function Step3({ ctx }) {
  const { brief, meta, scenes, setScenes, runScript, busy, say, okStep3, go,
          runAuditStory, storyAudit, setStoryAudit, ceritaSiap, ceritaTerisi } = ctx;
  const upd = (si, patch) => setScenes(p => p.map((s, i) => i === si ? { ...s, ...patch } : s));
  const updShot = (si, shi, patch) => setScenes(p => p.map((s, i) => i !== si ? s : { ...s, shots: s.shots.map((x, j) => j !== shi ? x : { ...x, ...patch }) }));

  return (
    <div className="space-y-8 animate-fade-in">
      <BackBar onBack={() => go(3)} badge="Langkah 4" title="Storyboard (Naskah)"
        desc="AI menulis naskah lengkap. Talent, lokasi, dan properti belum perlu ditentukan — dikunci di langkah berikutnya." />

      {/* naskah menuruti stage funnel: kedalaman penjelasan & tekanan CTA ikut berubah */}
      <FunnelStrip brief={brief} onEdit={() => go(2)}
        note={<span><b className="text-slate-700">Naskah disesuaikan otomatis</b> dengan tahapan funnel & kematangan audiens di atas.</span>} />

      <button onClick={runScript} disabled={Boolean(busy) || !brief.productName}
        className="w-full py-4 px-6 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 disabled:text-slate-500 text-white text-sm font-black rounded-2xl shadow-xl shadow-indigo-600/20 flex items-center justify-center gap-2 transition-all">
        {!brief.productName && <Icon n="Lock" className="w-4 h-4 opacity-70" />}
        <Icon n="Sparkles" className="w-5 h-5 text-amber-300" /> Generate Naskah (Sesuai Funnel {brief.funnelStage || "TOFU"})
      </button>

      {/* pengingat: naskah di bawah adalah penuturan kesaksian, bukan daftar keunggulan */}
      {ceritaSiap ? (
        <div className="bg-rose-50 border-2 border-rose-200 rounded-2xl px-4 py-3 flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4">
          <span className="text-[10px] font-black tracking-wider uppercase px-2.5 py-1 rounded-full bg-rose-600 text-white shrink-0">
            🗣️ Kesaksian aktif
          </span>
          <p className="text-[11px] text-rose-900 flex-1 min-w-0 leading-snug">
            <b>{sv(brief.story, "teller") || "Si pencerita"}</b> — naskah menuturkan pengalamannya:
            masalah, puncak kesal, titik balik, bukti, lalu rekomendasi.
          </p>
          <button type="button" onClick={() => go(3)}
            className="text-[10px] font-bold text-rose-700 hover:text-rose-900 underline underline-offset-2 shrink-0 text-left">
            ← Sunting kesaksian
          </button>
        </div>
      ) : (
        <div className="bg-amber-50 border-2 border-amber-300 rounded-2xl px-4 py-3 flex flex-col sm:flex-row sm:items-center gap-3">
          <p className="text-[11px] text-amber-900 flex-1 leading-snug">
            ⚠️ Kesaksian pencerita baru terisi <b>{ceritaTerisi}/{STORY_BEATS.length} beat</b>. Naskah tetap bisa
            dibuat, tapi tanpa pengalaman nyata hasilnya cenderung jadi iklan yang dibacakan.
          </p>
          <button type="button" onClick={() => go(3)}
            className="shrink-0 py-2 px-3.5 bg-amber-600 hover:bg-amber-700 text-white font-bold text-[11px] rounded-xl">
            Lengkapi Kesaksian
          </button>
        </div>
      )}

      {/* audit kejujuran: masih kesaksian orang, atau sudah jadi iklan? */}
      {Boolean(scenes.length) && (
        <div className="bg-white border-2 border-slate-200 rounded-2xl p-4 space-y-3">
          <div className="flex flex-col sm:flex-row sm:items-center gap-3">
            <div className="flex-1">
              <h4 className="text-[11px] font-black uppercase tracking-wider text-slate-800 flex items-center gap-1.5">
                <Icon n="Lock" className="w-3.5 h-3.5 text-rose-500" /> Audit Nyawa Cerita
              </h4>
              <p className="text-[10px] text-slate-500 leading-relaxed mt-1">
                Editor AI membaca naskah di bawah dan menilai empat hal: masih terasa pengalaman satu orang,
                cukup jujur mengakui sisi tidak enaknya, hook 3 detiknya menahan scroll, dan ajakannya terasa
                saran tulus — bukan perintah jualan.
              </p>
            </div>
            <button type="button" onClick={runAuditStory} disabled={Boolean(busy)}
              className="shrink-0 py-2.5 px-4 bg-slate-900 hover:bg-slate-800 disabled:bg-slate-300 text-white font-bold text-[11px] rounded-xl flex items-center justify-center gap-1.5">
              <Icon n="Check" className="w-3.5 h-3.5" /> Audit Naskah Ini
            </button>
          </div>

          {storyAudit && (() => {
            const skor = [
              ["Cerita Pribadi", storyAudit.skorCerita],
              ["Kejujuran", storyAudit.skorKejujuran],
              ["Hook 3 Detik", storyAudit.skorHook],
              ["Rekomendasi", storyAudit.skorRekomendasi]
            ];
            const warna = v => v >= 75 ? "text-emerald-700 bg-emerald-50 border-emerald-200"
              : v >= 55 ? "text-amber-700 bg-amber-50 border-amber-200"
              : "text-rose-700 bg-rose-50 border-rose-200";
            return (
              <div className="space-y-3 animate-fade-in border-t border-slate-200 pt-3">
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                  {skor.map(([k, v]) => (
                    <div key={k} className={"rounded-xl border p-2.5 text-center " + warna(v || 0)}>
                      <p className="text-lg font-black leading-none">{v || 0}</p>
                      <p className="text-[9px] font-bold uppercase tracking-wider mt-1">{k}</p>
                    </div>
                  ))}
                </div>

                <p className="text-[11px] text-slate-800 leading-relaxed bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5">
                  <b className="text-slate-900">Vonis editor:</b> {storyAudit.vonis}
                </p>

                {Boolean((storyAudit.kalimatIklan || []).length) && (
                  <div className="space-y-1.5">
                    <span className="text-[10px] font-black uppercase tracking-wider text-rose-700">Kalimat yang berbau iklan</span>
                    <ul className="space-y-1">
                      {storyAudit.kalimatIklan.map((x, i) => (
                        <li key={i} className="text-[11px] text-rose-900 bg-rose-50 border border-rose-200 rounded-lg px-3 py-1.5 italic">"{x}"</li>
                      ))}
                    </ul>
                  </div>
                )}

                {Boolean((storyAudit.beatHilang || []).length) && (
                  <div className="space-y-1.5">
                    <span className="text-[10px] font-black uppercase tracking-wider text-amber-700">Beat cerita yang belum terasa</span>
                    <div className="flex flex-wrap gap-1.5">
                      {storyAudit.beatHilang.map((x, i) => (
                        <span key={i} className="text-[10px] font-bold bg-amber-100 text-amber-800 border border-amber-300 px-2 py-1 rounded-md">{x}</span>
                      ))}
                    </div>
                  </div>
                )}

                {Boolean((storyAudit.perbaikan || []).length) && (
                  <div className="space-y-1.5">
                    <span className="text-[10px] font-black uppercase tracking-wider text-slate-700">Perbaikan yang disarankan</span>
                    <ul className="space-y-1.5">
                      {storyAudit.perbaikan.map((x, i) => (
                        <li key={i} className="text-[11px] text-slate-700 bg-white border border-slate-200 rounded-lg px-3 py-2 flex items-start gap-2">
                          <span className="font-black text-indigo-600 shrink-0">{i + 1}.</span>
                          <span className="leading-snug">{x}</span>
                        </li>
                      ))}
                    </ul>
                  </div>
                )}

                <div className="flex justify-end">
                  <button type="button" onClick={() => setStoryAudit(null)}
                    className="px-3 py-1.5 text-[10px] font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg">Tutup hasil audit</button>
                </div>
              </div>
            );
          })()}
        </div>
      )}

      {!scenes.length && (
        <div className="bg-white rounded-3xl border border-dashed border-slate-300 p-16 text-center">
          <Icon n="Clapperboard" className="w-12 h-12 text-slate-300 mx-auto mb-4" />
          <h3 className="text-sm font-bold text-slate-700">Belum ada naskah</h3>
          <p className="text-xs text-slate-400 mt-1">Klik tombol di atas untuk menyusun draft naskah dari AI.</p>
        </div>
      )}

      {scenes.map((sc, si) => (
        <div key={si} className="bg-white rounded-3xl border shadow-sm p-4 md:p-6 space-y-5">
          <div className="flex items-center gap-3">
            <span className="bg-indigo-600 text-white text-[10px] font-black tracking-widest py-1 px-3 rounded-full uppercase">Scene {sc.sceneNumber}</span>
            <input type="text" value={sc.title} onChange={e => upd(si, { title: e.target.value })}
              className="flex-1 bg-transparent text-base font-black text-slate-800 focus:outline-none border-b border-transparent focus:border-indigo-300" />
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="md:col-span-2">
              <Label>Naskah / Voice Over</Label>
              <textarea rows={2} value={sc.voiceover} onChange={e => upd(si, { voiceover: e.target.value })}
                className="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs text-slate-800 italic focus:outline-none focus:border-indigo-400 focus:bg-white resize-none" />
            </div>
            <div>
              <Label>Audio / SFX</Label>
              <textarea rows={2} value={sc.sfx || ""} onChange={e => upd(si, { sfx: e.target.value })} placeholder="Ambience, sound effect..."
                className="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl p-3 text-[11px] text-slate-600 focus:outline-none focus:border-indigo-400 focus:bg-white resize-none" />
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {sc.shots.map((sh, shi) => (
              <div key={shi} className="bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-2">
                <span className="text-[10px] font-black text-rose-500 block">Shot {sh.shotNumber}</span>

                {brief.productVariants?.length > 1 && (
                  <div className="space-y-1">
                    <Label>Varian Produk Tampil</Label>
                    <select value={sh.variantIndex == null ? "" : sh.variantIndex}
                      onChange={e => updShot(si, shi, { variantIndex: e.target.value === "" ? null : parseInt(e.target.value, 10) })}
                      className="w-full bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-[11px] font-semibold text-slate-700 focus:outline-none focus:border-indigo-400">
                      <option value="">— Tidak spesifik —</option>
                      {brief.productVariants.map((v, k) => <option key={k} value={k}>{v.name || "Varian " + (k + 1)}</option>)}
                    </select>
                  </div>
                )}

                {[
                  ["Judul Shot", "title", "Judul singkat shot ini", "text-slate-800"],
                  ["📍 Lokasi Latar", "location", "Misal: Kamar Tidur", "text-cyan-700"],
                  ["👤 Talent Shot", "talent", "Misal: Talent 1 memegang produk", "text-indigo-700"],
                  ["🎁 Props Shot", "props", "Misal: Cermin, handuk", "text-rose-700"],
                  ["🎥 Gerak Kamera", "cameraMove", "Misal: slow push-in, handheld pan", "text-violet-700"]
                ].map(([lab, key, ph, col]) => (
                  <div key={key} className="space-y-1">
                    <Label>{lab}</Label>
                    <input type="text" value={sh[key] || ""} onChange={e => updShot(si, shi, { [key]: e.target.value })} placeholder={ph}
                      className={`w-full bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-[11px] font-medium ${col} focus:outline-none focus:border-indigo-400`} />
                  </div>
                ))}

                <div className="space-y-1">
                  <Label>Deskripsi Visual</Label>
                  <textarea rows={3} value={sh.visualDescription} onChange={e => updShot(si, shi, { visualDescription: e.target.value })}
                    className="w-full bg-white border border-slate-200 rounded-lg p-2.5 text-[11px] text-slate-700 resize-none leading-relaxed focus:outline-none focus:border-indigo-400" />
                </div>
                <div className="space-y-1">
                  <Label>Catatan Sutradara</Label>
                  <textarea rows={2} value={sh.directorNotes} onChange={e => updShot(si, shi, { directorNotes: e.target.value })}
                    className="w-full bg-white border border-slate-200 rounded-lg p-2.5 text-[11px] text-slate-500 resize-none leading-relaxed focus:outline-none focus:border-indigo-400" />
                </div>
              </div>
            ))}
          </div>

          <div>
            <Label>Transisi Akhir Scene</Label>
            <input type="text" value={sc.transitionNote} onChange={e => upd(si, { transitionNote: e.target.value })}
              className="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-700 focus:outline-none focus:border-indigo-400" />
          </div>
        </div>
      ))}

      {scenes.length > 0 && (
        <NextBar ok={okStep3} onNext={() => go(5)} label="Lanjut ke Referensi Visual"
          warn={() => say("Lengkapi voiceover, judul shot, dan deskripsi visual di semua scene!", "error")} />
      )}
    </div>
  );
}

/* ============================================================
   STEP 4 — Referensi Visual
   ============================================================ */
function Step4({ ctx }) {
  const { brief, patchBrief, talents, setTalents, talent1, setTalent1, talent2, setTalent2,
          locRefs, setLocRefs, propRefs, setPropRefs, faceless, flags, busy, say, okStep4, step4Missing, mapThenGo, mapped, go,
          runMapRefs, genTalentPhoto, genLocPhoto, genPropPhoto, talentTab, setTalentTab, scenes } = ctx;

  const setT = (i, patch) => setTalents(p => p.map((t, k) => k === i ? { ...t, ...patch } : t));

  const setSlot = (key, i, patch) => {
    setPropRefs(p => { const a = slotsOf(key); a[i] = { ...a[i], ...patch }; return { ...p, [key]: a }; });
    /* scenarioProps[key] dipakai prompt naskah & render, tapi form induknya sudah dihapus.
       Jadi turunkan otomatis dari gabungan deskripsi tiap preview. */
    if ("text" in patch) {
      const a = slotsOf(key); a[i] = { ...a[i], ...patch };
      const gabung = a.map(x => (x.text || "").trim()).filter(Boolean).join(", ");
      patchBrief({ scenarioProps: { ...(brief.scenarioProps || {}), [key]: gabung } });
    }
  };

  const genAllLocs = async () => {
    const idx = [0, 1, 2].filter(i => i === 0 ? (brief.location || "").trim() : (locRefs[i]?.text || "").trim());

  const genAllTalents = async () => {
    const idx = brief.talentCount === "2 Talent (Interaksi)" ? [0, 1] : [0];
    for (const i of idx) { try { await genTalentPhoto(i); } catch (e) { console.error(e); } }

  /* generate foto untuk semua preview yang sudah ada deskripsinya */
  const genAllProps = async key => {
    const idx = slotsOf(key).map((x, i) => ((x.text || "").trim() ? i : -1)).filter(i => i >= 0);
    if (!idx.length) return say("Isi dulu deskripsi props-nya, minimal satu preview.", "error");

  };

  return (
    <div className="space-y-8 animate-fade-in">
      <BackBar onBack={() => go(4)} badge="Langkah 5" title="Referensi Visual & Properti"
        desc="Siapkan foto talent, lokasi, dan props. Setelah aset terisi, jalankan pemetaan otomatis ke tiap shot." />

      <div className="bg-indigo-50/60 border border-indigo-200 rounded-2xl p-4 space-y-3">
        <div className="flex flex-col sm:flex-row sm:items-center gap-3">
          <div className="flex-1">
            <h4 className="text-[11px] font-black uppercase tracking-wider text-indigo-700 flex items-center gap-1.5">
              <Icon n="Sparkles" className="w-3.5 h-3.5" /> Petakan Referensi ke Tiap Shot
            </h4>
            <p className="text-[10px] text-slate-600 leading-relaxed mt-1">
              AI membaca naskah tiap shot, lalu <b>mencentang otomatis</b> referensi mana yang dipakai:
              <span className="text-indigo-700 font-semibold"> Talent 1/2 · Slot Produk 1-4 · Slot Lokasi 1-3 · Tipe Props · Panel Gabungan</span>,
              plus menandai shot yang murni <b>motion graphic</b>. Hasilnya jadi centang di Langkah 6 — bisa Anda ubah manual.
              <br />
              <span className="text-slate-400">Hanya aset yang sudah ada fotonya yang bisa dipilih.

            </p>

          <button onClick={() => runMapRefs()} disabled={Boolean(busy) || !scenes.length}

            <Icon n={mapped ? "RefreshCw" : "Sparkles"} className="w-3.5 h-3.5" /> {mapped ? "Petakan Ulang" : "Petakan Sekarang"}

        </div>
        {!scenes.length && (
          <p className="text-[10px] text-rose-600 font-semibold bg-rose-50 border border-rose-200 rounded-lg px-2.5 py-2">

          </p>

      </div>

      {/* 5.1 talent / motion graphic */}
      <Card color="bg-emerald-600" icon={faceless ? "Sparkles" : "User"}

        {faceless ? (

              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {TALENT_FIELDS.map(f => (
                  <div key={f.key} className="space-y-1.5">
                    <Label>{f.label}</Label>
                    <SmartSelect label={f.label} value={talents[talentTab]?.[f.key] || f.opts[0]}
                      onChange={v => setT(talentTab, { [f.key]: v })} options={f.opts}
                      placeholder={f.key === "outfit" ? "Wajib sebut warna & model pakaian. Contoh: sweater rajut sage green & kulot linen krem..." : undefined} />
                  </div>

              </div>

          </div>
        )}
      </Card>

      {/* 5.2 lokasi */}
      <Card color="bg-cyan-500" icon="Compass" title="5.2 Estetika Visual & Lokasi" sub="Nuansa latar belakang adegan">
        <div className="space-y-4">
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div className="space-y-1.5">
              <Label>Lokasi Utama</Label>
              <SmartSelect label="Lokasi" value={brief.location} onChange={v => patchBrief({ location: v })}
                options={faceless ? LOCATIONS_MG : LOCATIONS_TALENT} />
            </div>
            <Field label="Gaya Visual" value={brief.visualStyle} onChange={v => patchBrief({ visualStyle: v })}
              placeholder="Contoh: Warm & cozy, moody cinematic, bright airy" rows={1} />
          </div>

          <div>
            <div className="flex items-center justify-between gap-2">
              <div>
                <Label>Foto Referensi Lokasi (Maks 3)</Label>
                <p className="text-[10px] text-slate-400 mt-0.5 mb-2">Slot 1 mengikuti Lokasi Utama. Aktifkan per shot di Langkah 6.</p>
              </div>
              <button type="button" onClick={genAllLocs}
                disabled={Boolean(busy) || !(brief.location || "").trim() && !locRefs.some(l => (l?.text || "").trim())}
                title="Generate foto untuk semua lokasi yang sudah ada deskripsinya"
                className="shrink-0 py-2 px-3 bg-cyan-600 hover:bg-cyan-700 disabled:bg-slate-300 text-white font-bold text-[10px] rounded-lg flex items-center gap-1.5 transition-all">
                <Icon n="Zap" className="w-3 h-3 text-yellow-300" /> Generate Semua
              </button>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
              {[0, 1, 2].map(i => (
                <div key={i} className="p-3 border border-slate-200 rounded-xl space-y-2 bg-white shadow-sm">
                  <span className="text-[11px] font-black text-slate-700">{i === 0 ? "Lokasi Utama" : "Lokasi " + (i + 1)}</span>
                  <input type="text" value={i === 0 ? (brief.location || "") : (locRefs[i]?.text || "")}
                    onChange={e => i === 0 ? patchBrief({ location: e.target.value }) : setLocRefs(p => p.map((r, k) => k === i ? { ...r, text: e.target.value } : r))}
                    placeholder={i === 0 ? "Deskripsi lokasi utama..." : "Deskripsi lokasi..."}
                    className="w-full text-[10px] p-2 rounded bg-slate-50 border border-slate-200 focus:outline-none focus:border-cyan-400" />
                  <ImageSlot src={locRefs[i]?.img} accent="cyan" label={"Lokasi_" + (i + 1)} busy={flags["loc" + i]}
                    onPick={img => setLocRefs(p => p.map((r, k) => k === i ? { ...r, img } : r))}
                    onClear={() => setLocRefs(p => p.map((r, k) => k === i ? { ...r, img: "" } : r))}
                    onGenerate={() => genLocPhoto(i)} />
                </div>
              ))}
            </div>
          </div>
        </div>
      </Card>

      {/* 5.3 props skenario */}
      <Card color="bg-violet-600" icon="Layers" title="5.3 Properti Skenario" sub="Props pembanding, narasi, atau dekorasi">
        <div className="space-y-3">
          <p className="text-[11px] text-slate-500">Aktifkan tipe properti sesuai kebutuhan cerita. Tiap tipe menghasilkan instruksi berbeda ke AI.</p>
          {SCENARIO_PROPS.map(p => {
            const on = Boolean(brief.scenarioProps && p.key in brief.scenarioProps);
            const tone = {
              rose:    { btn: on ? "border-rose-500 bg-rose-50 ring-2 ring-rose-400/20" : "border-slate-200 bg-white hover:border-rose-300", lab: on ? "text-rose-700" : "text-slate-600", dot: "bg-rose-500 border-rose-500" },
              amber:   { btn: on ? "border-amber-500 bg-amber-50 ring-2 ring-amber-400/20" : "border-slate-200 bg-white hover:border-amber-300", lab: on ? "text-amber-700" : "text-slate-600", dot: "bg-amber-500 border-amber-500" },
              emerald: { btn: on ? "border-emerald-500 bg-emerald-50 ring-2 ring-emerald-400/20" : "border-slate-200 bg-white hover:border-emerald-300", lab: on ? "text-emerald-700" : "text-slate-600", dot: "bg-emerald-500 border-emerald-500" }
            }[p.color];
            return (
              <div key={p.key} className="space-y-2">
                <button type="button" onClick={() => {
                    const next = { ...(brief.scenarioProps || {}) };
                    if (on) delete next[p.key]; else next[p.key] = "";
                    patchBrief({ scenarioProps: next });
                  }}
                  className={`w-full text-left p-3 rounded-xl border-2 transition-all flex items-center gap-3 ${tone.btn}`}>
                  <span className="text-base leading-none">{p.emoji}</span>
                  <div className="flex-1">
                    <span className={`text-[11px] font-black block ${tone.lab}`}>{p.label}</span>
                    <span className="text-[9px] text-slate-400">{p.instruction}</span>
                  </div>
                  <div className={"w-4 h-4 rounded-full border-2 flex items-center justify-center shrink-0 " + (on ? tone.dot : "border-slate-300 bg-white")}>
                    {on && <Icon n="Check" className="w-2.5 h-2.5 text-white" />}
                  </div>
                </button>

                {on && (
                  <div className="animate-fade-in space-y-2">
                    <div className="flex items-center justify-between gap-2">
                      <p className="text-[10px] text-slate-500 leading-relaxed">
                        Isi deskripsi tiap props di bawah, lalu generate fotonya. Deskripsi inilah yang dipakai saat render.
                      </p>
                      <button type="button" onClick={() => genAllProps(p.key)}
                        disabled={Boolean(busy) || !slotsOf(p.key).some(x => (x.text || "").trim())}
                        title="Generate foto untuk semua preview yang sudah ada deskripsinya"
                        className="shrink-0 py-2 px-3 bg-violet-600 hover:bg-violet-700 disabled:bg-slate-300 text-white font-bold text-[10px] rounded-lg flex items-center gap-1.5 transition-all">
                        <Icon n="Zap" className="w-3 h-3 text-yellow-300" /> Generate Semua
                      </button>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      {slotsOf(p.key).map((s, i) => (
                        <div key={i} className="p-2 border border-slate-200 rounded-lg space-y-2 bg-white">
                          <span className="text-[9px] font-black text-slate-500 uppercase tracking-wide">Preview {i + 1}</span>
                          <input type="text" value={s.text || ""} onChange={e => setSlot(p.key, i, { text: e.target.value })}
                            placeholder={p.placeholder}
                            className="w-full text-[10px] p-2 rounded bg-slate-50 border border-slate-200 focus:outline-none focus:border-violet-400" />
                          <ImageSlot src={s.img} accent="violet" label={p.key + "_" + (i + 1)} busy={flags[p.key + i]}
                            onPick={img => setSlot(p.key, i, { img })} onClear={() => setSlot(p.key, i, { img: "" })}
                            onGenerate={() => genPropPhoto(p.key, i)} />
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </Card>

      {step4Missing.length > 0 && (
        <div className="bg-amber-50 border border-amber-300 rounded-2xl p-4 space-y-2">
          <p className="text-[11px] font-black text-amber-800 uppercase tracking-wide flex items-center gap-1.5">
            <Icon n="AlertTriangle" className="w-3.5 h-3.5" /> Belum siap untuk render
          </p>
          <ul className="space-y-1">
            {step4Missing.map(m => (
              <li key={m} className="text-[11px] font-semibold text-amber-900 bg-white/70 border border-amber-200 rounded-lg px-3 py-1.5">{m}</li>
