const MODEL_TEXT  = "gemini-3-flash-preview";
const MODEL_I2I   = "gemini-3.1-flash-image-preview";
const MODEL_T2I   = "imagen-4.0-generate-001";
const API = "https://generativelanguage.googleapis.com/v1beta/models/";
const KEY = ""; // disuntik Gemini Canvas saat runtime

/* ---------- fetch dengan retry backoff ---------- */
const fetchRetry = async (url, opt, max = 4) => {
  const wait = [1000, 2000, 4000, 8000];
  for (let i = 0; i < max; i++) {
    try {
      const r = await fetch(url, opt);
      if (!r.ok && (r.status === 429 || r.status >= 500)) throw new Error("HTTP " + r.status);
      return r;
    } catch (e) {
      if (i === max - 1) throw e;
      await new Promise(res => setTimeout(res, wait[i]));
    }
  }
};

const readJSON = async r => {
  if (!r.ok) {
    const t = await r.text();
    let msg = "HTTP " + r.status;
    try { const j = JSON.parse(t); if (j.error?.message) msg = j.error.message; } catch (e) {}
    throw new Error(msg);
  }
  const j = await r.json();
  if (j.error) throw new Error(j.error.message);
  return j;
};

/* ---------- teks / JSON terstruktur ---------- */
const genText = async ({ contents, systemInstruction, responseMimeType, responseSchema, tools }) => {
  const body = { contents: Array.isArray(contents) ? contents : [{ parts: [{ text: contents }] }] };
  if (systemInstruction)
    body.systemInstruction = typeof systemInstruction === "string"
      ? { parts: [{ text: systemInstruction }] } : systemInstruction;
  if (responseMimeType || responseSchema) {
    body.generationConfig = {};
    if (responseMimeType) body.generationConfig.responseMimeType = responseMimeType;
    if (responseSchema)   body.generationConfig.responseSchema   = responseSchema;
  }
  if (tools) body.tools = tools;
  const r = await fetchRetry(API + MODEL_TEXT + ":generateContent?key=" + KEY, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
  });
  const j = await readJSON(r);
  const txt = j.candidates?.[0]?.content?.parts?.[0]?.text;
  if (!txt) throw new Error("Respons teks kosong dari Gemini.");
  return txt;
};

/* JSON longgar: tahan terhadap ```json fence / teks pengapit */
const parseLoose = txt => {
  try { return JSON.parse(txt); } catch (e) {}
  const fence = txt.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (fence) { try { return JSON.parse(fence[1]); } catch (e) {} }
  const brace = txt.match(/\{[\s\S]*\}/);
  if (brace) return JSON.parse(brace[0]);
  throw new Error("Format JSON tidak valid.");
};

const genJSON = async opt => parseLoose(await genText({ ...opt, responseMimeType: "application/json" }));

/* ---------- ATURAN referensi gambar (dipakai semua i2i) ---------- */
const RULE_REF = `
ATURAN REFERENSI GAMBAR (WAJIB):
- Gambar berlabel "Produk": replikasikan PERSIS bentuk kemasan, tulisan/label, warna, tekstur, dan proporsi sesuai foto. JANGAN mengarang ulang desain kemasan, JANGAN mengubah atau menambah teks pada kemasan.
- Gambar berlabel "VARIAN AKTIF": ini varian yang WAJIB tampil. Jika bertentangan dengan foto produk lain, IKUTI YANG INI untuk warna & kemasan.
- Gambar berlabel "Talent": acuan wajah, rambut, warna kulit, dan wardrobe. Pose dan ekspresi boleh menyesuaikan visual_description.
- Gambar berlabel "Lokasi": acuan latar/environment.
- Gambar berlabel "Props": acuan bentuk properti pendukung.
- Gambar berlabel "Panel Referensi": lembar berisi beberapa panel foto. Perlakukan tiap panel sebagai foto terpisah. DILARANG menyalin tata letak grid, garis pemisah, label huruf, atau format kolase ke hasil. Output WAJIB satu adegan tunggal yang menyatu, BUKAN grid/split-screen.
- Gambar berlabel "Frame Sebelumnya": acuan kesinambungan wardrobe, tata rambut, dan pencahayaan. JANGAN menyalin komposisinya.`;

const REALISM = "PURE UGC AESTHETIC: Real everyday smartphone photography, casual unpolished look, natural imperfections welcomed. Natural room lighting (window light or regular home lamps), NOT studio lighting, NOT ring light. Candid everyday setting with lived-in details (unmade bed, casual clutter, real home environment). Subject looks natural and relaxed, NOT posed for photoshoot. Authentic skin texture with natural imperfections, minimal or no makeup, casual hair styling. Real clothing (comfortable home wear, everyday casual), NOT styled outfit. Genuine spontaneous expression, NOT model posing. Shot feels like genuine personal content, NOT professional production. STRICTLY NOT polished commercial photography, NOT studio setup, NOT professional styling, NOT perfect composition.";
const NEGATIVE = "NEGATIVE / AVOID: deformed bodies, missing or extra limbs, extra fingers, bad anatomy, mutated features, collage, grid, split screen, contact sheet, storyboard borders, comic panels, letter labels, watermark, caption, subtitle, UI overlay, logo, random text. ALSO AVOID: professional studio setup, perfect lighting, ring light, polished commercial photography, styled photoshoot look, perfectly clean background, model posing, overly perfect makeup, professional hair styling, fashion catalog aesthetic, advertising campaign look, too perfect composition.";

/* ---------- gambar ---------- */
/* refs: [{label, data}] — bila ada -> image-to-image; bila kosong -> Imagen text-to-image */
const genImage = async (prompt, aspect = "1:1", refs = [], personGeneration) => {
  const list = (refs || []).filter(r => r && r.data);
  if (list.length) {
    const parts = [{ text: prompt + "\n" + RULE_REF }];
    list.forEach(r => {
      const m = String(r.data).match(/^data:(.+);base64,(.+)$/);
      if (!m) return;
      if (r.label) parts.push({ text: "[" + r.label + "]:" });
      parts.push({ inlineData: { mimeType: m[1], data: m[2] } });
    });
    const r = await fetchRetry(API + MODEL_I2I + ":generateContent?key=" + KEY, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ role: "user", parts }],
        generationConfig: { responseModalities: ["IMAGE"], imageConfig: { aspectRatio: aspect } }
      })
    });
    const j = await readJSON(r);
    const p = j?.candidates?.[0]?.content?.parts?.find(x => x.inlineData)?.inlineData;
    if (!p?.data) throw new Error("Gagal memproses Image-to-Image.");
    return "data:" + (p.mimeType || "image/png") + ";base64," + p.data;
  }
  /* Tanpa referensi: coba Imagen dulu (kualitas text-to-image terbaik),
     tapi key Canvas sering TIDAK berwenang untuk Imagen -> 401/403.
     Kalau begitu, jatuh otomatis ke model image Gemini yang pasti berwenang. */
  try {
    const r = await fetchRetry(API + MODEL_T2I + ":predict?key=" + KEY, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        instances: { prompt },
        parameters: { sampleCount: 1, aspectRatio: aspect, ...(personGeneration ? { personGeneration } : {}) }
      })
    }, 2);
    const j = await readJSON(r);
    const b = j.predictions?.[0]?.bytesBase64Encoded;
    if (b) return "data:image/png;base64," + b;
    throw new Error("Imagen tidak mengembalikan gambar.");
  } catch (e) {
    console.warn("Imagen gagal (" + e.message + "), beralih ke model image Gemini.");
    const r2 = await fetchRetry(API + MODEL_I2I + ":generateContent?key=" + KEY, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ role: "user", parts: [{ text: prompt }] }],
        generationConfig: { responseModalities: ["IMAGE"], imageConfig: { aspectRatio: aspect } }
      })
    });
    const j2 = await readJSON(r2);
    const p2 = j2?.candidates?.[0]?.content?.parts?.find(x => x.inlineData)?.inlineData;
    if (!p2?.data) throw new Error("Gagal generate gambar (Imagen dan Gemini image sama-sama gagal): " + e.message);
    return "data:" + (p2.mimeType || "image/png") + ";base64," + p2.data;
  }
};

/* ---------- kecilkan gambar: jaga localStorage tidak jebol ---------- */
const shrink = (src, max = 1536, q = 0.92) => new Promise(res => {
  if (!src || typeof src !== "string" || !src.startsWith("data:image")) return res(src);
  const im = new Image();
  im.onload = () => {
    const s = Math.min(1, max / Math.max(im.width, im.height));
    if (s === 1 && src.length < 300000) return res(src);
    const cv = document.createElement("canvas");
    cv.width = Math.round(im.width * s); cv.height = Math.round(im.height * s);
    const cx = cv.getContext("2d");
    cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height);
    cx.drawImage(im, 0, 0, cv.width, cv.height);
    try { res(cv.toDataURL("image/jpeg", q)); } catch (e) { res(src); }
  };
  im.onerror = () => res(src);
  im.src = src;
});

const fileToData = file => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = e => res(e.target?.result || "");
  r.onerror = rej;
  r.readAsDataURL(file);
});

/* ---------- localStorage aman ---------- */
const load = (k, def) => {
  try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); }
  catch (e) { return def; }
};
const save = (k, v) => {
  try { localStorage.setItem(k, JSON.stringify(v)); return true; }
  catch (e) { console.warn("Storage penuh:", k, e); return false; }
};
const usePersist = (key, initial) => {
  const [val, set] = useState(() => load(key, initial));
  useEffect(() => { save(key, val); }, [key, val]);
  return [val, set];
};


/* ============================================================
   PENYIMPANAN PROYEK — IndexedDB + fallback localStorage
   (dipakai autosave draf, pustaka proyek, impor/ekspor JSON)
   ============================================================ */
const DB_NAME = "StillcuanSG_DB";
const DB_VERSION = 1;
const STORE_PROJECTS = "projects";
const STORE_SESSIONS = "sessions";
const ACTIVE_KEY = "current_draft";
const LS_DRAFT = "sc3_draft_full";
const LS_LIB = "sc3_projects_list";
const PROJECT_VERSION = "3.0-funnel";

const openDB = () => new Promise((res, rej) => {
  if (typeof indexedDB === "undefined" || !indexedDB) return rej(new Error("IndexedDB tidak tersedia"));
  const rq = indexedDB.open(DB_NAME, DB_VERSION);
  rq.onupgradeneeded = () => {
    const db = rq.result;
    if (!db.objectStoreNames.contains(STORE_PROJECTS)) db.createObjectStore(STORE_PROJECTS, { keyPath: "id" });
    if (!db.objectStoreNames.contains(STORE_SESSIONS)) db.createObjectStore(STORE_SESSIONS, { keyPath: "key" });
  };
  rq.onsuccess = () => res(rq.result);
  rq.onerror = () => rej(rq.error || new Error("Gagal membuka IndexedDB"));
});

const idbRun = (store, mode, fn) => openDB().then(db => new Promise((res, rej) => {
  const tx = db.transaction(store, mode);
  const rq = fn(tx.objectStore(store));
  rq.onsuccess = () => res(rq.result);
  rq.onerror = () => rej(rq.error);
}));

/* buang gambar berat -> dipakai saat fallback localStorage kena kuota */
const stripImages = p => ({
  ...p, prodImgs: ["", "", "", ""], mergedPanel: "", talent1: "", talent2: "",
  locRefs: (p.locRefs || []).map(l => ({ ...l, img: "" })),
  propRefs: Object.fromEntries(Object.entries(p.propRefs || {}).map(([k, v]) => [k, (v || []).map(s => ({ ...s, img: "" }))])),
  scenes: (p.scenes || []).map(s => ({ ...s, shots: (s.shots || []).map(x => ({ ...x, imageUrl: "" })) }))
});

/* proyek dari file/versi lain: samakan bentuknya dengan state app */
const normalizeProject = raw => {
  if (!raw || typeof raw !== "object") return null;
  const p = raw.brief ? raw : raw.project || raw.data;
  if (!p || !p.brief) return null;
  return {
    ...p,
    seed: p.seed || "",
    talents: p.talents && p.talents.length ? p.talents : [BLANK_TALENT, { ...BLANK_TALENT }],
    prodImgs: (p.prodImgs || ["", "", "", ""]).slice(0, 4),
    locRefs: p.locRefs && p.locRefs.length ? p.locRefs : [{ img: "", text: "" }, { img: "", text: "" }, { img: "", text: "" }],
    propRefs: p.propRefs || { comparison: [], narrative: [], decoration: [] },
    /* V3 memakai renderedImage, V2 memakai imageUrl */
    scenes: (p.scenes || []).map(s => ({ ...s, shots: (s.shots || []).map(x => ({ ...x, imageUrl: x.imageUrl || x.renderedImage || "" })) }))
  };
};

const projectName = p => (p.name || p.brief?.productName || "Proyek Tanpa Judul").toString().trim();

const saveActiveDraft = async data => {
  const full = { ...data, id: ACTIVE_KEY, name: projectName(data), version: PROJECT_VERSION, updatedAt: Date.now() };
  try {
    await idbRun(STORE_SESSIONS, "readwrite", st => st.put({ key: ACTIVE_KEY, data: full }));
    return true;
  } catch (e) {
    if (!save(LS_DRAFT, full)) return save(LS_DRAFT, stripImages(full));
    return true;
  }
};

const loadActiveDraft = async () => {
  try {
    const r = await idbRun(STORE_SESSIONS, "readonly", st => st.get(ACTIVE_KEY));
    if (r?.data) return normalizeProject(r.data);
  } catch (e) { console.warn("IndexedDB draf gagal, coba localStorage:", e.message); }
  return normalizeProject(load(LS_DRAFT, null));
};

const clearActiveDraft = async () => {
  try { await idbRun(STORE_SESSIONS, "readwrite", st => st.delete(ACTIVE_KEY)); } catch (e) {}
  try { localStorage.removeItem(LS_DRAFT); } catch (e) {}
};

const saveProjectToLibrary = async data => {
  const id = data.id && data.id !== ACTIVE_KEY ? data.id : "proj_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7);
  const full = { ...data, id, name: projectName(data), version: PROJECT_VERSION, updatedAt: Date.now() };
  try {
    await idbRun(STORE_PROJECTS, "readwrite", st => st.put(full));
  } catch (e) {
    const list = load(LS_LIB, []).filter(p => p.id !== id);
    list.unshift(stripImages(full));
    if (!save(LS_LIB, list)) throw new Error("Penyimpanan peramban penuh. Hapus proyek lama dulu, atau unduh JSON.");
  }
  return full;
};

const projectMeta = p => {
  let shots = 0, done = 0, thumb = (p.prodImgs || []).find(Boolean) || p.mergedPanel || "";
  (p.scenes || []).forEach(sc => (sc.shots || []).forEach(sh => {
    shots++;
    if (sh.imageUrl) { done++; if (!thumb) thumb = sh.imageUrl; }
  }));
  return {
    id: p.id, name: projectName(p), updatedAt: p.updatedAt || 0,
    funnelStage: p.brief?.funnelStage || "-", sceneCount: (p.scenes || []).length,
    shotCount: shots, renderedCount: done, thumbnail: thumb
  };
};

const listSavedProjects = async () => {
  try {
    const all = await idbRun(STORE_PROJECTS, "readonly", st => st.getAll());
    return (all || []).map(projectMeta).sort((a, b) => b.updatedAt - a.updatedAt);
  } catch (e) {
    return load(LS_LIB, []).map(projectMeta).sort((a, b) => b.updatedAt - a.updatedAt);
  }
};

const loadSavedProject = async id => {
  try {
    const p = await idbRun(STORE_PROJECTS, "readonly", st => st.get(id));
    if (p) return normalizeProject(p);
  } catch (e) {}
  return normalizeProject(load(LS_LIB, []).find(p => p.id === id));
};

const deleteSavedProject = async id => {
  try { await idbRun(STORE_PROJECTS, "readwrite", st => st.delete(id)); } catch (e) {}
  save(LS_LIB, load(LS_LIB, []).filter(p => p.id !== id));
};

const downloadProject = data => {
  try {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = projectName(data).replace(/[^a-zA-Z0-9_\- ]/g, "_").trim().replace(/\s+/g, "_") + ".json";
    a.style.display = "none";
    document.body.appendChild(a); a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(a.href); }, 1200);
    return true;
  } catch (e) { console.error("Unduh proyek gagal", e); return false; }
};

UGC bukan iklan yang dibacakan. UGC adalah SATU ORANG yang pernah mengalami sebuah masalah,
menemukan sesuatu yang menyelesaikannya, lalu menceritakan pengalaman itu ke orang lain
karena merasa sayang kalau orang lain ikut menderita hal yang sama.

PURE UGC berarti PENAMPILAN & PERILAKU KEHIDUPAN SEHARI-HARI:
- Tidak terlihat seperti sedang "syuting iklan" — lebih seperti orang biasa ngobrol atau vlog pribadi
- Penampilan natural: pakaian santai rumahan, rambut tidak terlalu rapi, makeup minimal atau tanpa makeup
- Pencahayaan alami: cahaya jendela kamar, lampu ruang tamu biasa — BUKAN lighting studio atau ring light
- Setting nyata: kamar tidur berantakan, sofa rumah, meja dapur — BUKAN background bersih studio
- Bahasa lisan spontan: boleh ada jeda "ehm", pengulangan, atau salah kata lalu dikoreksi sendiri
- Ekspresi natural: tidak "acting" — lebih seperti sedang cerita ke teman lewat video call
- Gestur spontan: tangan bergerak saat bicara, sesekali lirik ke samping, ekspresi mikro natural

Konsekuensi yang WAJIB terlihat di naskah & visual:
1. ADA "AKU". Ditulis sebagai orang pertama — pengalaman yang benar-benar dialami si pencerita.
   DILARANG memakai sudut pandang merek ("produk kami", "hadir untuk Anda", "kini tersedia").
2. MASALAH DULU, PRODUK BELAKANGAN. Penonton harus merasakan susahnya lebih dulu.
   Produk baru boleh muncul setelah penonton peduli pada si pencerita.
3. PRODUK ADALAH PEMERAN PEMBANTU. Tokoh utamanya adalah PERUBAHAN yang dialami si pencerita.
   Produk hanya alat yang membuat perubahan itu terjadi.
4. JUJUR TERMASUK BAGIAN TIDAK ENAKNYA. Keraguan awal, kegagalan sebelumnya, atau harga yang
   sempat bikin mikir justru membuat cerita dipercaya. Cerita mulus tanpa cacat terdengar palsu.
5. REKOMENDASI, BUKAN PERINTAH. Akhiri seperti orang menyarankan ke teman, bukan spanduk diskon.
   Ajakan beli melebur ke dalam alasan pribadi kenapa cerita ini dibagikan.
6. SPESIFIK MENGALAHKAN INDAH. "Hari ke-5, tisu di meja gue nggak kepakai lagi" jauh lebih kuat
   daripada "kulitku jadi lebih sehat dan percaya diriku meningkat".
7. TERLIHAT SPONTAN, BUKAN DIRENCANAKAN. Shot tidak boleh terlalu rapi atau "sempurna" —
   justru sedikit "imperfect" membuat terasa lebih jujur dan relatable.`;

/* "C cx cy r" -> circle, selain itu path */
const Icon = ({ n, className = "" }) => {
  const raw = PATHS[n];
  if (!raw) return null;
  const kids = raw.split("|").map((seg, i) => {
    if (seg.startsWith("C ")) {
      const [, cx, cy, r] = seg.split(" ");
      return <circle key={i} cx={cx} cy={cy} r={r} />;
    }
    if (/^M\d+ \d+h\d+v\d+H\d+z$/.test(seg) === false && seg.startsWith("M") && seg.includes("h") && seg.includes("v") && seg.endsWith("z")) {
      return <path key={i} d={seg} />;
    }
    return <path key={i} d={seg} />;
  });
  return (
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"
         strokeLinejoin="round" className={className}>{kids}</svg>
  );
};

/* ---------- Select dengan opsi "tulis kustom" ---------- */
function SmartSelect({ label, value, onChange, options, placeholder, disabled }) {
  const isCustom = Boolean(value) && !options.includes(value);
  if (isCustom) return (
    <div className="space-y-1.5">
      <div className="flex items-center gap-2">
        <span className="text-[9px] font-black text-indigo-600 bg-indigo-50 border border-indigo-200 px-2 py-0.5 rounded-md">✏️ Mode Kustom</span>
        <button type="button" onClick={() => onChange(options[0])}
          className="text-[9px] font-bold text-slate-400 hover:text-indigo-600 underline underline-offset-2">← Pilih dari daftar</button>
      </div>
      <textarea rows={2} value={value} onChange={e => onChange(e.target.value)} disabled={disabled} autoFocus
        placeholder={placeholder || `Ketik ${(label || "nilai").toLowerCase()} kustom...`}
        className="w-full bg-white border-2 border-indigo-400 rounded-xl px-4 py-3 text-xs font-bold text-slate-900 focus:outline-none focus:border-indigo-600 resize-none leading-relaxed" />
    </div>
  );
  return (
    <select value={value || options[0]} disabled={disabled}
      onChange={e => onChange(e.target.value === "__kustom__" ? " " : e.target.value)}
      className="w-full bg-slate-50 border-2 border-slate-200/80 rounded-xl px-4 py-3 text-xs text-slate-800 font-bold focus:outline-none focus:border-indigo-500 focus:bg-white cursor-pointer transition-all">
      {options.map(o => <option key={o} value={o}>{o}</option>)}
      <option value="__kustom__">✏️ Tulis Kustom Sendiri...</option>
    </select>
  );
}

  const pick = async e => { const f = e.target.files?.[0]; if (f) onPick(await shrink(await fileToData(f))); e.target.value = ""; };

    <div className={`relative group w-full ${aspect} rounded-xl bg-white border-2 border-dashed border-slate-300 flex items-center justify-center overflow-hidden shadow-sm transition-all ${ring}`}>

/* ---------- BANNER PROSES — menempel di ATAS, tidak hilang sampai proses selesai ----------
   busy  : proses berjalan. Hanya hilang saat kode memanggil setBusy("") — jadi selama
           AI masih bekerja, bar ini tetap terlihat lengkap dengan penghitung detik.
   toast : hasil akhir. Sukses menutup sendiri; error & peringatan MENUNGGU ditutup manual
           supaya pesan kegagalan tidak lenyap sebelum sempat dibaca. */
const Banner = ({ busy, toast, since, onClose }) => {
  const [detik, setDetik] = useState(0);
  useEffect(() => {
    if (!busy || !since) { setDetik(0); return; }
    const tick = () => setDetik(Math.max(0, Math.round((Date.now() - since) / 1000)));
    tick();
    const id = setInterval(tick, 1000);
    return () => clearInterval(id);
  }, [busy, since]);

  if (!busy && !toast) return null;

  if (busy) return (
    <div className="bg-slate-900 text-white border-b border-slate-700 shadow-lg">
      <div className="max-w-7xl mx-auto px-3 sm:px-6 py-2.5 flex items-center gap-3">
        <Icon n="RefreshCw" className="w-4 h-4 spin shrink-0 text-amber-300" />
        <span className="text-[11px] sm:text-xs font-bold leading-snug flex-1 min-w-0">{busy}</span>
        <span className="text-[10px] font-mono text-slate-400 shrink-0 tabular-nums">{detik}s</span>
        <span className="text-[9px] font-black uppercase tracking-wider text-amber-300 bg-amber-400/10 border border-amber-400/30 px-2 py-0.5 rounded-full shrink-0 hidden sm:inline pulse-soft">
          Jangan tutup tab
        </span>
      </div>
      <div className="h-1 w-full bg-slate-800 overflow-hidden">
        <div className="h-full w-1/4 bg-amber-400 bar-run rounded-full" />
      </div>
    </div>
  );

  const cls = toast.type === "success" ? "bg-emerald-600 border-emerald-700"
    : toast.type === "error" ? "bg-rose-600 border-rose-700" : "bg-amber-500 border-amber-600";
  return (
    <div className={"text-white border-b shadow-lg " + cls}>
      <div className="max-w-7xl mx-auto px-3 sm:px-6 py-2.5 flex items-start gap-2.5">
        <span className="shrink-0 text-sm leading-none mt-0.5">
          {toast.type === "success" ? "✅" : toast.type === "error" ? "❌" : "⚠️"}
        </span>
        <span className="text-[11px] sm:text-xs font-bold leading-snug flex-1 min-w-0">{toast.text}</span>
        <button onClick={onClose} title="Tutup"
          className="shrink-0 p-1 rounded-lg hover:bg-black/20 transition-colors">
          <Icon n="X" className="w-3.5 h-3.5" />
        </button>
      </div>
    </div>
  );
};

   Diletakkan SEBELUM ide cerita karena ide harus lahir dari pengalaman, bukan sebaliknya. */
function StoryPanel({ ctx }) {
  const { brief, patchStory, runDraftStory, busy, ceritaTerisi, ceritaSiap } = ctx;
  const st = brief.story || {};
  const total = STORY_BEATS.length;

  return (
    <div className="bg-white border-2 border-rose-300 rounded-3xl overflow-hidden shadow-md shadow-rose-100">
      <div className="bg-gradient-to-r from-rose-600 via-rose-500 to-orange-500 text-white px-5 py-4 flex flex-col sm:flex-row sm:items-center gap-3">
        <div className="flex items-center gap-3 flex-1 min-w-0">
          <div className="bg-white/20 p-2 rounded-xl shrink-0"><Icon n="Mic" className="w-5 h-5" /></div>
          <div className="min-w-0">
            <h3 className="text-sm font-black tracking-wide uppercase" style={{ fontFamily: "Space Grotesk,sans-serif" }}>
              Kesaksian Pencerita — Nyawa Video Ini
            </h3>
            <p className="text-[11px] text-white/85 leading-snug">
              UGC = orang yang punya masalah, menemukan jalan keluar, lalu cerita. Isi pengalamannya di sini.
            </p>
          </div>
        </div>
        <span className={"shrink-0 text-[10px] font-black uppercase tracking-wider px-3 py-1.5 rounded-full border " +
          (ceritaSiap ? "bg-white text-rose-700 border-white" : "bg-white/15 text-white border-white/40")}>
          {ceritaTerisi}/{total} beat terisi
        </span>
      </div>

      <div className="p-4 md:p-6 space-y-4">
        <div className="bg-rose-50 border border-rose-200 rounded-2xl p-3.5 space-y-2">
          <p className="text-[11px] text-rose-900 leading-relaxed">
            <b>Kenapa ini wajib?</b> Tanpa pengalaman nyata, AI cuma bisa merangkai keunggulan produk — hasilnya
            iklan yang dibacakan, dan penonton hafal betul bedanya. Lima beat di bawah dibaca langsung oleh
            generator ide, penulis naskah, dan auditor kejujuran.
          </p>
          <button type="button" onClick={runDraftStory} disabled={Boolean(busy)}
            className="w-full sm:w-auto py-2.5 px-5 bg-rose-600 hover:bg-rose-700 disabled:bg-rose-300 text-white text-[11px] font-black rounded-full flex items-center justify-center gap-2 shadow transition-all">
            <Icon n="Sparkles" className="w-3.5 h-3.5" /> Bantu Susun Draf Kesaksian (AI)
          </button>
          <p className="text-[10px] text-rose-700/80 leading-relaxed">
            Draf AI hanya pemancing. <b>Ganti dengan kejadian yang benar-benar terjadi</b> — satu detail asli
            mengalahkan sepuluh kalimat karangan yang rapi.
          </p>
        </div>

        <div className="space-y-1.5">
          <Label>Siapa yang bercerita</Label>
          <input type="text" value={st.teller || ""} onChange={e => patchStory({ teller: e.target.value })}
            placeholder="Contoh: Rani, karyawan yang tiap hari naik KRL dari Bekasi"
            className="w-full bg-slate-50 border-2 border-slate-200/80 rounded-xl px-4 py-3 text-xs font-bold text-slate-900 focus:outline-none focus:border-rose-500 focus:bg-white" />
        </div>

        <div className="space-y-3">
          {STORY_BEATS.map(b => {
            const isi = sv(st, b.key);
            return (
              <div key={b.key} className={"rounded-2xl border-2 p-3.5 space-y-2 transition-all " +
                (isi ? "border-emerald-300 bg-emerald-50/40" : "border-slate-200 bg-slate-50")}>
                <div className="flex items-start gap-2.5">
                  <span className="text-base leading-none shrink-0 mt-0.5">{b.emoji}</span>
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2 flex-wrap">
                      <span className={"text-[9px] font-black uppercase tracking-wider px-2 py-0.5 rounded-md " +
                        (isi ? "bg-emerald-600 text-white" : "bg-slate-200 text-slate-600")}>
                        Beat {b.no}
                      </span>
                      <span className="text-[11px] font-black text-slate-900">{b.label}</span>
                      {isi && <Icon n="Check" className="w-3.5 h-3.5 text-emerald-600" />}
                    </div>
                    <p className="text-[10px] text-slate-500 leading-snug mt-1">{b.desc}</p>
                    <p className="text-[10px] font-bold text-rose-700 mt-1.5">{b.ask}</p>
                  </div>
                </div>
                <textarea rows={2} value={isi} onChange={e => patchStory({ [b.key]: e.target.value })}
                  placeholder={b.placeholder}
                  className="w-full bg-white border border-slate-200 rounded-xl p-3 text-xs text-slate-800 resize-none leading-relaxed focus:outline-none focus:border-rose-400" />
              </div>
            );
          })}
        </div>

        {!ceritaSiap && (
          <p className="text-[11px] text-amber-900 bg-amber-50 border border-amber-300 rounded-xl px-3.5 py-2.5 leading-relaxed">
            ⚠️ Masih ada beat kosong. Naskah tetap bisa dibuat setelah semuanya terisi — beat yang bolong
            membuat cerita melompat dan penonton kehilangan alasan untuk peduli.
          </p>
        )}
      </div>
    </div>
  );
}

/* ============================================================
   PROJECT MANAGER — simpan / buka / impor / ekspor proyek
   (dari V3: pustaka proyek IndexedDB + file .json)
   ============================================================ */
function ProjectManagerModal({ open, mode, onClose, current, onLoad, onReset, say }) {
  const [tab, setTab] = useState(mode === "open" ? "library" : "save");
  const [list, setList] = useState([]);
  const [name, setName] = useState("");
  const [busyLocal, setBusyLocal] = useState(false);
  const [askDelete, setAskDelete] = useState(null);
  const [askNew, setAskNew] = useState(false);

  useEffect(() => {
    if (!open) return;
    setTab(mode === "open" ? "library" : "save");
    setAskDelete(null); setAskNew(false);
    setName(projectName(current) === "Proyek Tanpa Judul" ? "" : projectName(current));
    refresh();
  }, [open, mode]);

  const refresh = async () => {
    setBusyLocal(true);
    try { setList(await listSavedProjects()); }
    catch (e) { console.warn(e); }
    finally { setBusyLocal(false); }
  };

  if (!open) return null;

  const doSave = async () => {
    const nm = name.trim();
    if (!nm) return say("Beri nama proyek dulu!", "error");
    setBusyLocal(true);
    try {
      await saveProjectToLibrary({ ...current, id: null, name: nm });
      say(`Proyek "${nm}" tersimpan di peramban! 💾`);
      await refresh();
      setTab("library");
    } catch (e) { say(e.message, "error"); }
    finally { setBusyLocal(false); }
  };

  const doDownload = () => {
    const ok = downloadProject({ ...current, name: name.trim() || projectName(current) });
    say(ok ? "File proyek .json diunduh!" : "Unduhan diblokir peramban. Pakai tombol Salin JSON.", ok ? "success" : "warning");
  };

  const doCopy = async () => {
    const txt = JSON.stringify({ ...current, name: name.trim() || projectName(current) }, null, 2);
    try {
      if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(txt);
      else {
        const ta = document.createElement("textarea");
        ta.value = txt; ta.style.position = "fixed"; ta.style.top = "0";
        document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
      }
      say("Data proyek disalin ke clipboard! 📋");
    } catch (e) { say("Gagal menyalin: " + e.message, "error"); }
  };

  const doOpen = async id => {
    setBusyLocal(true);
    try {
      const p = await loadSavedProject(id);
      if (!p) return say("Proyek tidak ditemukan.", "error");
      onLoad(p);
      say(`Proyek "${projectName(p)}" dimuat! 📂`);
      onClose();
    } catch (e) { say("Gagal memuat proyek: " + e.message, "error"); }
    finally { setBusyLocal(false); }
  };

  const doDelete = async id => {
    await deleteSavedProject(id);
    setAskDelete(null);
    await refresh();
    say("Proyek dihapus.", "warning");
  };

  const doImport = async e => {
    const f = e.target.files?.[0];
    e.target.value = "";
    if (!f) return;
    try {
      const p = normalizeProject(JSON.parse(await f.text()));
      if (!p) throw new Error("Struktur file tidak dikenali (tidak ada data brief).");
      onLoad(p);
      say(`Proyek "${projectName(p)}" berhasil diimpor! 📥`);
      onClose();
    } catch (err) { say("File proyek tidak valid: " + err.message, "error"); }
  };

  const when = ts => {
    if (!ts) return "-";
    const d = new Date(ts), m = Math.round((Date.now() - ts) / 60000);
    if (m < 1) return "baru saja";
    if (m < 60) return m + " menit lalu";
    if (m < 1440) return Math.round(m / 60) + " jam lalu";
    return d.toLocaleDateString("id-ID", { day: "2-digit", month: "short", year: "numeric" });
  };

  const TabBtn = ({ id, icon, children }) => (
    <button type="button" onClick={() => setTab(id)}
      className={"flex-1 py-2.5 px-3 rounded-xl text-[11px] font-black flex items-center justify-center gap-1.5 transition-all " +
        (tab === id ? "bg-slate-900 text-white shadow-sm" : "bg-slate-100 text-slate-600 hover:bg-slate-200")}>
      <Icon n={icon} className="w-3.5 h-3.5" /> {children}
    </button>
  );

  return (
    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[210] flex items-center justify-center p-3 sm:p-4 animate-fade-in" onClick={onClose}>
      <div onClick={e => e.stopPropagation()}
        className="bg-white rounded-3xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden">
        <div className="px-5 py-4 border-b border-slate-200 flex items-center justify-between gap-3 shrink-0">
          <div className="flex items-center gap-2.5 min-w-0">
            <div className="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center shrink-0">
              <Icon n="Box" className="w-5 h-5" />
            </div>
            <div className="min-w-0">
              <h3 className="text-sm font-black text-slate-900 truncate" style={{ fontFamily: "Space Grotesk,sans-serif" }}>Manajer Proyek</h3>
              <p className="text-[10px] text-slate-500">Simpan pekerjaan, buka proyek lama, atau pindahkan ke perangkat lain</p>
            </div>
          </div>
          <button onClick={onClose} className="p-2 rounded-xl hover:bg-slate-100 text-slate-500 shrink-0"><Icon n="X" className="w-4 h-4" /></button>
        </div>

        <div className="px-5 pt-4 flex items-center gap-2 shrink-0">
          <TabBtn id="save" icon="Download">Simpan</TabBtn>
          <TabBtn id="library" icon="Box">Pustaka ({list.length})</TabBtn>
          <TabBtn id="import" icon="Upload">Impor</TabBtn>
        </div>

        <div className="p-5 overflow-y-auto flex-1 space-y-4">
          {tab === "save" && (
            <div className="space-y-4">
              <div className="space-y-1.5">
                <Label req>Nama Proyek</Label>
                <input type="text" value={name} onChange={e => setName(e.target.value)}
                  placeholder="Contoh: Serum Glow — TOFU Skit"
                  className="w-full bg-slate-50 border-2 border-slate-200/80 rounded-xl px-4 py-3 text-xs font-bold text-slate-900 focus:outline-none focus:border-indigo-500 focus:bg-white" />
              </div>
              <div className="bg-slate-50 rounded-2xl p-4 border border-slate-200 grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
                {[["Funnel", current.brief?.funnelStage || "-"], ["Scene", (current.scenes || []).length],
                  ["Shot", (current.scenes || []).reduce((a, s) => a + (s.shots?.length || 0), 0)],
                  ["Ter-render", (current.scenes || []).reduce((a, s) => a + (s.shots || []).filter(x => x.imageUrl).length, 0)]].map(([k, v]) => (
                  <div key={k}>
                    <p className="text-[9px] font-bold text-slate-400 uppercase tracking-wider">{k}</p>
                    <p className="text-sm font-black text-slate-800">{v}</p>
                  </div>
                ))}
              </div>
              <button onClick={doSave} disabled={busyLocal}
                className="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white font-black text-xs rounded-2xl flex items-center justify-center gap-2 shadow-sm">
                <Icon n="Download" className="w-4 h-4" /> Simpan ke Peramban Ini
              </button>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                <button onClick={doDownload} className="py-3 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-800 font-bold text-[11px] rounded-2xl flex items-center justify-center gap-1.5">
                  <Icon n="Download" className="w-3.5 h-3.5" /> Unduh File .json
                </button>
                <button onClick={doCopy} className="py-3 bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 font-bold text-[11px] rounded-2xl flex items-center justify-center gap-1.5">
                  <Icon n="Copy" className="w-3.5 h-3.5" /> Salin JSON
                </button>
              </div>
              <p className="text-[10px] text-slate-400 leading-relaxed">
                Simpanan peramban memakai IndexedDB — gambar ikut tersimpan. File .json bisa dipindah ke komputer/browser lain, termasuk untuk dibagikan ke tim.
              </p>
            </div>
          )}

          {tab === "library" && (
            <div className="space-y-3">
              {busyLocal && <p className="text-xs text-slate-400 text-center py-6">Memuat pustaka...</p>}
              {!busyLocal && !list.length && (
                <div className="text-center py-10 space-y-2">
                  <Icon n="Box" className="w-10 h-10 text-slate-300 mx-auto" />
                  <p className="text-xs font-bold text-slate-600">Belum ada proyek tersimpan</p>
                  <p className="text-[11px] text-slate-400">Simpan proyek lewat tab "Simpan" agar muncul di sini.</p>
                </div>
              )}
              {list.map(p => (
                <div key={p.id} className="border-2 border-slate-200 hover:border-indigo-300 rounded-2xl p-3 flex items-center gap-3 transition-all">
                  <div className="w-14 h-14 rounded-xl bg-slate-100 border border-slate-200 overflow-hidden shrink-0 flex items-center justify-center">
                    {p.thumbnail ? <img src={p.thumbnail} className="w-full h-full object-cover" alt="" />
                      : <Icon n="ImageIcon" className="w-5 h-5 text-slate-300" />}
                  </div>
                  <div className="flex-1 min-w-0">
                    <p className="text-xs font-black text-slate-900 truncate">{p.name}</p>
                    <div className="flex items-center gap-1.5 flex-wrap mt-1">
                      <span className="text-[9px] font-black uppercase bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded">{p.funnelStage}</span>
                      <span className="text-[10px] text-slate-500">{p.sceneCount} scene · {p.renderedCount}/{p.shotCount} shot ter-render</span>
                    </div>
                    <p className="text-[10px] text-slate-400 mt-0.5">{when(p.updatedAt)}</p>
                  </div>
                  <div className="flex items-center gap-1.5 shrink-0">
                    <button onClick={() => doOpen(p.id)} disabled={busyLocal}
                      className="py-2 px-3 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white text-[10px] font-bold rounded-xl">Buka</button>
                    <button onClick={() => setAskDelete(p.id)} title="Hapus"
                      className="p-2 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl"><Icon n="Trash2" className="w-3.5 h-3.5" /></button>
                  </div>
                </div>
              ))}
            </div>
          )}

          {tab === "import" && (
            <div className="space-y-4">
              <label className="block border-2 border-dashed border-slate-300 hover:border-indigo-400 rounded-2xl p-8 text-center cursor-pointer transition-all">
                <Icon n="Upload" className="w-8 h-8 text-slate-400 mx-auto mb-2" />
                <p className="text-xs font-black text-slate-700">Pilih file proyek .json</p>
                <p className="text-[10px] text-slate-400 mt-1">Termasuk file yang diekspor dari perangkat atau anggota tim lain</p>
                <input type="file" accept="application/json,.json" className="hidden" onChange={doImport} />
              </label>
              <div className="border-t border-slate-200 pt-4">
                <p className="text-[11px] font-black text-slate-700 uppercase tracking-wider mb-2">Mulai Bersih</p>
                {!askNew ? (
                  <button onClick={() => setAskNew(true)}
                    className="w-full py-3 bg-red-50 hover:bg-red-100 border border-red-200 text-red-700 font-bold text-[11px] rounded-2xl flex items-center justify-center gap-1.5">
                    <Icon n="Trash2" className="w-3.5 h-3.5" /> Kosongkan Workspace (Proyek Baru)
                  </button>
                ) : (
                  <div className="bg-red-50 border border-red-200 rounded-2xl p-3 space-y-2.5">
                    <p className="text-[11px] text-red-800 font-semibold leading-relaxed">
                      Seluruh brief, naskah, dan gambar di workspace saat ini akan dikosongkan. Proyek yang sudah tersimpan di pustaka TIDAK ikut terhapus.
                    </p>
                    <div className="flex items-center gap-2">
                      <button onClick={() => setAskNew(false)} className="flex-1 py-2 bg-white border border-slate-200 text-slate-700 font-bold rounded-xl text-[11px]">Batal</button>
                      <button onClick={() => { setAskNew(false); onReset(); onClose(); }}
                        className="flex-1 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl text-[11px]">Ya, Kosongkan</button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>

        {askDelete && (
          <div className="absolute inset-0 bg-slate-900/50 flex items-center justify-center p-4" onClick={() => setAskDelete(null)}>
            <div className="bg-white rounded-2xl p-5 max-w-xs w-full space-y-3 text-center" onClick={e => e.stopPropagation()}>
              <div className="w-11 h-11 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto"><Icon n="AlertTriangle" className="w-5 h-5" /></div>
              <p className="text-xs font-bold text-slate-800">Hapus proyek ini dari pustaka?</p>
              <div className="flex items-center gap-2">
                <button onClick={() => setAskDelete(null)} className="flex-1 py-2 bg-slate-100 text-slate-700 font-bold rounded-xl text-[11px]">Batal</button>
                <button onClick={() => doDelete(askDelete)} className="flex-1 py-2 bg-red-600 text-white font-bold rounded-xl text-[11px]">Hapus</button>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------- kumpulkan referensi gambar untuk 1 shot ---------- */
/* Prinsip: kirim yang RELEVAN saja, tiap gambar utuh & terpisah, label eksplisit. */
function buildRefs(shot, A) {
  const { brief, prodImgs, mergedPanel, talent1, talent2, locRefs, propRefs, prevFrame } = A;
  const refs = [];

  /* lokasi: hanya slot yang dicentang & ada fotonya */
  (shot.useLocationRefs || []).forEach((on, i) => {
    if (on && locRefs[i]?.img) refs.push({ label: `Lokasi ${i + 1}`, data: locRefs[i].img });
  });

  /* talent */
  if (shot.useTalentRef && talent1)  refs.push({ label: "Talent 1", data: talent1 });
  if (shot.useTalent2Ref && talent2) refs.push({ label: "Talent 2", data: talent2 });

  /* props skenario: cocokkan teks slot dengan props shot; kalau tak ada yang cocok -> kirim semua */
  SCENARIO_PROPS.forEach(({ key }) => {
    if (!shot.useScenarioPropRefs?.[key]) return;
    const slots = (propRefs[key] || []).map((s, i) => ({ ...s, i })).filter(s => s?.img);
    if (!slots.length) return;
    const p = (shot.props || "").toLowerCase().trim();
    const score = s => {
      const t = (s.text || "").toLowerCase().trim();
      if (!t || !p) return 0;
      if (p.includes(t) || t.includes(p)) return 99;
      const w = t.split(/[\s,\/;.()-]+/).filter(x => x.length > 3);
      return w.length ? w.filter(x => p.includes(x)).length : 0;
    };
    const scored = slots.map(s => ({ s, v: score(s) }));
    const max = Math.max(...scored.map(x => x.v));
    (max > 0 ? scored.filter(x => x.v === max) : scored)
      .forEach(({ s }) => refs.push({ label: `Props ${key} ${s.i + 1}`, data: s.img }));
  });

  /* PRODUK — Slot 5 (panel gabungan) adalah acuan utama.
     Panel itu sudah merangkum semua sudut/varian dalam SATU gambar bersih,
     jadi lebih konsisten daripada mengirim 2-4 foto galeri yang sudut & cahayanya beda-beda.
     Foto galeri hanya dipakai sebagai CADANGAN bila panel belum dibuat. */
  const perluProduk = (shot.useProductRefs || []).some(Boolean) || shot.useMergedRef;
  if (perluProduk && mergedPanel) {
    refs.push({ label: "Panel Referensi Produk (acuan utama — semua sudut produk)", data: mergedPanel });
  } else if (perluProduk) {
    (shot.useProductRefs || []).forEach((on, i) => {
      if (on && prodImgs[i]) refs.push({ label: `Produk Slot ${i + 1}`, data: prodImgs[i] });
    });
  }

  /* varian aktif -> prioritas tertinggi, taruh paling akhir agar paling dekat instruksi */
  if (Number.isInteger(shot.variantIndex) && brief.productVariants) {
    const v = brief.productVariants[shot.variantIndex];
    if (v?.image) refs.push({ label: `Produk VARIAN AKTIF "${v.name || "Varian " + (shot.variantIndex + 1)}"`, data: v.image });
  }

  /* frame sebelumnya -> jaga kesinambungan */
  if (shot.usePrevFrame && prevFrame) refs.push({ label: "Frame Sebelumnya", data: prevFrame });

  return refs;
}

/* ---------- prompt gambar 1 shot ---------- */
function buildImagePrompt(shot, A) {
  const { brief, meta, talents, locRefs } = A;
  const name = brief.productName || "produk";
  const faceless = isFaceless(brief);
  const ratio = meta.format === "portrait" ? "9:16 VERTICAL/PORTRAIT" : "16:9 HORIZONTAL/LANDSCAPE";
  const variant = Number.isInteger(shot.variantIndex) ? brief.productVariants?.[shot.variantIndex] : null;
  const showProduct = (shot.useProductRefs || []).some(Boolean) || shot.useMergedRef || Boolean(variant?.image);

  /* mode motion graphic murni */
  if (shot.productAnim) {
    const st = shot.animStyle === "Kustom"
      ? (shot.animStyleCustom || "")
      : (ANIM_STYLES.find(a => a.name === shot.animStyle) || ANIM_STYLES[0]).desc;
    let p = `[ASPECT RATIO: ${ratio}] Commercial product photography of ${name}. ${st}. Camera style: ${brief.cameraStyle}. Ultra high quality 8K, professional studio lighting, photorealistic.`;
    if (brief.motionGraphicDesc) p += ` Motion graphic elements: ${brief.motionGraphicDesc}.`;
    return p + " " + REALISM + " " + NEGATIVE;
  }

  const li = (shot.useLocationRefs || []).findIndex(Boolean);
  const loc = li >= 0 && locRefs[li]?.text ? locRefs[li].text : (shot.location || brief.location || "studio");

  let p = `[ASPECT RATIO: ${ratio}] PURE UGC everyday personal content frame, shot on smartphone camera with natural home lighting. ${shot.cameraAngle}, ${shot.visualDescription}`;
  if (shot.talent) p += `. Talent action: ${shot.talent}. IMPORTANT: Talent appears natural and casual, NOT posed like professional model, showing genuine everyday behavior.`;
  if (shot.props)  p += `. Shot props: ${shot.props}.`;
  if (shot.directorNotes) p += `. Director notes: ${shot.directorNotes}.`;

  p += showProduct
    ? ` Product shown: ${name} (${brief.productCategory}). CRITICAL: Product is being used naturally in everyday context, NOT staged for advertisement.`
    : ` This shot does NOT show ${name} yet — the product has not been introduced. Do NOT render the product, its packaging, or any product reference anywhere in this image.`;

  if (showProduct) {
    const truth = variant?.visualDescription || brief.productVisualDescription;
    if (truth && truth !== "NO_REFERENCE_PHOTO")
      p += ` PRIORITAS UTAMA — MENGALAHKAN teks lain jika bertentangan: tampilan fisik produk PERSIS sesuai foto referensi (${truth}). Foto referensi adalah kebenaran mutlak untuk warna, kemasan, dan tulisan pada label.`;
    if (variant?.name) p += ` Variant on display: ${variant.name}. JANGAN override warna/kemasan dari foto referensi.`;
    if (brief.productClaim) p += ` Product claim: ${brief.productClaim}.`;
  }

  p += ` ${faceless ? "Environment" : "Location"}: ${loc}. PURE UGC setting: natural everyday home environment with lived-in details, casual lighting from windows or regular home lamps, NOT perfect studio setup. Visual style: ${brief.visualStyle || "natural everyday"}. Camera/Lens: ${brief.cameraStyle}. Shot on smartphone, handheld natural framing, slight imperfections welcomed.`;

  SCENARIO_PROPS.forEach(({ key }) => {
    if (shot.useScenarioPropRefs?.[key] && brief.scenarioProps?.[key]) {
      const how = key === "comparison" ? "placed side-by-side or in contrast with the main product"
                : key === "narrative"  ? "visible to represent the pain point"
                : "as background set dressing";
      p += ` ${key} prop ${how}, matching its attached reference photo: ${brief.scenarioProps[key]}.`;
    }
  });

  if (brief.productionMode === "Talent" && brief.useMotionGraphic && brief.motionGraphicDesc)
    p += ` Include motion graphic overlay effects: ${brief.motionGraphicDesc}.`;

  const desc = t => `${tv(t, "gender")}, ${tv(t, "age")}, ${tv(t, "ethnic")} ethnicity, ${tv(t, "hairStyle")}, ${tv(t, "skinTone")} skin tone, ${tv(t, "expression")} expression, wearing ${tv(t, "outfit")}. CRITICAL: Natural everyday appearance - minimal or no makeup, hair naturally styled or slightly messy, casual comfortable posture, genuine unposed expression, NOT professional model look`;
  if (brief.talentCount === "2 Talent (Interaksi)")
    p += ` Featuring TWO everyday Indonesian people having genuine interaction. Talent 1: ${desc(talents[0])}. Talent 2: ${desc(talents[1])}. Both appear natural and casual like real friends talking, NOT staged acting for camera. Real spontaneous body language and expressions.`;
  else if (!faceless)
    p += ` Featuring one everyday Indonesian person: ${desc(talents[0])}. Person appears relaxed and natural like creating personal content for friends, NOT performing for advertisement.`;

  if (shot.usePrevFrame) p += ` CONTINUITY: keep the talent's wardrobe, hairstyle, and overall lighting consistent with the attached "Frame Sebelumnya", but use a NEW camera composition — do not copy its framing.`;

  p += ` CRITICAL: generate strictly in ${ratio} aspect ratio. Commercial UGC advertisement quality, vibrant colors, sharp focus, cinematic composition. ${REALISM} ${NEGATIVE} Seed: ${Date.now()}`;
  return p;
}

/* ---------- prompt Image-to-Video per scene ---------- */
function buildI2V(scene, A) {
  const { brief, meta, talents } = A;
  const ar = meta.format === "portrait" ? "9:16 vertical" : "16:9 horizontal";
  const n = scene.shots.length;
  const cam = (brief.cameraStyle || "").split(" (")[0];
  const faceless = isFaceless(brief);

  const nm = i => tv(talents[i], "name") || "Talent " + (i + 1);
  const who = i => {
    const bits = [tv(talents[i], "age"), tv(talents[i], "ethnic"), tv(talents[i], "gender") === "Pria" ? "man" : "woman"].filter(Boolean).join(" ");
    const look = [tv(talents[i], "hairStyle"), tv(talents[i], "skinTone") && tv(talents[i], "skinTone") + " skin", tv(talents[i], "outfit") && "wearing " + tv(talents[i], "outfit")].filter(Boolean).join(", ");
    return `${nm(i)} — a ${bits}${look ? ", " + look : ""}`;
  };

  const duo = brief.talentCount === "2 Talent (Interaksi)";
  const anyTalent = !faceless && scene.shots.some(s => s.useTalentRef || s.useTalent2Ref);

  let p = `[SCENE ${scene.sceneNumber} — ${scene.title}]\n`;
  p += `PURE UGC AESTHETIC - One continuous 10-second ${ar} everyday personal content clip. This is genuine user-generated content shot on ${cam || "smartphone"}, NOT professional advertisement. Natural home environment, casual spontaneous behavior, real everyday interaction. ${meta.videoType}, ${meta.tone} tone.\n\n`;

  /* --- siapa yang ada di frame --- */
  if (anyTalent) {
    p += duo
      ? `CAST — real everyday people, NOT professional actors, keep both identical to starting image:\n${who(0)}.\n${who(1)}.\nBoth appear natural and relaxed like friends casually filming personal content together. Genuine spontaneous expressions and body language, NOT staged performance.\n\n`
      : `CAST — real everyday person, NOT professional talent, keep identical to starting image:\n${who(0)}.\nPerson appears natural and relaxed like filming personal vlog or story for friends. Genuine casual behavior, minimal or no makeup visible, natural hair movement, comfortable authentic posture.\n\n`;
  }

  /* --- alur 10 detik sebagai beat berurutan, bukan klip terpisah --- */
  p += `ACTION — the clip flows through ${n} beats without cutting:\n`;
  scene.shots.forEach((s, i) => {
    const word = i === 0 ? "Opens on" : i === n - 1 ? "Ends on" : "Then";
    const bits = [];
    if (s.cameraAngle) bits.push(s.cameraAngle.toLowerCase());
    if (s.cameraMove) bits.push(s.cameraMove);
    p += `${i + 1}. ${word} ${s.visualDescription || "-"}`;
    if (s.talent) p += ` ${s.talent}`;
    if (s.props) p += ` In frame: ${s.props}.`;
    if (bits.length) p += ` Camera: ${bits.join(", ")}.`;
    if (s.directorNotes) p += ` ${s.directorNotes}`;
    if (s.productAnim) {
      const st = s.animStyle === "Kustom" ? (s.animStyleCustom || "") : (ANIM_STYLES.find(a => a.name === s.animStyle) || {}).desc;
      if (st) p += ` ${st}.`;
    }
    p += "\n";
  });
  p += `The beats are one flowing take — the camera moves between them, it does not cut.\n\n`;

  /* --- dialog utuh: memang dirancang untuk 10 detik --- */
  const lines = (scene.voiceover || "").split(/\n+/).map(x => x.trim()).filter(Boolean);
  if (lines.length) {
    const words = lines.join(" ").replace(/@\S+:/g, "").trim().split(/\s+/).filter(Boolean).length;
    p += `DIALOGUE (${words} words, spoken naturally like everyday conversation):\n`;
    lines.forEach(l => {
      const m = l.match(/^@\s*([^:]+):\s*(.+)$/);
      p += m ? `${m[1].trim()} says: "${m[2].trim()}"\n` : `"${l}"\n`;
    });
    p += anyTalent
      ? `Spoken naturally in ${brief.language} like genuine everyday conversation - casual pace with natural pauses, slight hesitations welcomed, NOT scripted perfect delivery. Lips move naturally matching speech rhythm, expressions shift organically during talking. When line ends, mouth closes naturally. Real conversational body language - small gestures, natural eye movements, genuine reactions.\n\n`
      : `Voiceover only in ${brief.language}. No one speaks on camera — every mouth stays closed and still.\n\n`;
  }
  if (scene.sfx) p += `AUDIO: ${scene.sfx}\n\n`;

  /* --- PRODUK: satu-satunya sumber kebenaran, ditaruh paling akhir agar paling kuat --- */
  const usesProduct = scene.shots.some(s => (s.useProductRefs || []).some(Boolean) || s.useMergedRef || (Number.isInteger(s.variantIndex) && brief.productVariants?.[s.variantIndex]?.image));
  if (usesProduct) {
    const vi = scene.shots.map(s => s.variantIndex).find(Number.isInteger);
    const variant = Number.isInteger(vi) ? brief.productVariants?.[vi] : null;
    const truth = variant?.visualDescription || brief.productVisualDescription;
    p += `PRODUCT — ABSOLUTE RULE, OVERRIDES EVERYTHING ELSE IN THIS PROMPT:\n`;
    p += `The product is ${brief.productName || "the product"}${variant?.name ? ` (variant: ${variant.name})` : ""}.\n`;
    if (truth && truth !== "NO_REFERENCE_PHOTO") p += `It looks exactly like this: ${truth}\n`;
    p += `Reproduce the packaging EXACTLY as it appears in the starting image — same colour, same shape, same material, same label text and layout.\n`;
    p += `Do NOT recolour, restyle, simplify, or redesign the packaging. Do NOT invent text or logos on it.\n`;
    p += `If any wording anywhere in this prompt seems to describe the product differently, IGNORE that wording — the starting image is the truth.\n\n`;
  }

  p += `TRANSITION OUT: ${scene.transitionNote || "Cut to next"}\n\n`;

  p += `TECHNICAL RULES
- PURE UGC AESTHETIC: Match the starting image's natural everyday look exactly - same casual appearance, same relaxed posture, same home environment, same natural lighting. The image shows real personal content quality, NOT professional production.
- Natural everyday motion: Real human behavior - casual walking pace, natural hand gestures while talking, authentic facial micro-expressions, comfortable body language. Slight imperfections in movement welcomed (natural fidgeting, adjusting hair, shifting weight).
- Smartphone camera quality: Handheld natural framing with subtle organic movement. Slight shake or drift is authentic and welcomed. NOT perfectly stable tripod unless explicitly using "Tripod Smartphone" mode.
- Natural home lighting: Window light shifts, regular room lamps, realistic everyday shadows. NOT studio lighting perfection.
- Lived-in environment: Background shows real home details - books on shelf, items on table, casual lived-in authenticity. NOT sterile empty set.
- Fill the ${ar} frame naturally edge to edge. No letterboxing, pillarboxing, black bars, or borders.
- One seamless continuous everyday moment. Never a grid, split screen, collage, or storyboard layout.
- STRICTLY NO on-screen text, captions, subtitles, watermarks, logos, or UI overlays unless written in ACTION above.
- Real smartphone footage aesthetic, natural everyday lighting and color, authentic home environment depth. Real personal content, NOT advertisement production quality.

AVOID: overly smooth professional camera movement, perfect lighting, staged poses, model-like behavior, commercial polish, sterile backgrounds, artificial perfection, advertising aesthetics, face morphing, warped fingers, unnatural body movement, objects defying physics.`;

  return p;
}

/* ---------- 1b. Rekomendasi tahapan funnel (dari V3) ---------- */
async function aiRecommendFunnel({ brief, seed }) {
  return genJSON({
    contents: `Tentukan TAHAPAN FUNNEL MARKETING paling tepat untuk iklan video UGC produk ini.

=== DATA PRODUK ===
Nama: ${brief.productName || seed}
Kategori: ${brief.productCategory || "-"} | Kisaran Harga: ${brief.priceOwn || "tidak diketahui"}
Keunggulan: ${brief.keyFeatures || "-"} | Klaim: ${brief.productClaim || "-"}
Pain Point Audiens: ${brief.painPoints || "-"}
Target Penonton: ${brief.targetAudience || "-"} | Platform: ${brief.platform || "TikTok"}
Ide Kustom Kreator: ${brief.customIdea || "-"}
${storyBlock(brief)}
=== PILIHAN TAHAPAN (PILIH TEPAT SATU) ===
1. TOFU (Awareness & Discovery)
   Cocok bila: produk/brand belum dikenal, audiens dingin, butuh hook penghenti scroll dan cerita empati/lucu.
2. MOFU (Consideration, Trust & Objection Handling)
   Cocok bila: produk butuh edukasi cara kerja, pasar penuh keraguan, persaingan ketat, butuh bukti before-after atau uji nyata.
3. BOFU (Conversion & Urgency)
   Cocok bila: harga terjangkau/fast-moving, ada promo atau bundling, audiens sudah paham produk dan hanya perlu dorongan checkout.
4. Retention (Repeat Order & Advocacy)
   Cocok bila: produk habis pakai/rutin, ada varian baru, atau butuh konten loyalitas pelanggan lama.

=== BILA KESAKSIAN PENCERITA TERCANTUM DI ATAS, ITU BUKTI TERKUAT ===
Kesaksian memberi tahu persis di titik mana penonton berada, karena si pencerita dulu ADA di titik itu.
Baca dua beat ini sebagai penunjuk arah:
- Beat "Situasi & Pemicu" + "Puncak Kesal" -> seberapa sadar audiens akan masalahnya.
  Bila si pencerita dulu tidak sadar masalahnya sampai ada kejadian pemicu, audiens kemungkinan Unaware/Problem-Aware -> condong TOFU.
- Beat "Titik Balik" -> apa yang dulu menahan si pencerita membeli.
  Bila dia ragu karena pernah kecewa produk lain atau tidak percaya klaimnya, itu KERAGUAN, bukan urusan harga -> condong MOFU.
  Bila dia sebenarnya sudah tahu produknya bagus dan cuma butuh dorongan (promo, teman meyakinkan) -> condong BOFU.
- Beat "Bukti Perubahan" + "Rekomendasi" yang menyebut pemakaian berulang / kehabisan stok -> condong Retention.
Sebut kaitan ini secara eksplisit di "reasoning": kutip bagian kesaksian yang jadi dasar pilihanmu.
Selain itu, "funnelAngle" WAJIB diambil dari kejadian nyata dalam kesaksian — bukan template angle umum.

=== ATURAN JAWABAN ===
- Pilih berdasarkan KONDISI PRODUK dan KESAKSIAN di atas, bukan default. Bila harga tinggi dan klaim butuh pembuktian, jangan asal pilih BOFU.
- reasoning: 2-3 kalimat, sebut faktor konkret (harga, persaingan, tingkat keraguan), bukan alasan generik.
- funnelAngle: satu kalimat sudut cerita yang spesifik untuk produk ini — bukan template.
- recommendedHookFormula: tulis kalimat/aksi pembuka yang benar-benar diucapkan atau terlihat di 3 detik pertama.
- keyPointers: 3 arahan sutradara yang bisa langsung dieksekusi saat menulis naskah.
- recommendedGoal WAJIB salah satu dari: ${JSON.stringify(GOALS.map(g => g.key))}
- recommendedVideoType WAJIB salah satu dari: ${JSON.stringify(VIDEO_TYPES.map(v => v.name))}`,
    systemInstruction: "Kamu Chief Marketing Officer sekaligus UGC creative director yang terbiasa dengan direct-response dan funnel sequencing. Analisismu tajam, spesifik pada produk yang dibahas, dan langsung bisa dieksekusi. Jawab hanya JSON sesuai skema, dalam Bahasa Indonesia.",
    responseSchema: { type: "OBJECT", properties: {

      funnelAngle: { type: "STRING", description: "Sudut pesan naskah spesifik untuk stage ini, 1 kalimat padat." },
      reasoning: { type: "STRING", description: "2-3 kalimat alasan marketing berbasis kondisi produk DAN kesaksian pencerita bila ada. Kutip bagian kesaksian yang jadi dasar pilihan." },

      recommendedVideoType: { type: "STRING", enum: VIDEO_TYPES.map(v => v.name) },
      recommendedCta: { type: "STRING", description: "CTA yang sesuai tekanan stage funnel ini." },

    }, required: ["recommendedFunnel", "recommendedAwareness", "funnelAngle", "reasoning", "recommendedGoal", "recommendedHookFormula", "recommendedVideoType", "recommendedCta", "keyPointers"] }
  });

2. puncak — satu kejadian spesifik yang bikin dia akhirnya kesal dan mencari solusi. Ini bahan hook 3 detik.
3. titikBalik — bagaimana dia berkenalan dengan produk ini, termasuk keraguan awalnya. Jujur, bukan takdir ajaib.
4. bukti — perubahan yang TERLIHAT atau TERASA dalam keseharian, lengkap jangka waktunya. Wajar, jangan berlebihan.
5. rekomendasi — alasan pribadi kenapa dia repot-repot cerita ke orang lain.

ATURAN:
- Tiap beat 1-2 kalimat. Padat, konkret, terdengar seperti orang bicara, bukan menulis caption.

  const naskah = (scenes || []).map(sc => ({
    scene: sc.sceneNumber, vo: sc.voiceover,
    shots: (sc.shots || []).map(x => x.visualDescription)
  }));
  return genJSON({
    contents: `Nilai apakah naskah UGC berikut masih terasa KESAKSIAN ORANG, atau sudah berubah jadi iklan.

${RULE_STORY}
${storyBlock(brief)}
=== NASKAH YANG DINILAI ===
${JSON.stringify(naskah, null, 1)}

Produk: ${brief.productName || "-"} | CTA yang dituju: ${brief.cta || "-"}
Gaya video: ${meta.videoType} | Tone: ${meta.tone} | Funnel: ${brief.funnelStage || "-"}

=== YANG DINILAI (masing-masing 0-100) ===
- skorCerita: seberapa kuat naskah terasa pengalaman pribadi satu orang, bukan narasi merek.
- skorKejujuran: apakah ada keraguan/kegagalan/kekurangan yang diakui, atau semuanya mulus mencurigakan.
- skorHook: apakah 3 detik pertama benar-benar menghentikan scroll.
- skorRekomendasi: apakah ajakan di akhir terasa saran tulus, bukan perintah jualan.

Juga:
- kalimatIklan: kutip PERSIS kalimat dalam naskah yang berbau bahasa iklan/korporat. Array kosong bila tidak ada.
- beatHilang: beat cerita yang belum terasa (Situasi / Puncak Kesal / Titik Balik / Bukti Perubahan / Rekomendasi).
- perbaikan: maksimal 3 saran konkret yang langsung bisa dieksekusi. Sebut scene berapa.
- vonis: satu kalimat jujur — naskah ini layak tayang sebagai UGC atau perlu ditulis ulang.

Jujur dan tegas. Bila naskahnya memang lemah, katakan lemah.`,
    systemInstruction: "Kamu editor UGC yang galak tapi adil. Kamu hafal betul bedanya orang yang benar-benar cerita dengan orang yang sedang membacakan brief. Jawab hanya JSON sesuai skema, dalam Bahasa Indonesia.",
    responseSchema: { type: "OBJECT", properties: {
      skorCerita: { type: "INTEGER" }, skorKejujuran: { type: "INTEGER" },
      skorHook: { type: "INTEGER" }, skorRekomendasi: { type: "INTEGER" },

      vonis: { type: "STRING" }

  });
}

=== TUGAS ===
Buat PERSIS 5 konsep PURE UGC — satu untuk setiap MODE PRODUKSI berikut, berurutan, tidak boleh tertukar:

1. 1 Talent (On-Cam) — talent bicara langsung ke kamera seperti vlog pribadi atau cerita ke teman lewat video call, wajah terlihat jelas, setting natural di rumah.
2. 1 Talent (VO) — talent berakting/beraktivitas natural tanpa bicara ke kamera, narasi lewat voice over, terlihat seperti daily routine genuine.
3. 2 Talent (Drama) — dua orang berinteraksi natural seperti teman/pasangan/keluarga biasa ngobrol, BUKAN acting untuk iklan.
4. Faceless B-Roll — TANPA wajah sama sekali. Hanya tangan, produk, dan lingkungan natural + voice over. Terasa seperti POV personal.
5. Motion Graphic — TANPA manusia. Full animasi teks, grafis, dan produk bergerak.

PURE UGC berarti: semua ide (kecuali Motion Graphic) WAJIB terasa seperti konten personal spontan yang direkam di rumah sendiri dengan smartphone, BUKAN produksi iklan profesional. Setting harus natural dan lived-in (kamar berantakan oke, cahaya jendela oke, pakaian santai rumahan), perilaku spontan dan tidak dipoles.

Mode produksi menentukan CARA merekam. Tapi yang membuat kelimanya menarik adalah SUDUT CERITA-nya.
Karena itu, setiap konsep WAJIB memakai sudut cerita yang BERBEDA — pilih satu per konsep dan jangan diulang:
- Masalah: buka dari momen frustrasi paling spesifik. Penonton berpikir "ini gue banget" di 3 detik pertama.
- Penolakan: mulai dari keberatan yang bikin orang TIDAK beli (harga, ragu efektif, pernah kecewa), lalu patahkan.
- Kebiasaan Keliru: tunjukkan cara yang selama ini dianggap benar tapi salah, lalu perbaiki. Mengedukasi, bukan menggurui.
- Pembuktian: fokus pada hasil yang terlihat atau terukur. Bukan klaim, tapi demonstrasi natural.
- Kejutan: plot twist, perbandingan tak terduga, atau cara pakai yang tidak umum.

Pasangkan sudut ke mode yang paling masuk akal. Contoh: Faceless B-Roll cocok untuk Pembuktian atau Kebiasaan Keliru

- DILARANG dua ide punya premis, latar, atau kalimat pembuka yang mirip. Jika terasa mirip, ganti total.
- Tulis dengan bahasa lisan sehari-hari yang terdengar SPONTAN. DILARANG bahasa iklan: "solusi terbaik", "wajib punya", "dijamin", "nggak nyesel".
- Realistis untuk ${detik} detik. Jangan rancang cerita yang butuh 30 detik.
- Ide 4 (Faceless) DILARANG menampilkan wajah. Ide 5 (Motion Graphic) DILARANG menampilkan manusia sama sekali.
- PURE UGC SETTING: Semua ide talent-based (1-4) harus menggambarkan setting rumah natural (kamar dengan tempat tidur tidak rapi, sofa ruang tamu dengan buku/remote di meja, dapur dengan piring di wastafel) dan penampilan kasual sehari-hari (pakaian rumahan, rambut natural, makeup minimal/tanpa makeup). DILARANG setting studio bersih atau penampilan terlalu rapi/dipoles.

/* ---------- 4b. Klasifikasi props naskah ke 3 tipe ----------

async function aiClassifyProps({ scenes, brief }) {
  const productName = (brief.productName || "").trim().toLowerCase();
  const items = [];
  (scenes || []).forEach(sc => (sc.shots || []).forEach(sh => {
    const t = (sh.props || "").trim();
    if (!t) return;
    if (productName && t.toLowerCase().includes(productName)) return;
    if (!items.includes(t)) items.push(t);
  }));
  if (!items.length) return null;

  const aktif = Object.keys(brief.scenarioProps || {});
  const target = aktif.length ? aktif : ["comparison", "narrative", "decoration"];
  const arti = {
    comparison: "Props Pembanding — dibandingkan langsung (berdampingan/before-after) dengan produk utama",
    narrative: "Props Narasi/Problem — memvisualkan masalah/pain point SEBELUM produk solusi muncul",
    decoration: "Props Dekorasi/Set Dressing — elemen latar estetik saja, tanpa narasi khusus"
  };

  const j = await genJSON({
    contents: `Klasifikasikan setiap item properti berikut ke kategori paling tepat.

KATEGORI AKTIF:
${target.map(k => `- ${k}: ${arti[k]}`).join("\n")}
- none: pilih bila item bukan properti pendukung yang berdiri sendiri (misal: sebenarnya pakaian yang dikenakan talent, bagian tubuh, atau elemen yang tak layak dijadikan foto referensi terpisah).

DAFTAR PROPS (diekstrak dari naskah, per shot):
${items.map(x => `- ${x}`).join("\n")}

Konteks Produk: ${brief.productName || "-"} | Kategori: ${brief.productCategory || "-"}
Ide Cerita: ${brief.customIdea || "-"}`,
    systemInstruction: "Kamu asisten sutradara UGC yang teliti. Klasifikasikan tiap item ke TEPAT SATU kategori paling sesuai berdasarkan definisi kategori dan konteks skenario. Wajib sertakan SEMUA item yang diberikan, jangan ada yang terlewat.",
    responseSchema: { type: "OBJECT", properties: { classifications: { type: "ARRAY",
      description: "Satu objek per item props, semua item wajib ada.",
      items: { type: "OBJECT", properties: {
        propText: { type: "STRING" },
        category: { type: "STRING", enum: target.concat(["none"]) }
      }, required: ["propText", "category"] } } }, required: ["classifications"] }
  });

  const out = {};
  target.forEach(k => { out[k] = []; });
  (j.classifications || []).forEach(c => {
    const k = c && c.category;
    const t = ((c && c.propText) || "").trim();
    if (t && target.indexOf(k) >= 0 && out[k].indexOf(t) < 0) out[k].push(t);
  });
  /* fallback: bila AI gagal total, sebar rata agar panel 4.3 tidak kosong */
  if (!target.some(k => out[k].length)) {
    let n = 0;
    target.forEach(k => { out[k] = items.slice(n, n + 3); n += 3; });
  }
  return out;
}

  const prompt = solo

    : `Buat SATU gambar panel referensi yang menyusun SEMUA produk dari foto-foto terlampir berdampingan dalam satu baris horizontal rapi dengan pemisah garis tipis, di atas latar putih bersih polos yang seragam. Produk: ${name}.
